<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frontier — Celestial Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Outfit','General Sans','Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --glass:rgba(15,16,18,.74); --g2:rgba(255,255,255,.045); --g3:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.07); --stroke2:rgba(255,255,255,.13);
  --text:rgba(255,255,255,.94); --t2:rgba(255,255,255,.56); --t3:rgba(255,255,255,.32);
  --warm:rgba(120,70,55,.26); --warm-stroke:rgba(255,160,120,.12);
  --red:#ff3b30; --green:#34c759; --yellow:#e5d33a; --orange:#ffb454;
  --ease:cubic-bezier(.22,.61,.36,1); --spring:cubic-bezier(.175,.885,.32,1.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:var(--font);color:var(--text);font-size:14px;font-weight:300;-webkit-font-smoothing:antialiased;user-select:none;letter-spacing:.01em}
svg{display:block} canvas.prev{display:block;width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;cursor:grab} #gl.drag{cursor:grabbing}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45))}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(1.3);-webkit-backdrop-filter:blur(28px) saturate(1.3);border:1px solid var(--stroke);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05)}

/* top bar */
#topbar{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:10px}
.pill{height:52px;border-radius:999px;display:flex;align-items:center;gap:12px;padding:0 10px 0 8px}
.round{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--g2);border:1px solid var(--stroke);transition:background .2s,transform .2s var(--spring)}
.round:hover{background:var(--g3)} .round:active{transform:scale(.94)} .round.on{background:#fff;color:#000}
#clock{font-weight:200;font-size:26px;letter-spacing:.02em;min-width:80px;text-align:center;font-variant-numeric:tabular-nums}
#clock small{font-size:12px;color:var(--t3);margin-left:4px}
/* day ring scrubber */
#dayTrack{width:300px;height:36px;position:relative;cursor:ew-resize}
#dayTrack canvas{width:100%;height:100%;display:block;border-radius:8px}
#dayTrack .cur{position:absolute;top:2px;bottom:2px;width:2px;background:#fff;border-radius:2px;box-shadow:0 0 10px #fff;pointer-events:none}
.speed{display:flex;gap:4px;background:var(--g2);border:1px solid var(--stroke);border-radius:999px;padding:3px}
.speed button{height:30px;padding:0 12px;border-radius:999px;font-size:12px;color:var(--t2);transition:all .2s}
.speed button.on{background:#fff;color:#000;font-weight:500}
.phase-badge{display:flex;align-items:center;gap:8px;padding:0 16px;height:52px;border-radius:999px;font-size:13px;color:var(--t2)}
.phase-badge b{font-weight:400;color:var(--text)} .phase-badge i{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 10px var(--orange)}

/* outliner */
#outliner{position:fixed;top:18px;left:18px;bottom:18px;width:300px;border-radius:28px;z-index:15;display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:22px 22px 12px;display:flex;align-items:center;justify-content:space-between}
.panel-head h1{font-size:20px;font-weight:300;display:flex;align-items:center;gap:10px}
.panel-head h1 span.sub{color:var(--t3);font-size:12px;margin-left:4px}
.search{margin:0 14px 8px;height:40px;border-radius:999px;background:var(--g2);border:1px solid var(--stroke);display:flex;align-items:center;padding:0 14px;gap:10px;color:var(--t3)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:13px;font-weight:300}
.search input::placeholder{color:var(--t3)}
.filters{display:flex;gap:5px;padding:0 14px 8px;flex-wrap:wrap}
.filters button{height:26px;padding:0 10px;border-radius:999px;font-size:11px;color:var(--t3);border:1px solid var(--stroke);background:transparent;display:flex;align-items:center;gap:6px;transition:all .2s}
.filters button i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.filters button.on{background:var(--g3);color:var(--text);border-color:var(--stroke2)}
.tree{flex:1;overflow:auto;padding:2px 10px 10px} .tree::-webkit-scrollbar{width:0}
/* strata (folder) */
.stratum{margin-bottom:8px;border-radius:18px;background:rgba(255,255,255,.025);border:1px solid var(--stroke);overflow:hidden;transition:background .2s}
.stratum.open{background:rgba(255,255,255,.035)}
.stratum-head{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px 0 12px;cursor:pointer;position:relative}
.stratum-head::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc,#fff);opacity:.7}
.stratum-head .chev{width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--t3);transition:transform .25s var(--spring)}
.stratum.open .stratum-head .chev{transform:rotate(90deg)}
.stratum-head .name{flex:1;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--t2)}
.stratum-head .swatches{display:flex} .stratum-head .swatches i{width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid #101113;margin-left:-5px;box-shadow:0 0 6px var(--c)}
.stratum-head .count{font-size:11px;color:var(--t3);background:rgba(255,255,255,.06);padding:2px 8px;border-radius:999px;margin-left:6px}
.stratum-head:hover .name{color:var(--text)}
.stratum-head.sel{background:var(--g3)} .stratum-head.sel .name{color:var(--text)}
.stratum-body{padding:0 6px 6px;transition:max-height .35s var(--ease),opacity .25s;overflow:hidden}
.stratum:not(.open) .stratum-body{max-height:0!important;opacity:0;padding:0 6px}
/* rows */
.row{display:flex;align-items:center;gap:10px;height:46px;padding:0 8px 0 8px;border-radius:13px;cursor:pointer;transition:background .18s,transform .18s var(--spring);position:relative;color:var(--t2)}
.row:hover{background:var(--g2);color:var(--text)}
.row.sel{background:rgba(255,255,255,.09);color:var(--text);box-shadow:inset 0 0 0 1px var(--stroke2)}
.row .ico{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc,#fff);flex-shrink:0;position:relative}
.row.sel .ico{box-shadow:0 0 14px -2px var(--acc)}
.row .ico .live{position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:50%;background:var(--green);border:2px solid #121315;display:none}
.row.active .ico .live{display:block}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.row .meta{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .eye{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--t3);opacity:0;transition:all .2s}
.row:hover .eye,.row.sel .eye,.row .eye.off{opacity:1}
.row .eye:hover{background:var(--g3);color:var(--text)} .row .eye.off{color:var(--red)}
.row.dim .name,.row.dim .ico,.row.dim .meta{opacity:.35}
.row .tag{font-size:9px}
.row.child{height:40px;margin-left:22px;position:relative}
.row.child::before{content:'';position:absolute;left:-12px;top:50%;width:9px;height:1px;background:rgba(255,255,255,.18)}
.row.child .ico{width:24px;height:24px;border-radius:8px}
.moon-dot{width:16px;height:16px;border-radius:50%;background:var(--tex) center/200% 100%;box-shadow:inset -4px -3px 6px rgba(0,0,0,.7),inset 1px 1px 2px rgba(255,255,255,.3)}
.kids{position:relative} .kids::before{content:'';position:absolute;left:19px;top:0;bottom:12px;width:1px;background:rgba(255,255,255,.14)}
.outliner-foot{padding:12px 14px 14px;border-top:1px solid var(--stroke);display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;height:32px;padding:0 11px;border-radius:999px;background:var(--g2);border:1px solid var(--stroke);font-size:12px;color:var(--t2)}
.chip b{font-weight:400;color:var(--text);font-variant-numeric:tabular-nums} .chip i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
/* inspector */
#inspector{position:fixed;top:18px;right:18px;bottom:18px;width:392px;border-radius:28px;z-index:15;display:flex;flex-direction:column;overflow:hidden}
.insp-scroll{flex:1;overflow:auto;padding:0 14px 18px} .insp-scroll::-webkit-scrollbar{width:0}
.ent-enter{animation:entIn .45s var(--spring) both} @keyframes entIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.hero{background:var(--g2);border:1px solid var(--stroke);border-radius:22px;padding:18px 20px 16px;margin-bottom:12px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(400px 120px at 20% 0%,color-mix(in srgb,var(--acc) 14%,transparent),transparent 70%);pointer-events:none}
.label-bar{display:flex;align-items:center;gap:10px;font-size:15px}
.label-bar::before{content:'';width:3px;height:16px;border-radius:2px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.label-bar em{font-style:normal;color:var(--t3);font-size:11px;margin-left:auto;text-transform:uppercase;letter-spacing:.08em}
.big{display:flex;align-items:baseline;gap:6px;margin:10px 0 2px;position:relative}
.big .v{font-size:50px;font-weight:200;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.big .v small{font-size:30px;color:var(--t3);font-weight:200} .big .u{font-size:18px;color:var(--t3)}
.big .trend{margin-left:auto;color:var(--t2)}
.delta{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--t2);font-variant-numeric:tabular-nums}
.delta.pos{background:rgba(52,199,89,.12);color:#5fd77f} .delta.neg{background:rgba(255,59,48,.12);color:#ff7a70}
.preview{margin-top:14px;position:relative;border-radius:14px;overflow:hidden;background:rgba(0,0,0,.35);border:1px solid var(--stroke)}
.preview .cap{position:absolute;left:10px;top:8px;font-size:10px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
.preview .cap.r{left:auto;right:10px}
.preview svg{width:100%;height:auto}
.sec{background:var(--g2);border:1px solid var(--stroke);border-radius:22px;margin-bottom:10px;overflow:hidden}
.sec.warm{background:linear-gradient(180deg,var(--warm),rgba(70,45,40,.16));border-color:var(--warm-stroke)}
.sec-head{display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;cursor:pointer}
.sec-head .sico{color:var(--t2);width:18px;display:flex;justify-content:center}
.sec-head .t{font-size:15px} .sec-head .t span{color:var(--t3);margin-left:6px;font-size:13px}
.sec-head .badge{margin-left:auto;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);border:1px solid var(--stroke);padding:3px 8px;border-radius:999px}
.sec-head .chev{margin-left:8px;color:var(--t3);transition:transform .3s var(--spring)} .sec.closed .sec-head .chev{transform:rotate(-180deg)}
.sec-body{padding:0 16px 14px;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px} .sec.closed .sec-body{display:none}

/* ─── custom controls ─── */
.ctl{grid-column:span 2;padding:10px 0 4px;border-top:1px solid rgba(255,255,255,.04)}
.ctl:first-child,.ctl.half+.ctl.half:nth-child(2){border-top:0}
.ctl-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-height:22px}
.ctl-top .l{font-size:13px;color:var(--t2)} .ctl-top .l small{display:block;font-size:11px;color:var(--t3);margin-top:1px}
.vwrap{display:flex;align-items:baseline;gap:3px;font-variant-numeric:tabular-nums}
.vwrap input.val{width:66px;background:none;border:0;outline:0;text-align:right;font-family:var(--font);font-weight:200;font-size:22px;color:var(--text);padding:0;cursor:text;border-bottom:1px solid transparent;transition:border-color .2s}
.vwrap input.val:focus{border-bottom-color:var(--stroke2)}
.vwrap .u{font-size:12px;color:var(--t3);min-width:14px}
/* tick track */
.trk-bar{position:relative;height:30px;margin-top:4px;cursor:ew-resize;touch-action:none}
.trk-bar .ticks{position:absolute;left:0;right:0;top:12px;height:12px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 1.5px,transparent 1.5px 6px)}
.trk-bar .major{position:absolute;left:0;right:0;top:6px;height:18px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.24) 0 1.5px,transparent 1.5px 30px)}
.trk-bar .fill{position:absolute;left:0;top:12px;height:12px;width:var(--p);background:repeating-linear-gradient(90deg,#fff 0 1.5px,transparent 1.5px 6px)}
.trk-bar .fillmaj{position:absolute;left:0;top:6px;height:18px;width:var(--p);background:repeating-linear-gradient(90deg,#fff 0 1.5px,transparent 1.5px 30px)}
.trk-bar .thumb{position:absolute;top:50%;left:var(--p);width:14px;height:14px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.6);transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(255,255,255,.08),0 2px 8px rgba(0,0,0,.6);transition:transform .15s var(--spring)}
.trk-bar:hover .thumb{transform:translate(-50%,-50%) scale(1.15)}
.trk-bar .mark{position:absolute;top:50%;width:6px;height:6px;border-radius:50%;background:var(--red);transform:translate(-50%,-50%);pointer-events:none}
/* dial */
.ctl.half{grid-column:span 1}
.dial-wrap{display:flex;align-items:center;gap:12px;margin-top:6px}
.dial-svg{width:74px;height:74px;cursor:grab;touch-action:none;flex-shrink:0} .dial-svg:active{cursor:grabbing}
.dial-svg .track{fill:none;stroke:rgba(255,255,255,.1);stroke-width:5;stroke-linecap:round}
.dial-svg .arc{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round}
.dial-svg .knob{fill:#fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.6))}
.dial-svg .tick{stroke:rgba(255,255,255,.25);stroke-width:1.5}
.dial-meta{display:flex;flex-direction:column;gap:2px} .dial-meta .vwrap input.val{text-align:left;width:70px;font-size:24px}
.dial-meta .hint2{font-size:11px;color:var(--t3)}
/* stepper */
.step{display:flex;align-items:center;gap:8px}
.step button{width:30px;height:30px;border-radius:50%;background:var(--g2);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;color:var(--t2)}
.step button:hover{background:var(--g3);color:var(--text)}
.step .dots{display:flex;gap:5px} .step .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.14)} .step .dots i.on{background:#fff;box-shadow:0 0 8px rgba(255,255,255,.6)}
/* toggle */
.sw{width:46px;height:26px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;transition:background .25s;cursor:pointer;border:1px solid var(--stroke)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .3s var(--spring);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.sw.on{background:var(--green)} .sw.on::after{transform:translateX(20px)}
/* colour */
.colorbtn{display:flex;align-items:center;gap:10px;height:32px;padding:0 4px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--stroke);position:relative;cursor:pointer}
.colorbtn .sw2{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15),0 0 14px -2px var(--c)}
.colorbtn code{font-family:var(--mono);font-size:12px;color:var(--t2);padding-right:10px;text-transform:uppercase}
.colorbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
/* segmented */
.seg{display:flex;gap:3px;background:rgba(0,0,0,.35);border:1px solid var(--stroke);border-radius:999px;padding:3px;flex-wrap:wrap;justify-content:flex-end}
.seg button{height:26px;padding:0 11px;border-radius:999px;font-size:12px;color:var(--t2);transition:all .2s;white-space:nowrap}
.seg button.on{background:#fff;color:#000;font-weight:500} .seg button:hover:not(.on){background:var(--g3);color:var(--text)}
/* temperature ramp */
.ramp{height:10px;border-radius:999px;margin-top:8px;background:linear-gradient(90deg,#ff7a1a,#ffb46b,#ffd9b0,#fff4e6,#ffffff,#dbe7ff,#b6ccff)}
/* atlas */
.atlas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;grid-column:span 2;padding-top:8px}
.atlas .card{border-radius:16px;background:rgba(0,0,0,.35);border:1px solid var(--stroke);padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:all .2s var(--ease);position:relative}
.atlas .card:hover{background:var(--g3);transform:translateY(-2px)} .atlas .card.on{box-shadow:inset 0 0 0 1.5px #fff}
.atlas .card canvas{width:56px;height:56px;border-radius:50%}
.atlas .card span{font-size:12px;color:var(--t2)} .atlas .card small{font-size:10px;color:var(--t3)}
.atlas .card .plus{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.atlas .card:hover .plus{opacity:1}
.phase-strip{display:flex;justify-content:space-between;grid-column:span 2;padding:8px 2px 2px}
.phase-strip canvas{width:30px;height:30px;border-radius:50%;cursor:pointer;opacity:.55;transition:all .2s} .phase-strip canvas:hover{opacity:1} .phase-strip canvas.on{opacity:1;box-shadow:0 0 0 2px #fff}
.action{grid-column:span 2;height:42px;border-radius:999px;background:#fff;color:#000;font-weight:500;font-size:13px;margin-top:8px;transition:transform .2s var(--spring)}
.action:active{transform:scale(.98)} .action.ghost{background:var(--g2);color:var(--text);border:1px solid var(--stroke)} .action.danger{background:rgba(255,59,48,.14);color:#ff8a80;border:1px solid rgba(255,59,48,.25)}
.hint{font-size:11px;color:var(--t3);padding:6px 4px 0;line-height:1.5}
.empty{padding:60px 20px;text-align:center;color:var(--t3);font-size:13px;line-height:1.6}
.nav{display:flex;align-items:center;gap:14px;height:48px;padding:0 16px 0 10px;border-radius:999px;transition:box-shadow .3s}
.nav.flash{box-shadow:0 0 0 1px rgba(255,255,255,.25),0 30px 80px rgba(0,0,0,.55)}
.keys{display:flex;gap:4px} .k{width:24px;height:24px;border-radius:7px;background:var(--g2);border:1px solid var(--stroke);font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--t2);transition:all .12s}
.k.dim{color:var(--t3)} .k.on{background:#fff;color:#000;border-color:#fff;transform:translateY(-1px)}
.navmeta{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--t3)} .navmeta b{font-weight:200;font-size:20px;color:var(--text);font-variant-numeric:tabular-nums} .navmeta em{font-style:normal}
.navmeta.small span{font-size:11px;white-space:nowrap}
.speedbar{width:70px;height:4px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden} .speedbar i{display:block;height:100%;width:30%;background:#fff;border-radius:999px;transition:width .15s}
#hud{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:12;display:flex;gap:8px}
@media (max-width:1200px){#outliner{width:260px}#inspector{width:350px}#dayTrack{width:200px}}
</style>
</head>
<body>
<canvas id="gl"></canvas><div id="vignette"></div>

<div id="topbar">
  <div class="pill glass">
    <button class="round" id="playBtn"><svg id="playIco" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
    <div id="clock">06:24<small>SAST</small></div>
    <div id="dayTrack"><canvas id="dayCanvas" width="600" height="72"></canvas><div class="cur" id="dayCur"></div></div>
    <div class="speed" id="speedSeg"><button data-s="0.02">×1</button><button data-s="0.15" class="on">×8</button><button data-s="0.6">×30</button><button data-s="2">×100</button></div>
  </div>
  <div class="phase-badge glass"><i id="phaseDot"></i><span id="phaseTxt"><b>Civil dawn</b></span></div>

<script id="fs" type="x-shader/x-fragment">
#extension GL_OES_standard_derivatives : enable
precision highp float;
#define PI 3.14159265
#define MAXM 4
uniform vec2 uRes; uniform float uTime;
uniform vec3 uCamFwd,uCamRight,uCamUp,uCamPos; uniform float uTanHalf,uCamHeight;
uniform float uPlaneOn,uPlaneSize,uPlaneCell,uPlaneY,uPlaneGrid; uniform vec3 uPlaneA,uPlaneB;
uniform vec3 uSunDir,uSunColor; uniform float uSunIntensity,uSunAng,uSunSoft,uSunVisible,uSunDiscBoost;
uniform float uRayleigh,uMie,uMieG,uOzone,uPlanetR,uAtmoH,uHr,uHm,uAtmoVisible;
uniform vec3 uSkyTint,uGroundColor; uniform float uSkyBright,uGroundBright,uSkyVisible,uHLInt,uDawnInt,uHLAuto;
uniform int uMoonCount; uniform vec3 uMoonDir[MAXM]; uniform vec3 uMoonTint[MAXM]; uniform vec4 uMoonP[MAXM]; uniform vec4 uMoonSurf[MAXM]; uniform sampler2D uMoonTex0,uMoonTex1,uMoonTex2,uMoonTex3;
uniform float uEV,uTonemap,uBloom,uVignette,uGrain,uFlareOn,uFlareInt,uGhosts,uHalo,uStreak,uChroma,uFlareType;
uniform vec2 uSunUV; uniform float uSunInFront;

vec3 hash33(vec3 p){ p=fract(p*vec3(.1031,.1030,.0973)); p+=dot(p,p.yxz+33.33); return fract((p.xxy+p.yxx)*p.zyx); }
float hash13(vec3 p){ p=fract(p*.1031); p+=dot(p,p.zyx+31.32); return fract((p.x+p.y)*p.z); }
float vnoise(vec3 p){ vec3 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x),mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x),mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=.5,s=0.; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5;} return s; }

vec2 rsi(vec3 ro,vec3 rd,float r){ float b=dot(ro,rd); float c=dot(ro,ro)-r*r; float d=b*b-c; if(d<0.) return vec2(-1.,-1.); d=sqrt(d); return vec2(-b-d,-b+d); }
void atmosphere(vec3 ro,vec3 rd,out vec3 sky,out vec3 trans,out float ground){
  sky=vec3(0.); trans=vec3(1.); ground=0.;
  float Ra=uPlanetR+uAtmoH; vec2 ta=rsi(ro,rd,Ra); if(ta.y<0.) return;
  float t0=max(ta.x,0.), t1=ta.y; vec2 tg=rsi(ro,rd,uPlanetR); if(tg.x>0.){ t1=tg.x; ground=1.; }
  const int N=20; const int NL=8; float len=t1-t0;
  vec3 betaR=vec3(5.8e-6,13.5e-6,33.1e-6)*uRayleigh; vec3 betaM=vec3(21e-6)*uMie; vec3 betaO=vec3(0.65e-6,1.881e-6,0.085e-6)*uOzone;
  vec3 sumR=vec3(0.),sumM=vec3(0.); float odR=0.,odM=0.; float mu=dot(rd,uSunDir); float g=uMieG;
  float pR=3./(16.*PI)*(1.+mu*mu); float pM=3./(8.*PI)*((1.-g*g)*(1.+mu*mu))/((2.+g*g)*pow(1.+g*g-2.*g*mu,1.5));
  for(int i=0;i<N;i++){
    float s0=float(i)/float(N), s1=float(i+1)/float(N); s0*=s0; s1*=s1;           // quadratic: dense near the camera
    float ta=t0+len*s0, tb=t0+len*s1; float seg=tb-ta; float tm=.5*(ta+tb);
    vec3 p=ro+rd*tm; float h=length(p)-uPlanetR; float hr=exp(-h/uHr)*seg, hm=exp(-h/uHm)*seg; odR+=hr; odM+=hm;
    vec2 tl=rsi(p,uSunDir,Ra); float lenL=tl.y; float olR=0.,olM=0.; bool ok=true;
    for(int j=0;j<NL;j++){ float q0=float(j)/float(NL), q1=float(j+1)/float(NL); q0*=q0; q1*=q1; float segL=lenL*(q1-q0); vec3 q=p+uSunDir*(lenL*.5*(q0+q1)); float hq=length(q)-uPlanetR; if(hq<0.){ok=false;break;} olR+=exp(-hq/uHr)*segL; olM+=exp(-hq/uHm)*segL; }
    if(ok){ vec3 att=exp(-(betaR*(odR+olR)+betaM*1.1*(odM+olM)+betaO*(odR+olR))); sumR+=att*hr; sumM+=att*hm; }
  }
  trans=exp(-(betaR*odR+betaM*1.1*odM+betaO*odR));
  sky=(sumR*betaR*pR+sumM*betaM*pM)*uSunIntensity*uSunColor;
}

/* ---- moons: UV-sphere textured ---- */
vec3 moonTex(int i,vec2 uv){ if(i==0) return texture2D(uMoonTex0,uv).rgb; if(i==1) return texture2D(uMoonTex1,uv).rgb; if(i==2) return texture2D(uMoonTex2,uv).rgb; return texture2D(uMoonTex3,uv).rgb; }
vec3 moons(vec3 d,vec3 trans){
  vec3 col=vec3(0.);
  for(int i=0;i<MAXM;i++){ if(i>=uMoonCount) break;
    vec3 md=uMoonDir[i]; float ang=uMoonP[i].x, bright=uMoonP[i].y, phase=uMoonP[i].z, glowAmt=uMoonP[i].w;
    float spin=uMoonSurf[i].x, tilt=uMoonSurf[i].y, haze=uMoonSurf[i].z, gam=uMoonSurf[i].w;
    float a=acos(clamp(dot(d,md),-1.,1.));
    vec3 u=normalize(cross(md,vec3(0.,1.,0.))); vec3 v=cross(u,md);
    if(a<ang*1.06){
      vec2 lc=vec2(dot(d,u),dot(d,v))/sin(ang); float r2=dot(lc,lc); float z=sqrt(max(0.,1.-r2));
      // sphere normal in the moon's local frame (x=u right, y=v up, z=toward viewer)
      vec3 n=vec3(lc.x,lc.y,z);
      // axial tilt then spin -> UV
      float ct=cos(tilt),st=sin(tilt); vec3 nt=vec3(n.x,n.y*ct-n.z*st,n.y*st+n.z*ct);
      float lon=atan(nt.x,nt.z)+spin; float lat=asin(clamp(nt.y,-1.,1.));
      vec2 uv=vec2(fract(lon/(2.*PI)+.5),.5-lat/PI);
      vec3 alb=moonTex(i,uv); alb=pow(alb,vec3(gam))*uMoonTint[i];
      // phase lighting: light direction rotates around v in the u/z plane
      float ph=phase*2.*PI; vec3 lit=vec3(sin(ph),0.,cos(ph));
      float wrap=haze*.3; float ndl=max((dot(n,lit)+wrap)/(1.+wrap),0.);
      float edgeW=mix(.975,.88,haze); float edge=1.-smoothstep(ang*edgeW,ang*(1.+haze*.06),a);
      float limb=mix(1.,.5,pow(1.-z,2.)*max(haze,.35));
      col+=alb*bright*(pow(ndl,.8)*limb+.012)*edge;
      float rimA=smoothstep(ang*.8,ang,a)*(1.-smoothstep(ang,ang*1.06,a))*haze; col+=rimA*uMoonTint[i]*bright*.35*(.3+.7*ndl);
    }
    float lum=.4+.6*(.5+.5*cos(phase*2.*PI)); float g=glowAmt*bright*(exp(-a/(ang*1.4))*.09+exp(-a*3.5)*.005)*lum; col+=g*uMoonTint[i];
  }
  return col*trans;
}

/* ---- twilight model: bright segment, colour ramp and the pre-sunrise white line ---- */
vec3 dawnGlow(vec3 dir,float elevDeg,float facing){
  float alt=degrees(asin(clamp(dir.y,-1.,1.))); if(alt<-2.) return vec3(0.);
  float altp=max(alt,0.);
  float dAz=acos(clamp(facing*2.-1.,-1.,1.));                       // 0 at the sun's azimuth
  float az=exp(-pow(dAz/.95,2.));                                   // segment ~55 deg half width
  float azWide=exp(-pow(dAz/1.8,2.));
  float tw=smoothstep(-16.,-5.,elevDeg)*(1.-smoothstep(.5,6.,elevDeg));
  float depth=clamp(-elevDeg/10.,0.,1.);                             // 1 = deep twilight, 0 = sun at horizon
  // colour by altitude, log spaced
  vec3 c0=vec3(1.,.88,.62); vec3 c1=vec3(1.,.62,.28); vec3 c2=vec3(.95,.42,.30); vec3 c3=vec3(.62,.36,.48); vec3 c4=vec3(.25,.30,.58);
  float u=log2(1.+altp*2.);
  vec3 c=mix(c0,c1,smoothstep(0.,1.6,u)); c=mix(c,c2,smoothstep(1.6,2.9,u)); c=mix(c,c3,smoothstep(2.9,4.,u)); c=mix(c,c4,smoothstep(4.,5.2,u));
  c=mix(c,mix(c2,c4,.6),depth*.6);                                   // deep twilight: pinker, no yellow
  // low, tight envelope: glow hugs the horizon and doesn't bleach the dome
  float H=mix(1.9,3.8,depth);
  float env=exp(-altp/H)*(1.-depth*.35);
  float rim=exp(-altp/.45)*(1.-depth);                               // bright rim only when the sun is very near
  vec3 glow=(c*env*.30+c0*rim*.25)*(az*.85+azWide*.15)*tw;
  // the white line: soft hairline centred on the sun, only from ~-5.5 deg to sunrise, then handed over to the disc
  float wlWin=mix(1.,smoothstep(-5.5,-2.5,elevDeg)*(1.-smoothstep(-.6,.3,elevDeg)),uHLAuto);
  float lineAz=exp(-pow(dAz/.55,2.));
  float line=exp(-pow(alt/.11,2.))*(.7+.3*smoothstep(-.4,0.,alt));
  glow+=vec3(1.,.98,.92)*line*lineAz*wlWin*uHLInt*.45;
  // cool twilight dome fill: earth-shadow blue that dominates high up and opposite the sun
  float domeWin=smoothstep(-16.,-8.,elevDeg)*(1.-smoothstep(-2.,4.,elevDeg));
  glow+=vec3(.10,.15,.30)*.035*domeWin*(1.-exp(-altp/6.))*(1.-.5*az);
  return glow*uDawnInt;
}
float airMassOf(float e){ float z=90.-e; if(z>=96.) return 40.; return min(40.,1./(cos(radians(z))+.50572*pow(96.07995-z,-1.6364))); }
/* ---- lens flare ---- */
vec3 hue(float h){ return clamp(abs(mod(h*6.+vec3(0,4,2),6.)-3.)-1.,0.,1.); }
vec3 lensFlare(vec2 uv,vec2 s,float vis){
  vec3 f=vec3(0.); vec2 m=uv-s; float type=uFlareType;
  float wGhost=(type==0.||type==2.)?1.:0.; float wHalo=(type==0.||type==3.)?1.:(type==2.?.5:0.);
  float wStreak=(type==1.)?2.2:(type==0.?1.:.35); float wBurst=(type==2.)?1.:(type==0.?.35:0.);
  for(int i=0;i<8;i++){ if(float(i)>=uGhosts) break; float fi=float(i);
    float k=-1.35+fi*.42; vec2 p=s*k; float r=.035+.07*fract(fi*.618+.31); float dd=length(uv-p);
    float g=smoothstep(r,r*.35,dd)*.9+smoothstep(r*1.6,r,dd)*.25; g*=(.06+.06*fract(fi*.37));
    f+=g*mix(vec3(1.),hue(fract(fi*.23+.5)),uChroma)*wGhost; }
  float hr=length(uv-s*.25); float ringd=abs(hr-uHalo); float halo=smoothstep(.045,0.,ringd)*.09;
  float ang=atan(uv.y-s.y*.25,uv.x-s.x*.25); f+=halo*mix(vec3(1.),hue(fract(ang/6.283+ringd*8.)),uChroma*.8)*wHalo;
  float streak=exp(-abs(m.y)*95.)*exp(-abs(m.x)*2.2)*.55; f+=streak*uStreak*mix(vec3(1.),vec3(.45,.65,1.),uChroma)*wStreak;
  float a=atan(m.y,m.x); float burst=pow(abs(sin(a*4.+.3)),24.)*exp(-length(m)*3.5)*.35+pow(abs(sin(a*7.)),40.)*exp(-length(m)*6.)*.25;
  f+=burst*vec3(1.,.95,.85)*wBurst; f+=exp(-length(m)*1.6)*.04*vec3(1.,.9,.8);
  return f*vis*uFlareInt;
}
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
vec3 uc2(vec3 x){ float A=.15,B=.5,C=.1,D=.2,E=.02,F=.3; return ((x*(A*x+C*B)+D*E)/(x*(A*x+B)+D*F))-E/F; }
vec3 filmic(vec3 c){ return uc2(c*2.)/uc2(vec3(11.2)); }
vec3 agxish(vec3 c){ c=max(c,0.); vec3 x=log2(c+1e-5); x=clamp((x+12.47)/16.5,0.,1.); return x*x*(3.-2.*x); }

void main(){
  vec2 uv=(gl_FragCoord.xy*2.-uRes)/uRes.y;
  vec3 dir=normalize(uCamFwd+uCamRight*uv.x*uTanHalf+uCamUp*uv.y*uTanHalf);
  vec3 ro=vec3(0.,uPlanetR+uCamHeight,0.);
  vec3 sky,trans; float ground; atmosphere(ro,dir,sky,trans,ground);
  sky*=uSkyTint*uSkyBright*uSkyVisible*uAtmoVisible; if(uAtmoVisible<.5) trans=vec3(1.);
  float elevDeg=degrees(asin(clamp(uSunDir.y,-1.,1.))); float sunUp=smoothstep(-6.,4.,elevDeg);
  float skyLum=dot(sky,vec3(.2126,.7152,.0722)); float nightFade=clamp(1.-skyLum*14.,0.,1.);
  vec2 hxz=normalize(dir.xz+1e-5); vec2 sxz=normalize(uSunDir.xz+1e-5); float facing=.5+.5*dot(hxz,sxz);
  float hdrScale=uSunIntensity/22.*uSkyBright*uSkyVisible;
  vec3 glow=dawnGlow(dir,elevDeg,facing)*hdrScale;                                    // this direction
  vec3 hzGlow=dawnGlow(normalize(vec3(dir.x,0.,dir.z)+1e-5),elevDeg,facing)*hdrScale;  // at the horizon (for fog)
  vec3 col=vec3(0.);
  // ---- checker plane (local flat world, intersect before atmosphere ground) ----
  float planeHit=0.; vec3 planeCol=vec3(0.); float planeT=1e9;
  if(uPlaneOn>.5 && dir.y<-1e-4){
    float t=(uPlaneY-uCamPos.y)/dir.y; vec3 hp=uCamPos+dir*t;
    if(t>0.){
      planeHit=1.; planeT=t; float inChk=step(max(abs(hp.x),abs(hp.z)),uPlaneSize);
      // anti-aliased checker (filtered via fwidth)
      vec2 q=hp.xz/uPlaneCell; vec2 w=fwidth(q)*1.5+1e-4;
      vec2 i=2.*(abs(fract((q-.5*w)*.5)-.5)-abs(fract((q+.5*w)*.5)-.5))/w;
      float chk=.5-.5*i.x*i.y;
      vec3 alb=mix(uPlaneA,mix(uPlaneA,uPlaneB,chk),inChk);
      // grid lines every cell + bold every 10
      vec2 g1=abs(fract(q-.5)-.5)/(fwidth(q)+1e-4); float line=1.-min(min(g1.x,g1.y),1.);
      vec2 g10=abs(fract(q/10.-.5)-.5)/(fwidth(q/10.)+1e-4); float line10=1.-min(min(g10.x,g10.y),1.);
      alb=mix(alb,alb*.55,line*uPlaneGrid*.6*inChk); alb=mix(alb,vec3(.35,.4,.5),line10*uPlaneGrid*.8*inChk);
      // axis lines
      float ax=1.-min(abs(hp.z)/(fwidth(hp.z)*1.5+1e-4),1.); float az=1.-min(abs(hp.x)/(fwidth(hp.x)*1.5+1e-4),1.);
      alb=mix(alb,vec3(.95,.25,.3),ax*uPlaneGrid); alb=mix(alb,vec3(.25,.55,.95),az*uPlaneGrid);
      // lighting: sun + sky ambient, soft shadow-less lambert, distance fog into sky colour
      float ndl=max(uSunDir.y,0.); vec3 sunL=trans*uSunColor*uSunIntensity*.11*ndl;
      // hemispherical ambient: mostly zenith sky, a little horizon glow, tiny floor so it never goes fully black
      vec3 amb=sky*.42+hzGlow*.08+vec3(.0015,.002,.004)*uSkyBright;
      // moon light contribution
      for(int k=0;k<MAXM;k++){ if(k>=uMoonCount) break; amb+=uMoonTint[k]*uMoonP[k].y*max(uMoonDir[k].y,0.)*.0025*(.5+.5*cos(uMoonP[k].z*6.2832)); }
      planeCol=alb*(sunL+amb);
      float fog=1.-exp(-t*7e-5); fog=pow(clamp(fog,0.,1.),1.6); planeCol=mix(planeCol,sky*.8+hzGlow*.6,fog);
    }
  }
  if(planeHit>.999){ col=planeCol; }
  else if(ground>.5){
    float ndl=max(uSunDir.y,0.); vec3 sunL=trans*uSunColor*uSunIntensity*.09*ndl; vec3 amb=sky*.35+vec3(.002,.003,.006)*uSkyBright;
    col=uGroundColor*uGroundBright*(sunL+amb)+sky;
    col=mix(col,planeCol,planeHit);
  }else{
    col=sky+glow;
    float ext=smoothstep(-.01,.12,dir.y); // horizon extinction
    col+=moons(dir,trans);
    if(uSunVisible>.5){
      float ang=acos(clamp(dot(dir,uSunDir),-1.,1.)); float disc=1.-smoothstep(uSunAng*(1.-uSunSoft*.9),uSunAng,ang);
      float soft=mix(1.,2.2,1.-smoothstep(0.,4.,elevDeg)); disc=1.-smoothstep(uSunAng*(1.-uSunSoft*.9*soft),uSunAng,ang);
      float limb=mix(1.,.55,smoothstep(0.,uSunAng,ang));
      vec3 ext=exp(-(vec3(5.8e-6,13.5e-6,33.1e-6)*uRayleigh*uHr+vec3(21e-6)*1.1*uMie*uHm)*airMassOf(elevDeg));
      vec3 sunCol=uSunColor*max(ext,trans*trans);                                           // deep orange at the horizon, white overhead
      col+=disc*limb*sunCol*uSunIntensity*uSunDiscBoost*mix(.35,1.,smoothstep(-1.,8.,elevDeg));
      float sg=exp(-ang*40.)*.35+exp(-ang*9.)*.03+exp(-ang*2.5)*.004; col+=sg*uBloom*sunCol*uSunIntensity*.6;
    }
  }
  if(uFlareOn>.5 && uSunVisible>.5){
    float inFrame=1.-smoothstep(1.25,2.2,length(uSunUV*vec2(uRes.y/uRes.x,1.)));
    float vis=uSunInFront*sunUp*inFrame*step(0.,elevDeg+.5); col+=lensFlare(uv,uSunUV,vis)*uSunIntensity*.09*uSunColor; }
  float autoEV=-.35*smoothstep(-8.,-1.,elevDeg)-1.0*smoothstep(-1.,6.,elevDeg)-.6*smoothstep(6.,30.,elevDeg);   // tame the blow-out after sunrise
  col*=exp2(uEV+autoEV);
  if(uTonemap==1.) col=aces(col); else if(uTonemap==2.) col=col/(1.+col); else if(uTonemap==3.) col=filmic(col); else if(uTonemap==4.) col=agxish(col); else col=clamp(col,0.,1.);
  float vig=1.-uVignette*pow(length(uv*vec2(uRes.y/uRes.x,1.)*.9),2.2); col*=clamp(vig,0.,1.);
  col=pow(max(col,0.),vec3(1./2.2)); col+=(hash13(vec3(gl_FragCoord.xy,fract(uTime)*100.))-.5)*uGrain*.12;
  gl_FragColor=vec4(col,1.);
}
</script>

<script>

const MOON_PROPS=[

function sunDirAt(t){ const lat=S.sun_lat*D2R, HA=(t-12)/24*Math.PI*2; const sinE=Math.cos(lat)*Math.cos(HA); const el=Math.asin(Math.max(-1,Math.min(1,sinE)));
  const az=Math.atan2(Math.sin(HA),Math.cos(HA)*Math.sin(lat))+Math.PI+S.sun_az*D2R; return {el,az,v:[Math.sin(az)*Math.cos(el),Math.sin(el),-Math.cos(az)*Math.cos(el)]}; }
const sunDir=()=>sunDirAt(S.sun_time);
const dirFrom=(e,a)=>{ e*=D2R;a*=D2R; return [Math.sin(a)*Math.cos(e),Math.sin(e),-Math.cos(a)*Math.cos(e)]; };
const moonDir=m=>m.link?sunDir().v.map(x=>-x):dirFrom(m.elev,m.az);
const sunElevDeg=()=>sunDir().el/D2R;
function airMass(){ const z=90-sunElevDeg(); if(z>=96) return 40; return Math.min(40,1/(Math.cos(z*D2R)+0.50572*Math.pow(96.07995-z,-1.6364))); }
function zenithLum(){ const e=Math.max(0,Math.sin(sunDir().el)); return (0.02+8*Math.pow(e,0.8))*S.sky_bright*S.atm_rayleigh*S.sun_intensity/22; }
const illum=ph=>(1+Math.cos(ph*Math.PI*2))/2;
function kelvinRGB(k){ k/=100; let r=k<=66?255:329.7*Math.pow(k-60,-0.133), g=k<=66?99.47*Math.log(k)-161.1:288.1*Math.pow(k-60,-0.0755), b=k>=66?255:(k<=19?0:138.5*Math.log(k-10)-305); return [r,g,b].map(v=>Math.max(0,Math.min(255,v))/255); }
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
const phaseName=e=>e>6?['Day','#ffd166']:e>0?['Golden hour','#ffb454']:e>-6?['Civil twilight','#ff8a65']:e>-12?['Nautical twilight','#7c8cff']:e>-18?['Astronomical','#5b5fd6']:['Night','#8aa4ff'];
function skyColorsAt(e){ // rough analytic sky for timelines
  const k=(a,b,x)=>Math.max(0,Math.min(1,(x-a)/(b-a))); const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
  const day=k(-6,14,e), gold=Math.exp(-Math.pow(e/6,2)), tw=k(-18,-4,e);
  let top=mix([3,4,10],[52,110,210],day); let hz=mix(mix([4,5,14],[40,42,90],tw),[170,200,235],day); hz=mix(hz,[255,150,80],gold*.85);
  return {top:top.map(Math.round),hz:hz.map(Math.round)}; }

const decOf=s=>{ const t=String(s); return t.includes('.')?t.split('.')[1].length:0; };
const fmt=(v,d)=>Number(v).toFixed(d);
const frac=(p,v)=>p.log?Math.log(v/p.min)/Math.log(p.max/p.min):(v-p.min)/(p.max-p.min);
const unfrac=(p,f)=>{ f=Math.max(0,Math.min(1,f)); let v=p.log?p.min*Math.pow(p.max/p.min,f):p.min+f*(p.max-p.min); v=Math.round(v/p.step)*p.step; return Math.max(p.min,Math.min(p.max,+v.toFixed(6))); };
const valHTML=(p,v,left)=>`<span class="vwrap"><input class="val" data-val="${p.k}" value="${fmt(v,decOf(p.step))}"><span class="u">${p.unit||''}</span></span>`;
function dialSVG(p,v){ const full=p.full; const sweep=full?360:270, start=full?0:-135; const f=frac(p,v); const a=start+f*sweep;
  const pol=(deg,r)=>[37+r*Math.sin(deg*D2R),37-r*Math.cos(deg*D2R)]; const R=28;
  const arc=(a0,a1)=>{ const [x0,y0]=pol(a0,R),[x1,y1]=pol(a1,R); const big=(a1-a0)>180?1:0; return `M${x0},${y0}A${R},${R},0,${big},1,${x1},${y1}`; };
  const track=full?`<circle cx="37" cy="37" r="${R}" class="track"/>`:`<path class="track" d="${arc(-135,134.9)}"/>`;
  const zero=full?0:(p.min<0&&p.max>0?start+(0-p.min)/(p.max-p.min)*sweep:start);
  const arcd=full?(a>zero+.5?arc(zero,a):''):(a>zero?arc(zero,a):a<zero?arc(a,zero):'');
  const ticks=[...Array(full?12:10)].map((_,i)=>{ const d=start+i*(sweep/(full?12:9)); const [x0,y0]=pol(d,R+6),[x1,y1]=pol(d,R+9); return `<line class="tick" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/>`; }).join('');
  const [kx,ky]=pol(a,R); return `${ticks}${track}${arcd?`<path class="arc" d="${arcd}"/>`:''}<circle class="knob" cx="${kx}" cy="${ky}" r="5"/>`; }
function ctlHTML(p){ const v=getV(p.k); const lab=`<span class="l">${p.l}${p.hint?`<small>${p.hint}</small>`:''}</span>`;
  switch(p.t){
    case 'trk': return `<div class="ctl" data-k="${p.k}" data-t="trk"><div class="ctl-top">${lab}${valHTML(p,v)}</div>
      <div class="trk-bar" style="--p:${frac(p,v)*100}%"><div class="ticks"></div><div class="major"></div><div class="fill"></div><div class="fillmaj"></div>${p.mark!==undefined?`<i class="mark" style="left:${frac(p,p.mark)*100}%"></i>`:''}<div class="thumb"></div></div>${p.ramp?'<div class="ramp"></div>':''}</div>`;
    case 'dial': return `<div class="ctl half" data-k="${p.k}" data-t="dial"><div class="ctl-top">${lab}</div><div class="dial-wrap"><svg class="dial-svg" viewBox="0 0 74 74">${dialSVG(p,v)}</svg><div class="dial-meta">${valHTML(p,v)}<span class="hint2">${p.min}${p.unit} → ${p.max}${p.unit}</span></div></div></div>`;
    case 'step': return `<div class="ctl" data-k="${p.k}" data-t="step"><div class="ctl-top">${lab}<div class="step"><button data-d="-1">${I('minus',12)}</button><span class="dots">${[...Array(p.max)].map((_,i)=>`<i class="${i<v?'on':''}"></i>`).join('')}</span><button data-d="1">${I('plus',12)}</button></div></div></div>`;
    case 'toggle': return `<div class="ctl" data-k="${p.k}" data-t="toggle"><div class="ctl-top">${lab}<div class="sw ${v?'on':''}"></div></div></div>`;
    case 'color': return `<div class="ctl" data-k="${p.k}" data-t="color"><div class="ctl-top">${lab}<label class="colorbtn" style="--c:${v}"><span class="sw2" style="background:${v}"></span><code>${v}</code><input type="color" value="${v}"></label></div></div>`;
    case 'seg': return `<div class="ctl" data-k="${p.k}" data-t="seg"><div class="ctl-top" style="align-items:flex-start;padding-top:2px">${lab}<div class="seg">${p.opts.map(o=>`<button data-opt="${o}" class="${o===v?'on':''}">${o}</button>`).join('')}</div></div></div>`; } }
function refreshCtl(k){ const el=insp.querySelector(`.ctl[data-k="${CSS.escape(k)}"]`); if(!el) return; const p=propOf(k); const v=getV(k);
  const inp=el.querySelector('input.val'); if(inp&&document.activeElement!==inp) inp.value=fmt(v,decOf(p.step));
  if(p.t==='trk') el.querySelector('.trk-bar').style.setProperty('--p',frac(p,v)*100+'%');
  if(p.t==='dial') el.querySelector('.dial-svg').innerHTML=dialSVG(p,v);
  if(p.t==='step') el.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i<v));
  if(p.t==='toggle') el.querySelector('.sw').classList.toggle('on',!!v); }
function propOf(k){ const e=getEntity(selected); if(e) for(const s of e.sections) for(const p of s.props) if(p.k===k) return p; for(const id in ENTITIES) for(const s of ENTITIES[id].sections) for(const p of s.props) if(p.k===k) return p; }
function commit(k,v){ setV(k,v); refreshCtl(k); onChanged(k); }
// interactions
const insp=document.getElementById('insp'); let drag=null;
insp.addEventListener('pointerdown',e=>{
  const bar=e.target.closest('.trk-bar'); const dial=e.target.closest('.dial-svg'); const sp=e.target.closest('.preview[data-scrub]');
  if(!bar&&!dial&&!sp) return; const el=e.target.closest('.ctl,.preview'); const k=el.dataset.k; const p=k?propOf(k):null;
  drag={el,k,p,kind:bar?'trk':dial?'dial':'scrub',rect:(bar||dial||sp).getBoundingClientRect(),x0:e.clientX,v0:k?getV(k):0}; (bar||dial||sp).setPointerCapture(e.pointerId); moveDrag(e); });
insp.addEventListener('pointermove',e=>{ if(drag) moveDrag(e); });
insp.addEventListener('pointerup',()=>drag=null); insp.addEventListener('pointercancel',()=>drag=null);
function moveDrag(e){ const {kind,p,k,rect}=drag;
  if(kind==='trk'){ let f; if(e.shiftKey){ f=frac(p,drag.v0)+(e.clientX-drag.x0)/rect.width*.1; } else f=(e.clientX-rect.left)/rect.width; commit(k,unfrac(p,f)); }
  else if(kind==='dial'){ const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2; let a=Math.atan2(e.clientX-cx,-(e.clientY-cy))/D2R; // 0 at top, cw
    let f; if(p.full){ f=((a%360)+360)%360/360; } else { a=((a+135)%360+360)%360; if(a>270) a=a>315?0:270; f=a/270; } commit(k,unfrac(p,f)); }
  else if(kind==='scrub'){ const f=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width)); commit('sun_time',+(f*24).toFixed(3)); } }
insp.addEventListener('change',e=>{ const t=e.target; if(t.dataset.val){ const k=t.dataset.val,p=propOf(k); let v=parseFloat(t.value); if(isNaN(v)){ refreshCtl(k); return; } commit(k,Math.max(p.min,Math.min(p.max,v))); t.blur(); }
  if(t.type==='color'){ const k=t.closest('.ctl').dataset.k; setV(k,t.value); const lab=t.closest('.colorbtn'); lab.style.setProperty('--c',t.value); lab.querySelector('.sw2').style.background=t.value; lab.querySelector('code').textContent=t.value; onChanged(k); } });
insp.addEventListener('input',e=>{ if(e.target.type==='color'){ const k=e.target.closest('.ctl').dataset.k; setV(k,e.target.value); const lab=e.target.closest('.colorbtn'); lab.style.setProperty('--c',e.target.value); lab.querySelector('.sw2').style.background=e.target.value; lab.querySelector('code').textContent=e.target.value; onChanged(k); } });
insp.addEventListener('keydown',e=>{ if(e.target.classList.contains('val')&&e.key==='Enter') e.target.dispatchEvent(new Event('change',{bubbles:true})); });
insp.addEventListener('wheel',e=>{ const el=e.target.closest('.ctl[data-t="trk"],.ctl[data-t="dial"]'); if(!el) return; e.preventDefault(); const k=el.dataset.k,p=propOf(k); commit(k,unfrac(p,frac(p,getV(k))-Math.sign(e.deltaY)*(e.shiftKey?.002:.01))); },{passive:false});
insp.addEventListener('click',e=>{
  const sw=e.target.closest('.sw'); if(sw){ const k=sw.closest('.ctl').dataset.k; commit(k,!getV(k)); return; }
  const st=e.target.closest('.step button'); if(st){ const k=st.closest('.ctl').dataset.k,p=propOf(k); commit(k,Math.max(p.min,Math.min(p.max,getV(k)+ +st.dataset.d))); return; }
  const opt=e.target.closest('[data-opt]'); if(opt){ const k=opt.closest('.ctl').dataset.k; setV(k,opt.dataset.opt); opt.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===opt)); onChanged(k); return; }
  const go=e.target.closest('[data-goto]'); if(go){ select(go.dataset.goto); return; }
  const add=e.target.closest('[data-add]'); if(add){ if(S.moons.length>=4) return; S.moons.push(makeMoon(add.dataset.add,S.moons.length)); renderTree(); select('moon#'+(S.moons.length-1)); return; }
  const pre=e.target.closest('[data-preset]'); if(pre){ const i=getEntity(selected).moonIndex; const m=S.moons[i]; const p=MOON_ATLAS.find(x=>x.id===pre.dataset.preset); applyPreset(m,p); m.name=p.name+(i?` ${i+1}`:''); renderTree(); renderInspector(); return; }
  const ph=e.target.closest('[data-phase]'); if(ph){ commit(`moon.${getEntity(selected).moonIndex}.phase`,+ph.dataset.phase); return; }
  const rm=e.target.closest('[data-remove]'); if(rm){ S.moons.splice(+rm.dataset.remove,1); renderTree(); select('moons'); return; }
  const head=e.target.closest('.sec-head'); if(head&&head.parentElement.dataset.sec!==undefined){ head.parentElement.classList.toggle('closed'); } });
function onChanged(k){ if(k==='sun_time') drawDay(); updatePreview(); }

/* ============================================================ INSPECTOR ============================================================ */
const bigHTML=(v,dec,signed)=>{ const [a,b]=fmt(Math.abs(v),dec).split('.'); return `${signed?(v<0?'−':'+'):''}${a}${b!==undefined?`<small>.${b}</small>`:''}`; };
function renderInspector(){
  const e=getEntity(selected); if(!e){ insp.innerHTML='<div class="empty">Select something in the outliner</div>'; return; }
  document.getElementById('inspTitle').innerHTML=`<span style="color:${e.color}">${I(e.icon,18)}</span>${e.name}`; document.getElementById('inspKind').textContent=e.kind; insp.style.setProperty('--acc',e.color);
  const previewHTML={sunpath:`<div class="preview" data-scrub style="cursor:ew-resize"><span class="cap">Sun path · drag to scrub</span><svg id="pvSun" viewBox="0 0 340 130"></svg></div>`,
    moon:`<div class="preview" style="display:flex;gap:14px;align-items:center;padding:14px"><canvas id="pvMoon" width="192" height="192" style="width:128px;height:128px;border-radius:50%;flex-shrink:0"></canvas><div style="flex:1;font-size:12px;color:var(--t2);line-height:1.7"><div>Phase <b id="pvPhaseName" style="color:var(--text);font-weight:400"></b></div><div>Apparent size <b id="pvSize" style="color:var(--text);font-weight:400"></b></div><div>Preset <b id="pvPreset" style="color:var(--text);font-weight:400"></b></div><div id="pvUp"></div></div></div><div class="preview" style="margin-top:8px;height:64px;background-size:100% 100%;background-repeat:repeat-x" id="pvTexStrip"><span class="cap">Equirectangular map · 2048×1024</span></div>`,
    sky:`<div class="preview"><span class="cap">Live zenith → horizon</span><canvas id="pvSkyLive" class="prev" width="340" height="44" style="height:44px"></canvas></div><div class="preview" style="margin-top:8px"><span class="cap">24 h sky</span><canvas id="pvSkyDay" class="prev" width="340" height="60" style="height:60px"></canvas></div>`,
    atmo:`<div class="preview"><span class="cap">Scattering vs wavelength</span><span class="cap r">380 → 780 nm</span><svg id="pvAtmo" viewBox="0 0 340 120"></svg></div>`,
    camera:`<div class="preview"><span class="cap">Frustum · top-down</span><svg id="pvCam" viewBox="0 0 340 130"></svg></div>`,
    post:`<div class="preview"><span class="cap">Tonemap curve</span><svg id="pvTone" viewBox="0 0 340 110"></svg></div><div class="preview" style="margin-top:8px"><span class="cap">Flare</span><canvas id="pvFlare" class="prev" width="680" height="160" style="height:80px"></canvas></div>`,
    plane:`<div class="preview"><span class="cap">Material · top-down</span><canvas id="pvPlane" class="prev" width="340" height="120" style="height:120px"></canvas></div>`,
    atlas:`<div class="preview" style="padding:10px 12px 6px;font-size:12px;color:var(--t2)">Pick a body from the atlas to place it in orbit. Up to four moons render simultaneously; each has its own inspector.</div>`}[e.preview]||'';
  const atlasHTML=e.preview==='atlas'?`<div class="sec"><div class="sec-head"><span class="sico">${I('moon',16)}</span><span class="t">Atlas</span><span class="badge">${MOON_ATLAS.length} bodies</span></div><div class="sec-body"><div class="atlas">${MOON_ATLAS.map(m=>`<div class="card" data-add="${m.id}"><span class="plus">${I('plus',11)}</span><canvas data-atlas="${m.id}" width="112" height="112"></canvas><span>${m.name}</span><small>${m.sub}</small></div>`).join('')}</div>
    ${S.moons.length?`<div class="hint" style="grid-column:span 2">In orbit: ${S.moons.map((m,i)=>`<b style="color:${m.tint};font-weight:400;cursor:pointer" data-goto="moon#${i}">${m.name}</b>`).join(' · ')}</div>`:''}</div></div>`:'';
  const moonExtra=e.preview==='moon'?(()=>{ const m=S.moons[e.moonIndex]; return `<div class="sec"><div class="sec-head"><span class="sico">${I('grid',16)}</span><span class="t">Preset<span>atlas</span></span><span class="badge">${m.preset}</span></div><div class="sec-body"><div class="atlas" style="grid-template-columns:repeat(6,1fr)">${MOON_ATLAS.map(a=>`<div class="card ${a.id===m.preset?'on':''}" data-preset="${a.id}" style="padding:8px 4px"><canvas data-atlas="${a.id}" width="72" height="72" style="width:36px;height:36px"></canvas><small>${a.name}</small></div>`).join('')}</div>
    <div class="phase-strip">${[0,.125,.25,.375,.5,.625,.75,.875].map(p=>`<canvas data-phase="${p}" data-phasecv="${p}" width="60" height="60" class="${Math.abs(m.phase-p)<.03?'on':''}"></canvas>`).join('')}</div></div></div>`; })():'';
  insp.innerHTML=`<div class="ent-enter">
    <div class="hero" style="--acc:${e.color}"><div class="label-bar">${e.hero.label}<em>live</em></div>
      <div class="big"><span class="v" id="heroV">${bigHTML(e.hero.fn(),e.hero.dec,e.hero.signed)}</span><span class="u">${e.hero.unit}</span><span class="trend" id="heroTrend">${I('flat',18)}</span></div>
      <span class="delta" id="heroDelta">± 0 ${e.hero.unit}</span>${previewHTML}</div>
    ${atlasHTML}${moonExtra}
    ${e.sections.map((sec,i)=>`<div class="sec ${sec.warm||e.warm?'warm':''}" data-sec="${i}"><div class="sec-head"><span class="sico">${I(sec.icon,16)}</span><span class="t">${sec.title}${sec.sub?`<span>(${sec.sub})</span>`:''}</span><span class="badge">${sec.props.length} props</span><span class="chev">${I('chevu',14)}</span></div><div class="sec-body">${sec.props.map(ctlHTML).join('')}</div></div>`).join('')}
    ${selected==='camera'?`<div class="sec warm"><div class="sec-head" data-goto="post"><span class="sico" style="color:${ENTITIES.post.color}">${I('fx',16)}</span><span class="t">Post Process<span>component</span></span><span class="badge">attached</span><span class="chev" style="transform:rotate(90deg)">${I('chev',14)}</span></div></div>`:''}
    ${selected==='post'?`<button class="action ghost" data-goto="camera" style="width:100%">← Back to Camera</button>`:''}
    ${e.preview==='moon'?`<button class="action danger" data-remove="${e.moonIndex}" style="width:100%">Remove ${e.name}</button>`:''}
    <div class="hint">${e.kind} · every change is applied to the viewport immediately · Shift-drag for fine control · scroll over a control to nudge</div></div>`;
  insp.querySelectorAll('canvas[data-atlas]').forEach(c=>{ const a=MOON_ATLAS.find(m=>m.id===c.dataset.atlas); drawMoon2D(c,{tex:a.tex,tint:a.tint,haze:a.haze,gamma:a.gamma,tilt:a.tilt,spin:0,phase:.1},true); });
  insp.querySelectorAll('canvas[data-phasecv]').forEach(c=>{ const m=S.moons[e.moonIndex]; drawMoon2D(c,{...m,phase:+c.dataset.phasecv},true); });
  updatePreview(); }

/* ---------- previews ---------- */
const texImgs={}; function texImg(name,cb){ if(texImgs[name]){ if(texImgs[name].complete) cb&&cb(texImgs[name]); else texImgs[name].addEventListener('load',()=>cb&&cb(texImgs[name]),{once:true}); return texImgs[name]; } const im=new Image(); im.src=TEXDIR+name; texImgs[name]=im; im.addEventListener('load',()=>cb&&cb(im),{once:true}); return im; }
const texData={}; function texPixels(name,cb){ if(texData[name]) return cb(texData[name]); texImg(name,im=>{ if(texData[name]) return cb(texData[name]); const c=document.createElement('canvas'); c.width=512; c.height=256; const x=c.getContext('2d'); x.drawImage(im,0,0,512,256); texData[name]=x.getImageData(0,0,512,256); cb(texData[name]); }); }
function drawMoon2D(cv,m,flat=false){ texPixels(m.tex,td=>{ const ctx=cv.getContext('2d'); const W=cv.width; const img=ctx.createImageData(W,W); const d=img.data; const tint=hex2rgb(m.tint); const tp=td.data;
  const ph=m.phase*Math.PI*2; const lx=Math.sin(ph), lz=Math.cos(ph); const R=W/2-2; const spin=(m.spin||0)*D2R, tilt=(m.tilt||0)*D2R; const ct=Math.cos(tilt),st=Math.sin(tilt); const gam=m.gamma||1, haze=m.haze||0;
  for(let y=0;y<W;y++) for(let x=0;x<W;x++){ const nx=(x-W/2)/R, ny=-(y-W/2)/R; const r2=nx*nx+ny*ny; const i=(y*W+x)*4; if(r2>1){ d[i+3]=0; continue; }
    const nz=Math.sqrt(1-r2); const ty=ny*ct-nz*st, tz=ny*st+nz*ct; const lon=Math.atan2(nx,tz)+spin, lat=Math.asin(Math.max(-1,Math.min(1,ty)));
    let u=((lon/(2*Math.PI)+.5)%1+1)%1, v=.5-lat/Math.PI; const px=(Math.floor(v*255)*512+Math.floor(u*511))*4;
    let ndl=nz*lz+nx*lx; const wrap=haze*.3; ndl=Math.max((ndl+wrap)/(1+wrap),0); const limb=1-Math.pow(1-nz,2)*Math.max(haze,.35)*.5; const L=Math.pow(ndl,.8)*limb+.05; const edge=Math.min(1,(1-Math.sqrt(r2))*(haze?6:30));
    for(let c=0;c<3;c++){ let a=Math.pow(tp[px+c]/255,gam)*tint[c]; d[i+c]=Math.min(255,a*L*255); } d[i+3]=255*edge; }
  ctx.putImageData(img,0,0); if(!flat&&m.glow){ ctx.globalCompositeOperation='destination-over'; const g=ctx.createRadialGradient(W/2,W/2,R*.9,W/2,W/2,W/2); g.addColorStop(0,'rgba(220,228,245,.4)'); g.addColorStop(1,'rgba(220,228,245,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,W); ctx.globalCompositeOperation='source-over'; } }); }
function drawSunPath(){ const svg=document.getElementById('pvSun'); if(!svg) return; const W=340,H=130,hy=88; const pts=[]; for(let t=0;t<=24;t+=.25){ const e=sunDirAt(t).el/D2R; pts.push([t/24*W,hy-e/90*72]); }
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(''); const cur=sunDirAt(S.sun_time); const cx=S.sun_time/24*W, cy=hy-cur.el/D2R/90*72;
  let rise=null,set=null; for(let i=1;i<pts.length;i++){ if(pts[i-1][1]>hy&&pts[i][1]<=hy) rise=i*.25; if(pts[i-1][1]<=hy&&pts[i][1]>hy) set=i*.25; } const hh=t=>t==null?'—':`${String(Math.floor(t)).padStart(2,'0')}:${String(Math.round((t%1)*60)).padStart(2,'0')}`;
  svg.innerHTML=`<defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffb454" stop-opacity=".35"/><stop offset="1" stop-color="#ffb454" stop-opacity="0"/></linearGradient><clipPath id="above"><rect x="0" y="0" width="${W}" height="${hy}"/></clipPath></defs>
    <rect x="0" y="${hy}" width="${W}" height="${H-hy}" fill="rgba(255,255,255,.03)"/><path d="${path}L${W},${H}L0,${H}Z" fill="url(#sg)" clip-path="url(#above)"/>
    <line x1="0" y1="${hy}" x2="${W}" y2="${hy}" stroke="rgba(255,255,255,.35)" stroke-width="1"/><path d="${path}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.4"/>
    ${[6,12,18].map(t=>`<line x1="${t/24*W}" y1="${hy}" x2="${t/24*W}" y2="${hy+6}" stroke="rgba(255,255,255,.3)"/><text x="${t/24*W}" y="${H-6}" fill="rgba(255,255,255,.35)" font-size="9" text-anchor="middle" font-family="Outfit">${t}:00</text>`).join('')}
    <text x="6" y="${H-6}" fill="rgba(255,255,255,.5)" font-size="9" font-family="Outfit">↑ ${hh(rise)}</text><text x="${W-6}" y="${H-6}" fill="rgba(255,255,255,.5)" font-size="9" text-anchor="end" font-family="Outfit">↓ ${hh(set)}</text>
    <line x1="${cx}" y1="18" x2="${cx}" y2="${H-16}" stroke="rgba(255,255,255,.18)" stroke-dasharray="2 3"/><circle cx="${cx}" cy="${cy}" r="9" fill="#ffb454" opacity=".25"/><circle cx="${cx}" cy="${cy}" r="4.5" fill="${cur.el>0?'#ffd166':'#7c8cff'}"/>`; }
function drawSkyDay(){ const cv=document.getElementById('pvSkyDay'); if(!cv) return; const ctx=cv.getContext('2d'); const W=cv.width,H=cv.height; const tint=hex2rgb(S.sky_tint);
