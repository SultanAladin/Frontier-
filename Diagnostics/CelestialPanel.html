<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frontier — Celestial Panel (Sun · Sky · Stars · Moon)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS — matched to reference boards
   ============================================================ */
:root{
  --font:'Outfit','General Sans','Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --glass:rgba(16,17,19,0.72);
  --glass-2:rgba(255,255,255,0.045);
  --glass-3:rgba(255,255,255,0.075);
  --stroke:rgba(255,255,255,0.07);
  --stroke-2:rgba(255,255,255,0.12);
  --text:rgba(255,255,255,0.94);
  --text-2:rgba(255,255,255,0.58);
  --text-3:rgba(255,255,255,0.34);
  --warm:rgba(120,70,55,0.28);
  --warm-stroke:rgba(255,160,120,0.12);
  --red:#ff3b30; --green:#34c759; --yellow:#e5d33a; --blue:#5aa9ff; --violet:#a78bfa; --orange:#ffb454; --cyan:#67e8f9;
  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px;
  --ease:cubic-bezier(.22,.61,.36,1); --spring:cubic-bezier(.175,.885,.32,1.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:var(--font);color:var(--text);font-size:14px;font-weight:300;-webkit-font-smoothing:antialiased;user-select:none;letter-spacing:.01em}
svg{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}

/* ── Viewport ── */
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#gl.drag{cursor:grabbing}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%)}

/* ── Shared glass surfaces ── */
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(1.3);-webkit-backdrop-filter:blur(28px) saturate(1.3);border:1px solid var(--stroke);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05)}

/* ── Top bar ── */
#topbar{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:10px}
.pill{height:52px;border-radius:999px;display:flex;align-items:center;gap:14px;padding:0 10px 0 8px}
.round{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass-2);border:1px solid var(--stroke);transition:background .2s var(--ease),transform .2s var(--spring);color:var(--text)}
.round:hover{background:var(--glass-3)}
.round:active{transform:scale(.94)}
.round.on{background:#fff;color:#000}
#clock{font-family:var(--font);font-weight:200;font-size:26px;letter-spacing:.02em;min-width:82px;text-align:center;font-variant-numeric:tabular-nums}
#clock small{font-size:12px;color:var(--text-3);margin-left:4px;font-weight:300}
#timeScrub{width:280px}
.speed{display:flex;gap:4px;background:var(--glass-2);border:1px solid var(--stroke);border-radius:999px;padding:3px}
.speed button{height:30px;padding:0 12px;border-radius:999px;font-size:12px;color:var(--text-2);transition:all .2s var(--ease)}
.speed button.on{background:#fff;color:#000;font-weight:500}
.phase-badge{display:flex;align-items:center;gap:8px;padding:0 16px;height:52px;border-radius:999px;font-size:13px;color:var(--text-2)}
.phase-badge b{font-weight:400;color:var(--text)}
.phase-badge i{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 10px var(--orange)}

/* ── Range sliders (global) ── */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:linear-gradient(90deg,rgba(255,255,255,.85) var(--p),rgba(255,255,255,.12) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 2px 10px rgba(0,0,0,.6),0 0 0 4px rgba(255,255,255,.08);transition:transform .15s var(--spring)}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]::-moz-range-track{height:4px;border-radius:999px;background:rgba(255,255,255,.12)}
input[type=range]::-moz-range-progress{height:4px;border-radius:999px;background:rgba(255,255,255,.85)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}

/* ============================================================
   OUTLINER (left)
   ============================================================ */
#outliner{position:fixed;top:18px;left:18px;bottom:18px;width:300px;border-radius:var(--r-xl);z-index:15;display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:22px 22px 12px;display:flex;align-items:center;justify-content:space-between}
.panel-head h1{font-size:20px;font-weight:300;letter-spacing:.01em}
.panel-head h1 span{color:var(--text-3);font-size:12px;margin-left:8px;font-weight:300}
.search{margin:0 14px 10px;height:44px;border-radius:999px;background:var(--glass-2);border:1px solid var(--stroke);display:flex;align-items:center;padding:0 16px;gap:10px;color:var(--text-3)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:13px;font-weight:300}
.search input::placeholder{color:var(--text-3)}
.tree{flex:1;overflow:auto;padding:4px 10px 10px}
.tree::-webkit-scrollbar{width:0}
.row{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px 0 10px;border-radius:14px;cursor:pointer;transition:background .18s var(--ease),transform .18s var(--ease);position:relative;color:var(--text-2)}
.row:hover{background:var(--glass-2);color:var(--text)}
.row.sel{background:var(--glass-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--stroke-2)}
.row.sel::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--acc,#fff);box-shadow:0 0 12px var(--acc,#fff)}
.row .chev{width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:transform .25s var(--spring)}
.row.open .chev{transform:rotate(90deg)}
.row .ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);color:var(--acc,#fff);flex-shrink:0}
.row .name{flex:1;font-size:14px;font-weight:300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.row .eye{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-3);opacity:.6;transition:all .2s}
.row .eye:hover{background:var(--glass-3);color:var(--text);opacity:1}
.row .eye.off{opacity:1;color:var(--red)}
.row.dim .name,.row.dim .ico{opacity:.35}
.row .count{font-size:11px;color:var(--text-3);background:rgba(255,255,255,.06);padding:2px 8px;border-radius:999px}
.children{padding-left:18px;position:relative;overflow:hidden;transition:max-height .35s var(--ease),opacity .3s}
.children::before{content:'';position:absolute;left:23px;top:4px;bottom:8px;width:1px;background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,0))}
.children.closed{max-height:0!important;opacity:0}
.component-row{height:38px;margin-left:36px;padding-left:10px;border-radius:12px;font-size:13px}
.component-row .ico{width:20px;height:20px;border-radius:6px}
.outliner-foot{padding:14px 18px 18px;border-top:1px solid var(--stroke);display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:999px;background:var(--glass-2);border:1px solid var(--stroke);font-size:12px;color:var(--text-2)}
.chip b{font-weight:400;color:var(--text);font-variant-numeric:tabular-nums}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}

/* ============================================================
   INSPECTOR (right)
   ============================================================ */
#inspector{position:fixed;top:18px;right:18px;bottom:18px;width:380px;border-radius:var(--r-xl);z-index:15;display:flex;flex-direction:column;overflow:hidden}
#inspector .panel-head h1{display:flex;align-items:center;gap:10px}
.insp-scroll{flex:1;overflow:auto;padding:0 14px 18px}
.insp-scroll::-webkit-scrollbar{width:0}
.ent-enter{animation:entIn .45s var(--spring) both}
@keyframes entIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

/* Hero card (image 3 style) */
.hero{background:var(--glass-2);border:1px solid var(--stroke);border-radius:var(--r-lg);padding:20px 22px 16px;margin-bottom:12px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(400px 120px at 20% 0%,color-mix(in srgb,var(--acc) 14%,transparent),transparent 70%);pointer-events:none}
.label-bar{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:300;color:var(--text)}
.label-bar::before{content:'';width:3px;height:16px;border-radius:2px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.label-bar em{font-style:normal;color:var(--text-3);font-size:12px;margin-left:auto;text-transform:uppercase;letter-spacing:.08em}
.big{display:flex;align-items:baseline;gap:6px;margin:14px 0 4px;position:relative}
.big .v{font-size:54px;font-weight:200;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.big .v small{font-size:32px;color:var(--text-3);font-weight:200}
.big .u{font-size:20px;color:var(--text-3);font-weight:300}
.big .trend{margin-left:auto;color:var(--text-2);width:28px;height:28px;display:flex;align-items:center;justify-content:center;transition:transform .3s var(--spring)}
.delta{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 11px;border-radius:999px;background:rgba(229,211,58,.12);color:#e9d95b;margin-top:6px;font-variant-numeric:tabular-nums}
.delta.neg{background:rgba(255,59,48,.12);color:#ff7a70}
.delta.pos{background:rgba(52,199,89,.12);color:#5fd77f}
.spark{margin-top:14px;height:74px;position:relative;border-top:1px solid rgba(255,255,255,.22);background:linear-gradient(180deg,var(--warm),transparent);border-radius:0 0 8px 8px}
.spark svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.spark .cap{position:absolute;right:0;bottom:-18px;font-size:10px;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase}

/* Sections */
.sec{background:var(--glass-2);border:1px solid var(--stroke);border-radius:var(--r-lg);margin-bottom:10px;overflow:hidden}
.sec.warm{background:linear-gradient(180deg,var(--warm),rgba(70,45,40,.16));border-color:var(--warm-stroke)}
.sec-head{display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;cursor:pointer;color:var(--text)}
.sec-head .sico{color:var(--text-2);width:18px;display:flex;justify-content:center}
.sec-head .t{font-size:15px;font-weight:300}
.sec-head .t span{color:var(--text-3);margin-left:6px;font-size:13px}
.sec-head .badge{margin-left:auto;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);border:1px solid var(--stroke);padding:3px 8px;border-radius:999px}
.sec-head .chev{margin-left:8px;color:var(--text-3);transition:transform .3s var(--spring)}
.sec.closed .sec-head .chev{transform:rotate(-180deg)}
.sec-body{padding:2px 18px 14px;transition:all .3s var(--ease)}
.sec.closed .sec-body{display:none}
.prop{padding:8px 0 2px;border-top:1px solid rgba(255,255,255,.04)}
.prop:first-child{border-top:0}
.prop-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px}
.prop-top .l{font-size:14px;color:var(--text-2);font-weight:300;display:flex;flex-direction:column;gap:1px}
.prop-top .l small{font-size:11px;color:var(--text-3)}
.num{display:flex;align-items:center;height:32px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--stroke);overflow:hidden}
.num input{width:64px;height:100%;background:none;border:0;outline:0;text-align:right;padding:0 8px;font-family:var(--mono);font-size:13px;font-weight:400;color:var(--text);-moz-appearance:textfield}
.num input::-webkit-inner-spin-button,.num input::-webkit-outer-spin-button{-webkit-appearance:none}
.num .unit{height:100%;display:flex;align-items:center;padding:0 10px;background:rgba(255,255,255,.06);font-size:11px;color:var(--text-3);letter-spacing:.04em;min-width:34px;justify-content:center}
.prop input[type=range]{margin-top:-2px}
/* toggle */
.sw{width:46px;height:26px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;transition:background .25s var(--ease);cursor:pointer;border:1px solid var(--stroke)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .3s var(--spring);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}
/* color */
.colorbtn{display:flex;align-items:center;gap:10px;height:32px;padding:0 4px 0 4px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--stroke);position:relative;cursor:pointer}
.colorbtn .sw2{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15),0 0 14px -2px var(--c)}
.colorbtn code{font-family:var(--mono);font-size:12px;color:var(--text-2);padding-right:10px;text-transform:uppercase}
.colorbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
/* segmented select */
.seg{display:flex;gap:3px;background:rgba(0,0,0,.35);border:1px solid var(--stroke);border-radius:999px;padding:3px;flex-wrap:wrap;justify-content:flex-end}
.seg button{height:26px;padding:0 11px;border-radius:999px;font-size:12px;color:var(--text-2);transition:all .2s var(--ease);white-space:nowrap}
.seg button.on{background:#fff;color:#000;font-weight:500}
.seg button:hover:not(.on){background:var(--glass-3);color:var(--text)}
/* readout row */
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);padding:6px 0;border-top:1px solid rgba(255,255,255,.04)}
.kv b{font-weight:400;color:var(--text);font-family:var(--mono);font-size:12px}
.empty{padding:60px 20px;text-align:center;color:var(--text-3);font-size:13px;line-height:1.6}
.hint{font-size:11px;color:var(--text-3);padding:6px 4px 0;line-height:1.5}
.action{width:100%;height:44px;border-radius:999px;background:#fff;color:#000;font-weight:500;font-size:14px;margin-top:6px;transition:transform .2s var(--spring)}
.action:active{transform:scale(.98)}
.action.ghost{background:var(--glass-2);color:var(--text);border:1px solid var(--stroke)}

/* ── HUD bottom-center ── */
#hud{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:12;display:flex;gap:8px}
#hud .chip{height:38px;padding:0 14px 0 12px}

@media (max-width:1180px){#outliner{width:260px}#inspector{width:340px}#timeScrub{width:180px}}
</style>
</head>
<body>

<canvas id="gl"></canvas>
<div id="vignette"></div>

<!-- ─────────────── TOP BAR ─────────────── -->
<div id="topbar">
  <div class="pill glass">
    <button class="round" id="playBtn" title="Play / pause day cycle">
      <svg id="playIco" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div id="clock">06:24<small>SAST</small></div>
    <input type="range" id="timeScrub" min="0" max="24" step="0.005" value="6.4">
    <div class="speed" id="speedSeg">
      <button data-s="0.02">×1</button><button data-s="0.15" class="on">×8</button><button data-s="0.6">×30</button><button data-s="2">×100</button>
    </div>
  </div>
  <div class="phase-badge glass"><i id="phaseDot"></i><span id="phaseTxt"><b>Civil dawn</b></span></div>
  <button class="round glass" id="resetBtn" title="Reset all to defaults" style="width:52px;height:52px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
  </button>
</div>

<!-- ─────────────── OUTLINER ─────────────── -->
<aside id="outliner" class="glass">
  <div class="panel-head"><h1>Outliner<span>World</span></h1>
    <button class="round" style="width:34px;height:34px" title="Add"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" placeholder="Search  Ctrl+Shift+F">
  </div>
  <div class="tree" id="tree"></div>
  <div class="outliner-foot">
    <div class="chip"><i></i>Realtime <b id="fps">60</b></div>
    <div class="chip">Sun <b id="hudSun">0.0°</b></div>
    <div class="chip">Moon <b id="hudMoon">0%</b></div>
  </div>
</aside>

<!-- ─────────────── INSPECTOR ─────────────── -->
<aside id="inspector" class="glass">
  <div class="panel-head"><h1 id="inspTitle">Inspector</h1><span id="inspKind" class="tag" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);border:1px solid var(--stroke);padding:4px 10px;border-radius:999px"></span></div>
  <div class="insp-scroll" id="insp"></div>
</aside>

<div id="hud">
  <div class="chip">Drag to look · Scroll for FOV</div>
</div>

<!-- ============================================================
     SKY SHADER
     ============================================================ -->
<script id="fs" type="x-shader/x-fragment">
precision highp float;
#define PI 3.14159265
uniform vec2 uRes; uniform float uTime;
uniform vec3 uCamFwd,uCamRight,uCamUp; uniform float uTanHalf,uCamHeight;
uniform vec3 uSunDir,uSunColor; uniform float uSunIntensity,uSunAng,uSunSoft,uSunVisible,uSunDiscBoost;
uniform float uRayleigh,uMie,uMieG,uOzone,uPlanetR,uAtmoH,uHr,uHm,uAtmoVisible;
uniform vec3 uSkyTint,uGroundColor; uniform float uSkyBright,uGroundBright,uSkyVisible,uHLInt,uHLSharp,uHLAuto;
uniform float uStarDensity,uStarBright,uStarSize,uTwinkle,uMilky,uStarRot,uStarVisible; uniform vec3 uStarTint;
uniform vec3 uMoonDir,uMoonTint; uniform float uMoonAng,uMoonBright,uMoonPhase,uMoonGlow,uMoonVisible;
uniform float uEV,uTonemap,uBloom,uVignette,uGrain,uFlareOn,uFlareInt,uGhosts,uHalo,uStreak,uChroma,uFlareType;
uniform vec2 uSunUV; uniform float uSunInFront;

// ---------- hashing / noise ----------
vec3 hash33(vec3 p){ p=fract(p*vec3(.1031,.1030,.0973)); p+=dot(p,p.yxz+33.33); return fract((p.xxy+p.yxx)*p.zyx); }
float hash13(vec3 p){ p=fract(p*.1031); p+=dot(p,p.zyx+31.32); return fract((p.x+p.y)*p.z); }
float vnoise(vec3 p){ vec3 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x),mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x),mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=.5,s=0.; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5;} return s; }

// ---------- atmosphere (Nishita single scattering + ozone) ----------
vec2 rsi(vec3 ro,vec3 rd,float r){ float b=dot(ro,rd); float c=dot(ro,ro)-r*r; float d=b*b-c; if(d<0.) return vec2(-1.,-1.); d=sqrt(d); return vec2(-b-d,-b+d); }
void atmosphere(vec3 ro,vec3 rd,out vec3 sky,out vec3 trans,out float ground){
  sky=vec3(0.); trans=vec3(1.); ground=0.;
  float Ra=uPlanetR+uAtmoH;
  vec2 ta=rsi(ro,rd,Ra); if(ta.y<0.) return;
  float t0=max(ta.x,0.), t1=ta.y;
  vec2 tg=rsi(ro,rd,uPlanetR); if(tg.x>0.){ t1=tg.x; ground=1.; }
  const int N=16; const int NL=6;
  float seg=(t1-t0)/float(N);
  vec3 betaR=vec3(5.8e-6,13.5e-6,33.1e-6)*uRayleigh;
  vec3 betaM=vec3(21e-6)*uMie;
  vec3 betaO=vec3(0.65e-6,1.881e-6,0.085e-6)*uOzone;
  vec3 sumR=vec3(0.),sumM=vec3(0.); float odR=0.,odM=0.;
  float mu=dot(rd,uSunDir); float g=uMieG;
  float pR=3./(16.*PI)*(1.+mu*mu);
  float pM=3./(8.*PI)*((1.-g*g)*(1.+mu*mu))/((2.+g*g)*pow(1.+g*g-2.*g*mu,1.5));
  float t=t0;
  for(int i=0;i<N;i++){
    vec3 p=ro+rd*(t+seg*.5); float h=length(p)-uPlanetR;
    float hr=exp(-h/uHr)*seg, hm=exp(-h/uHm)*seg; odR+=hr; odM+=hm;
    vec2 tl=rsi(p,uSunDir,Ra); float segL=tl.y/float(NL); float olR=0.,olM=0.; float tt=0.; bool ok=true;
    for(int j=0;j<NL;j++){ vec3 q=p+uSunDir*(tt+segL*.5); float hq=length(q)-uPlanetR; if(hq<0.){ok=false;break;} olR+=exp(-hq/uHr)*segL; olM+=exp(-hq/uHm)*segL; tt+=segL; }
    if(ok){ vec3 tau=betaR*(odR+olR)+betaM*1.1*(odM+olM)+betaO*(odR+olR); vec3 att=exp(-tau); sumR+=att*hr; sumM+=att*hm; }
    t+=seg;
  }
  trans=exp(-(betaR*odR+betaM*1.1*odM+betaO*odR));
  sky=(sumR*betaR*pR+sumM*betaM*pM)*uSunIntensity*uSunColor;
}

// ---------- stars ----------
vec3 stars(vec3 d,float fade){
  float c=cos(uStarRot),s=sin(uStarRot);
  d=vec3(d.x*c-d.z*s,d.y,d.x*s+d.z*c);
  // tilt to a celestial pole
  float ct=cos(.6),st=sin(.6); d=vec3(d.x,d.y*ct-d.z*st,d.y*st+d.z*ct);
  vec3 p=d*uStarDensity; vec3 cell=floor(p); vec3 h=hash33(cell);
  vec3 sp=cell+.5+(h-.5)*.7; float dist=length(p-sp);
  float present=step(.55,h.x);
  float mag=pow(h.y,5.)*6.+.15;
  float size=uStarSize*(0.5+h.y*1.2);
  float star=present*mag*exp(-dist*dist/(size*size))*(1.+uTwinkle*.8*sin(uTime*(2.+h.z*4.)+h.x*40.));
  vec3 col=mix(vec3(1.,.72,.45),vec3(.75,.85,1.),h.z);
  vec3 out_=star*col*uStarBright*uStarTint;
  // milky way band
  vec3 mwN=normalize(vec3(.3,1.,.2));
  float band=exp(-pow(dot(d,mwN)*4.,2.));
  float n=fbm(d*4.+vec3(3.1)); float n2=fbm(d*11.+vec3(9.7));
  float mw=band*(n*n*1.6)*(.4+.6*n2);
  out_+=mw*uMilky*vec3(.55,.62,.85)*.9;
  out_+=band*uMilky*.02*vec3(.5,.55,.8);
  return out_*fade;
}

// ---------- moon ----------
vec3 moon(vec3 d,out float disc){
  disc=0.;
  float cosA=dot(d,uMoonDir); float ang=acos(clamp(cosA,-1.,1.));
  vec3 u=normalize(cross(uMoonDir,vec3(0.,1.,0.))); vec3 v=cross(u,uMoonDir);
  vec3 col=vec3(0.);
  if(ang<uMoonAng*1.02){
    vec2 lc=vec2(dot(d,u),dot(d,v))/sin(uMoonAng);
    float r2=dot(lc,lc); float z=sqrt(max(0.,1.-r2));
    vec3 n=u*lc.x+v*lc.y-uMoonDir*z;
    float ph=uMoonPhase*2.*PI;
    vec3 lit=-uMoonDir*cos(ph)+u*sin(ph);
    float ndl=max(dot(n,lit),0.);
    float surf=.55+.45*fbm(n*5.+vec3(2.)); surf*=.8+.2*fbm(n*18.);
    float edge=1.-smoothstep(uMoonAng*.975,uMoonAng*1.02,ang);
    disc=edge;
    col=uMoonTint*uMoonBright*(pow(ndl,.8)*surf+.012)*edge;
  }
  float glow=uMoonGlow*uMoonBright*(exp(-ang*22.)*.12+exp(-ang*4.)*.006);
  col+=glow*uMoonTint*(.4+.6*(.5+.5*cos(uMoonPhase*2.*PI)));
  return col;
}

// ---------- lens flare ----------
vec3 hue(float h){ return clamp(abs(mod(h*6.+vec3(0,4,2),6.)-3.)-1.,0.,1.); }
vec3 lensFlare(vec2 uv,vec2 s,float vis){
  vec3 f=vec3(0.);
  vec2 m=uv-s;
  float type=uFlareType;
  float wGhost = (type==0.||type==2.)?1.:0.;
  float wHalo  = (type==0.||type==3.)?1.:(type==2.?.5:0.);
  float wStreak= (type==1.)?2.2:(type==0.?1.:.35);
  float wBurst = (type==2.)?1.:(type==0.?.35:0.);
  // ghosts along the line through the screen centre
  for(int i=0;i<8;i++){
    if(float(i)>=uGhosts) break; float fi=float(i);
    float k=-1.35+fi*.42; vec2 p=s*k;
    float r=.035+.07*fract(fi*.618+.31);
    float dd=length(uv-p);
    float g=smoothstep(r,r*.35,dd)*.9+smoothstep(r*1.6,r,dd)*.25;
    g*=(.06+.06*fract(fi*.37));
    vec3 tint=mix(vec3(1.),hue(fract(fi*.23+.5)),uChroma);
    f+=g*tint*wGhost;
  }
  // rainbow halo around the centre
  float hr=length(uv-s*.25); float ringd=abs(hr-uHalo);
  float halo=smoothstep(.045,0.,ringd)*.09;
  float ang=atan(uv.y-s.y*.25,uv.x-s.x*.25);
  f+=halo*mix(vec3(1.),hue(fract(ang/6.283+ringd*8.)),uChroma*.8)*wHalo;
  // anamorphic streak
  float streak=exp(-abs(m.y)*95.)*exp(-abs(m.x)*2.2)*.55;
  f+=streak*uStreak*mix(vec3(1.),vec3(.45,.65,1.),uChroma)*wStreak;
  // starburst
  float a=atan(m.y,m.x); float burst=pow(abs(sin(a*4.+.3)),24.)*exp(-length(m)*3.5)*.35+pow(abs(sin(a*7.)),40.)*exp(-length(m)*6.)*.25;
  f+=burst*vec3(1.,.95,.85)*wBurst;
  // veiling glare
  f+=exp(-length(m)*1.6)*.04*vec3(1.,.9,.8);
  return f*vis*uFlareInt;
}

// ---------- tonemappers ----------
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
vec3 uc2(vec3 x){ float A=.15,B=.5,C=.1,D=.2,E=.02,F=.3; return ((x*(A*x+C*B)+D*E)/(x*(A*x+B)+D*F))-E/F; }
vec3 filmic(vec3 c){ float W=11.2; return uc2(c*2.)/uc2(vec3(W)); }
vec3 agxish(vec3 c){ c=max(c,0.); vec3 x=log2(c+1e-5); x=clamp((x+12.47)/16.5,0.,1.); return x*x*(3.-2.*x); }

void main(){
  vec2 uv=(gl_FragCoord.xy*2.-uRes)/uRes.y;
  vec3 dir=normalize(uCamFwd+uCamRight*uv.x*uTanHalf+uCamUp*uv.y*uTanHalf);
  vec3 ro=vec3(0.,uPlanetR+uCamHeight,0.);

  vec3 sky,trans; float ground;
  atmosphere(ro,dir,sky,trans,ground);
  sky*=uSkyTint*uSkyBright*uSkyVisible*uAtmoVisible;
  if(uAtmoVisible<.5) trans=vec3(1.);

  float elevDeg=degrees(asin(clamp(uSunDir.y,-1.,1.)));
  float sunUp=smoothstep(-6.,4.,elevDeg);
  float skyLum=dot(sky,vec3(.2126,.7152,.0722));
  float nightFade=clamp(1.-skyLum*14.,0.,1.);

  vec3 col=vec3(0.);
  if(ground>.5){
    float ndl=max(uSunDir.y,0.);
    vec3 sunL=trans*uSunColor*uSunIntensity*.09*ndl;
    vec3 amb=sky*.35+vec3(.002,.003,.006)*uSkyBright;
    col=uGroundColor*uGroundBright*(sunL+amb)+sky;
  }else{
    col=sky;
    // stars / milky way
    if(uStarVisible>.5) col+=stars(dir,nightFade)*trans;
    // moon
    if(uMoonVisible>.5){ float md; vec3 mc=moon(dir,md); col+=mc*trans*.6; }
    // sun disc
    if(uSunVisible>.5){
      float ang=acos(clamp(dot(dir,uSunDir),-1.,1.));
      float disc=1.-smoothstep(uSunAng*(1.-uSunSoft*.9),uSunAng,ang);
      float limb=mix(1.,.55,smoothstep(0.,uSunAng,ang));
      col+=disc*limb*trans*uSunColor*uSunIntensity*uSunDiscBoost;
      // bloom / glow around the sun
      float glow=exp(-ang*40.)*.35+exp(-ang*9.)*.03+exp(-ang*2.5)*.004;
      col+=glow*uBloom*trans*uSunColor*uSunIntensity*.6;
    }
  }
  // sunrise horizon line
  {
    float auto_=mix(1.,exp(-pow((elevDeg+.6)/4.2,2.)),uHLAuto);
    vec2 hxz=normalize(dir.xz+1e-5); vec2 sxz=normalize(uSunDir.xz+1e-5);
    float facing=.5+.5*dot(hxz,sxz);
    float band=exp(-abs(dir.y)*uHLSharp);
    float hl=band*uHLInt*auto_*mix(.25,1.,facing)*mix(1.,.35,ground)*uSkyVisible;
    col+=hl*mix(vec3(1.),vec3(1.,.92,.8),.35)*.9;
  }
  // lens flare (screen-space)
  if(uFlareOn>.5 && uSunVisible>.5){
    float inFrame=1.-smoothstep(1.25,2.2,length(uSunUV*vec2(uRes.y/uRes.x,1.)));
    float vis=uSunInFront*sunUp*inFrame*clamp(dot(uSunColor,vec3(.33)),0.,1.);
    // occlusion by ground: the sun itself must be above horizon
    vis*=step(0.,elevDeg+.5);
    col+=lensFlare(uv,uSunUV,vis)*uSunIntensity*.09*uSunColor;
  }

  // exposure
  col*=exp2(uEV);
  // tonemap
  if(uTonemap==1.) col=aces(col);
  else if(uTonemap==2.) col=col/(1.+col);
  else if(uTonemap==3.) col=filmic(col);
  else if(uTonemap==4.) col=agxish(col);
  else col=clamp(col,0.,1.);
  // vignette
  float vig=1.-uVignette*pow(length(uv*vec2(uRes.y/uRes.x,1.)*.9),2.2);
  col*=clamp(vig,0.,1.);
  // gamma + grain
  col=pow(max(col,0.),vec3(1./2.2));
  float gr=(hash13(vec3(gl_FragCoord.xy,fract(uTime)*100.))-.5)*uGrain*.12;
  col+=gr;
  gl_FragColor=vec4(col,1.);
}
</script>

/* ============================================================
   DERIVED VALUES
   ============================================================ */
const D2R=Math.PI/180;
function sunDir(){
  const t=S.sun_time, lat=S.sun_lat*D2R, HA=(t-12)/24*Math.PI*2, dec=0;
  const sinE=Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(HA);
  const el=Math.asin(Math.max(-1,Math.min(1,sinE)));
  let az=Math.atan2(Math.sin(HA),Math.cos(HA)*Math.sin(lat)-Math.tan(dec)*Math.cos(lat))+Math.PI+S.sun_az*D2R;
  return {el,az,v:[Math.sin(az)*Math.cos(el),Math.sin(el),-Math.cos(az)*Math.cos(el)]};
}
function dirFrom(elDeg,azDeg){ const el=elDeg*D2R,az=azDeg*D2R; return [Math.sin(az)*Math.cos(el),Math.sin(el),-Math.cos(az)*Math.cos(el)]; }
function moonDir(){ if(S.moon_link){ const s=sunDir(); return [-s.v[0],-s.v[1],-s.v[2]]; } return dirFrom(S.moon_elev,S.moon_az); }
const sunElevDeg=()=>sunDir().el/D2R;
function airMass(){ const z=90-sunElevDeg(); if(z>=96) return 40; return Math.min(40,1/(Math.cos(z*D2R)+0.50572*Math.pow(96.07995-z,-1.6364))); }
function zenithLum(){ const e=Math.max(0,Math.sin(sunDir().el)); return (0.02+8*Math.pow(e,0.8))*S.sky_bright*S.atm_rayleigh*S.sun_intensity/22; }
function starVis(){ const e=sunElevDeg(); return Math.max(0,Math.min(1,(-e-1)/8)); }
function moonIllum(){ return (1+Math.cos(S.moon_phase*Math.PI*2))/2; }
function kelvinRGB(k){ k/=100; let r,g,b;
  r=k<=66?255:329.7*Math.pow(k-60,-0.133); g=k<=66?99.47*Math.log(k)-161.1:288.1*Math.pow(k-60,-0.0755); b=k>=66?255:(k<=19?0:138.5*Math.log(k-10)-305);
  return [r,g,b].map(v=>Math.max(0,Math.min(255,v))/255); }
function hex2rgb(h){ return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255); }
function phaseName(e){ if(e>6) return ['Day','#ffd166']; if(e>0) return ['Golden hour','#ffb454']; if(e>-6) return ['Civil twilight','#ff8a65']; if(e>-12) return ['Nautical twilight','#7c8cff']; if(e>-18) return ['Astronomical','#5b5fd6']; return ['Night','#8aa4ff']; }

/* ============================================================
   OUTLINER
   ============================================================ */
let selected='sun'; const openFolders={environment:true,camera:true};
const treeEl=document.getElementById('tree');
function rowHTML(id,cls=''){
  const e=ENTITIES[id]; const vis=S['vis_'+id];
  return `<div class="row ${cls} ${selected===id?'sel':''} ${vis?'':'dim'}" data-id="${id}" style="--acc:${e.color}">
    <span class="ico">${I(e.icon,14)}</span><span class="name">${e.name}</span>
    ${cls?'<span class="tag">Component</span>':''}
    <button class="eye ${vis?'':'off'}" data-eye="${id}" title="Toggle visibility">${I(vis?'eye':'eyeoff',14)}</button></div>`;
}
function renderTree(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const match=id=>!q||ENTITIES[id].name.toLowerCase().includes(q);
  const envKids=ORDER.filter(match);
  treeEl.innerHTML=`
    <div class="row folder ${openFolders.environment?'open':''}" data-folder="environment" style="--acc:#fff">
      <span class="chev">${I('chev',12)}</span><span class="ico" style="color:var(--yellow)">${I('folder',14)}</span>
      <span class="name">Environment</span><span class="count">${envKids.length}</span></div>
    <div class="children ${openFolders.environment?'':'closed'}" style="max-height:${envKids.length*48+8}px">${envKids.map(id=>rowHTML(id)).join('')}</div>
    ${match('camera')||match('post')?`
    <div class="row folder ${openFolders.camera?'open':''} ${selected==='camera'?'sel':''}" data-id="camera" data-folder="camera" style="--acc:${ENTITIES.camera.color}">
      <span class="chev">${I('chev',12)}</span><span class="ico">${I('camera',14)}</span><span class="name">Camera</span><span class="count">1</span></div>
    <div class="children ${openFolders.camera?'':'closed'}" style="max-height:60px">${rowHTML('post','component-row')}</div>`:''}
  `;
}
treeEl.addEventListener('click',e=>{
  const eye=e.target.closest('[data-eye]'); if(eye){ const id=eye.dataset.eye; S['vis_'+id]=!S['vis_'+id]; renderTree(); return; }
  const chev=e.target.closest('.chev'); const row=e.target.closest('.row'); if(!row) return;
  if(chev&&row.dataset.folder){ openFolders[row.dataset.folder]=!openFolders[row.dataset.folder]; renderTree(); return; }
  if(row.dataset.id){ select(row.dataset.id); }
  else if(row.dataset.folder){ openFolders[row.dataset.folder]=!openFolders[row.dataset.folder]; renderTree(); }
});
document.getElementById('search').addEventListener('input',renderTree);
function select(id){ selected=id; renderTree(); renderInspector(); }

/* ============================================================
   INSPECTOR
   ============================================================ */
const insp=document.getElementById('insp');
const histories={}; const closedSecs={};
function fmt(v,dec){ return Number(v).toFixed(dec); }
function bigHTML(v,dec,signed){ const s=fmt(Math.abs(v),dec); const [a,b]=s.split('.'); return `${signed?(v<0?'−':'+'):''}${a}${b!==undefined?`<small>.${b}</small>`:''}`; }
function propHTML(p){
  const v=S[p.k];
  if(p.t==='range') return `<div class="prop" data-k="${p.k}"><div class="prop-top"><div class="l">${p.l}${p.hint?`<small>${p.hint}</small>`:''}</div>
    <div class="num"><input type="number" step="${p.step}" min="${p.min}" max="${p.max}" value="${fmt(v,decOf(p.step))}" data-num="${p.k}"><span class="unit">${p.unit||'—'}</span></div></div>
    <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${v}" data-range="${p.k}" style="--p:${(v-p.min)/(p.max-p.min)*100}%"></div>`;
  if(p.t==='toggle') return `<div class="prop"><div class="prop-top"><div class="l">${p.l}${p.hint?`<small>${p.hint}</small>`:''}</div><div class="sw ${v?'on':''}" data-toggle="${p.k}"></div></div></div>`;
  if(p.t==='color') return `<div class="prop"><div class="prop-top"><div class="l">${p.l}</div><label class="colorbtn" style="--c:${v}"><span class="sw2" style="background:${v}"></span><code>${v}</code><input type="color" value="${v}" data-color="${p.k}"></label></div></div>`;
  if(p.t==='select') return `<div class="prop"><div class="prop-top" style="align-items:flex-start;padding-top:4px"><div class="l">${p.l}</div><div class="seg" data-sel="${p.k}">${p.opts.map(o=>`<button class="${o===v?'on':''}" data-opt="${o}">${o}</button>`).join('')}</div></div></div>`;
}
const decOf=s=>{ const t=String(s); return t.includes('.')?t.split('.')[1].length:0; };
function renderInspector(){
  const e=ENTITIES[selected]; if(!e){ insp.innerHTML='<div class="empty">Select something in the outliner</div>'; return; }
  document.getElementById('inspTitle').innerHTML=`<span style="color:${e.color}">${I(e.icon,18)}</span>${e.name}`;
  document.getElementById('inspKind').textContent=e.kind;
  insp.style.setProperty('--acc',e.color);
  insp.innerHTML=`<div class="ent-enter">
    <div class="hero" style="--acc:${e.color}">
      <div class="label-bar">${e.hero.label}<em>live</em></div>
      <div class="big"><span class="v" id="heroV">${bigHTML(e.hero.fn(),e.hero.dec,e.hero.signed)}</span><span class="u">${e.hero.unit}</span><span class="trend" id="heroTrend">${I('flat',18)}</span></div>
      <div class="delta" id="heroDelta">± 0.00 ${e.hero.unit}</div>
      <div class="spark"><svg id="spark" viewBox="0 0 300 74" preserveAspectRatio="none"></svg><span class="cap">last 30 s</span></div>
    </div>
    ${e.sections.map((sec,i)=>`<div class="sec ${sec.warm||e.warm?'warm':''} ${closedSecs[selected+i]?'closed':''}" data-sec="${i}">
      <div class="sec-head"><span class="sico">${I(sec.icon,16)}</span><span class="t">${sec.title}${sec.sub?`<span>(${sec.sub})</span>`:''}</span><span class="badge">${sec.props.length} props</span><span class="chev">${I('chevu',14)}</span></div>
      <div class="sec-body">${sec.props.map(propHTML).join('')}</div></div>`).join('')}
    ${selected==='camera'?`<div class="sec warm"><div class="sec-head" data-goto="post"><span class="sico" style="color:${ENTITIES.post.color}">${I('fx',16)}</span><span class="t">Post Process<span>component</span></span><span class="badge">attached</span><span class="chev" style="transform:rotate(90deg)">${I('chev',14)}</span></div></div>`:''}
    ${selected==='post'?`<button class="action ghost" data-goto="camera">← Back to Camera</button>`:''}
    <div class="hint">${e.kind} · changes apply to the viewport instantly</div>
  </div>`;
  drawSpark();
}
insp.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.range){ const k=t.dataset.range; S[k]=parseFloat(t.value); const p=findProp(k); t.style.setProperty('--p',((S[k]-p.min)/(p.max-p.min)*100)+'%'); const n=insp.querySelector(`[data-num="${k}"]`); if(n&&document.activeElement!==n) n.value=fmt(S[k],decOf(p.step)); afterChange(k); }
  else if(t.dataset.num){ const k=t.dataset.num; const p=findProp(k); let v=parseFloat(t.value); if(isNaN(v)) return; v=Math.max(p.min,Math.min(p.max,v)); S[k]=v; const r=insp.querySelector(`[data-range="${k}"]`); if(r){ r.value=v; r.style.setProperty('--p',((v-p.min)/(p.max-p.min)*100)+'%'); } afterChange(k); }
  else if(t.dataset.color){ const k=t.dataset.color; S[k]=t.value; const lab=t.closest('.colorbtn'); lab.style.setProperty('--c',t.value); lab.querySelector('.sw2').style.background=t.value; lab.querySelector('code').textContent=t.value; }
});
insp.addEventListener('click',e=>{
  const tg=e.target.closest('[data-toggle]'); if(tg){ const k=tg.dataset.toggle; S[k]=!S[k]; tg.classList.toggle('on',S[k]); afterChange(k); return; }
  const opt=e.target.closest('[data-opt]'); if(opt){ const seg=opt.closest('[data-sel]'); S[seg.dataset.sel]=opt.dataset.opt; seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===opt)); return; }
  const go=e.target.closest('[data-goto]'); if(go){ select(go.dataset.goto); return; }
  const head=e.target.closest('.sec-head'); if(head){ const sec=head.parentElement; const i=sec.dataset.sec; if(i===undefined) return; sec.classList.toggle('closed'); closedSecs[selected+i]=sec.classList.contains('closed'); }
});
function findProp(k){ for(const id in ENTITIES) for(const s of ENTITIES[id].sections) for(const p of s.props) if(p.k===k) return p; }
function afterChange(k){ if(k==='sun_time'){ timeScrub.value=S.sun_time; } if(k==='cam_fov'||k==='cam_yaw'||k==='cam_pitch'){} }
function syncProp(k){ // reflect state -> UI when changed externally (drag, time play)
  const p=findProp(k); if(!p) return; const r=insp.querySelector(`[data-range="${k}"]`); if(!r) return;
  r.value=S[k]; r.style.setProperty('--p',((S[k]-p.min)/(p.max-p.min)*100)+'%'); const n=insp.querySelector(`[data-num="${k}"]`); if(n&&document.activeElement!==n) n.value=fmt(S[k],decOf(p.step));
}
function drawSpark(){
  const svg=document.getElementById('spark'); if(!svg) return; const h=histories[selected]||[]; if(h.length<2){ svg.innerHTML=''; return; }
  let mn=Math.min(...h),mx=Math.max(...h); if(mx-mn<1e-6){mx=mn+1;mn-=1;}
  const pts=h.map((v,i)=>[i/(h.length-1)*300, 8+(1-(v-mn)/(mx-mn))*58]);
  const line=pts.map(p=>p.join(',')).join(' ');
  const imax=h.indexOf(mx);
  const dots=pts.filter((_,i)=>i%9===4&&i!==pts.length-1).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="#fff"/>`).join('');
  const last=pts[pts.length-1];
  svg.innerHTML=`<defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
    <polygon points="0,74 ${line} 300,74" fill="url(#g)"/><polyline points="${line}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
    ${dots}<circle cx="${pts[imax][0]}" cy="${pts[imax][1]}" r="3.6" fill="var(--red)"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="${last[0]}" cy="${last[1]}" r="2" fill="#fff"/>`;
}
setInterval(()=>{ // sample hero histories
  for(const id in ENTITIES){ const v=ENTITIES[id].hero.fn(); (histories[id]=histories[id]||[]).push(v); if(histories[id].length>60) histories[id].shift(); }
  const e=ENTITIES[selected]; if(!e) return; const hv=document.getElementById('heroV'); if(!hv) return;
  const h=histories[selected]; const v=h[h.length-1], prev=h[Math.max(0,h.length-9)]; const d=v-prev;
  hv.innerHTML=bigHTML(v,e.hero.dec,e.hero.signed);
  const dl=document.getElementById('heroDelta'); dl.textContent=`${d>=0?'+':'−'}${fmt(Math.abs(d),e.hero.dec)} ${e.hero.unit} · 4 s`; dl.className='delta '+(Math.abs(d)<1e-4?'':(d>0?'pos':'neg'));
  document.getElementById('heroTrend').innerHTML=I(Math.abs(d)<1e-4?'flat':(d>0?'up':'down'),18);
  drawSpark();
},500);

/* ============================================================
   TOP BAR / TIME
   ============================================================ */
const timeScrub=document.getElementById('timeScrub'), playBtn=document.getElementById('playBtn');
timeScrub.addEventListener('input',()=>{ S.sun_time=parseFloat(timeScrub.value); syncProp('sun_time'); });
playBtn.addEventListener('click',()=>{ S.play=!S.play; playBtn.classList.toggle('on',S.play); document.getElementById('playIco').innerHTML=S.play?'<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>':'<path d="M8 5v14l11-7z"/>'; });
document.getElementById('speedSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; S.speed=parseFloat(b.dataset.s); [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b)); });
document.getElementById('resetBtn').addEventListener('click',()=>{ const p=S.play; defaults(); S.play=p; timeScrub.value=S.sun_time; renderTree(); renderInspector(); });
function updateClock(){ const t=S.sun_time; const h=Math.floor(t), m=Math.floor((t-h)*60); document.getElementById('clock').innerHTML=`${String(h%24).padStart(2,'0')}:${String(m).padStart(2,'0')}<small>SAST</small>`;
  const e=sunElevDeg(); const [n,c]=phaseName(e); document.getElementById('phaseTxt').innerHTML=`<b>${n}</b>`; const d=document.getElementById('phaseDot'); d.style.background=c; d.style.boxShadow=`0 0 10px ${c}`;
  document.getElementById('hudSun').textContent=e.toFixed(1)+'°'; document.getElementById('hudMoon').textContent=Math.round(moonIllum()*100)+'%'; }

/* ============================================================
   WEBGL
   ============================================================ */
const canvas=document.getElementById('gl');
const gl=canvas.getContext('webgl',{antialias:false,alpha:false,preserveDrawingBuffer:false});
function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent));
gl.linkProgram(prog); if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog)); gl.useProgram(prog);
const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={}; const u=n=>U[n]||(U[n]=gl.getUniformLocation(prog,n));
const f1=(n,v)=>gl.uniform1f(u(n),v), f2=(n,a,b)=>gl.uniform2f(u(n),a,b), f3=(n,v)=>gl.uniform3f(u(n),v[0],v[1],v[2]);
function resize(){ const dpr=Math.min(devicePixelRatio||1,1.5); const w=Math.floor(innerWidth*dpr), h=Math.floor(innerHeight*dpr); if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; gl.viewport(0,0,w,h); } }
addEventListener('resize',resize);

// camera interaction
let drag=null;
canvas.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,yaw:S.cam_yaw,pitch:S.cam_pitch}; canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(!drag) return; const k=S.cam_fov/innerHeight; S.cam_yaw=((drag.yaw-(e.clientX-drag.x)*k+180)%360+360)%360-180; S.cam_pitch=Math.max(-30,Math.min(89,drag.pitch+(e.clientY-drag.y)*k)); if(selected==='camera'){ syncProp('cam_yaw'); syncProp('cam_pitch'); } });
canvas.addEventListener('pointerup',()=>{ drag=null; canvas.classList.remove('drag'); });
canvas.addEventListener('wheel',e=>{ S.cam_fov=Math.max(20,Math.min(120,S.cam_fov+e.deltaY*0.03)); if(selected==='camera') syncProp('cam_fov'); },{passive:true});

const TM={None:0,ACES:1,Reinhard:2,Filmic:3,AgX:4}, FT={Cinematic:0,Anamorphic:1,Starburst:2,Halo:3};
let last=performance.now(), fpsAcc=0, fpsN=0, t0=last;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if(S.play){ S.sun_time=(S.sun_time+dt*S.speed)%24; timeScrub.value=S.sun_time; if(selected==='sun') syncProp('sun_time'); }
  resize(); updateClock();
  const time=(now-t0)/1000;
  // camera basis
  const yaw=S.cam_yaw*D2R, pitch=S.cam_pitch*D2R;
  const fwd=[Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)];
  let right=[Math.cos(yaw),0,Math.sin(yaw)]; // cross(fwd, up)
  const up=[-Math.sin(pitch)*Math.sin(yaw),Math.cos(pitch),Math.sin(pitch)*Math.cos(yaw)];
  const tanH=Math.tan(S.cam_fov*D2R/2);
  const sd=sunDir(); const sv=sd.v;
  const cx=sv[0]*right[0]+sv[1]*right[1]+sv[2]*right[2], cy=sv[0]*up[0]+sv[1]*up[1]+sv[2]*up[2], cz=sv[0]*fwd[0]+sv[1]*fwd[1]+sv[2]*fwd[2];
  const inFront=cz>0.02?1:0; const sunUV=inFront?[cx/cz/tanH,cy/cz/tanH]:[99,99];

  f2('uRes',canvas.width,canvas.height); f1('uTime',time);
  f3('uCamFwd',fwd); f3('uCamRight',right); f3('uCamUp',up); f1('uTanHalf',tanH); f1('uCamHeight',S.cam_height);
  f3('uSunDir',sv); f3('uSunColor',kelvinRGB(S.sun_temp)); f1('uSunIntensity',S.sun_intensity); f1('uSunAng',S.sun_ang*D2R/2); f1('uSunSoft',S.sun_soft); f1('uSunVisible',S.vis_sun?1:0); f1('uSunDiscBoost',S.sun_disc);
  f1('uRayleigh',S.atm_rayleigh); f1('uMie',S.atm_mie); f1('uMieG',S.atm_mieG); f1('uOzone',S.atm_ozone); f1('uPlanetR',S.atm_planetR*1000); f1('uAtmoH',S.atm_height*1000); f1('uHr',S.atm_hr); f1('uHm',S.atm_hm); f1('uAtmoVisible',S.vis_atmosphere?1:0);
  f3('uSkyTint',hex2rgb(S.sky_tint)); f3('uGroundColor',hex2rgb(S.sky_ground)); f1('uSkyBright',S.sky_bright); f1('uGroundBright',S.sky_groundBright); f1('uSkyVisible',S.vis_sky?1:0); f1('uHLInt',S.hl_int); f1('uHLSharp',S.hl_sharp); f1('uHLAuto',S.hl_auto?1:0);
  f1('uStarDensity',S.star_density); f1('uStarBright',S.star_bright); f1('uStarSize',S.star_size); f1('uTwinkle',S.star_twinkle); f1('uMilky',S.star_milky); f1('uStarRot',S.star_rot*D2R+(S.star_spin?S.sun_time/24*Math.PI*2:0)); f1('uStarVisible',S.vis_stars?1:0); f3('uStarTint',hex2rgb(S.star_tint));
  f3('uMoonDir',moonDir()); f3('uMoonTint',hex2rgb(S.moon_tint)); f1('uMoonAng',S.moon_size*D2R/2); f1('uMoonBright',S.moon_bright); f1('uMoonPhase',S.moon_phase); f1('uMoonGlow',S.moon_glow); f1('uMoonVisible',S.vis_moon?1:0);
  const pp=S.vis_post;
  f1('uEV',pp?S.pp_ev:0); f1('uTonemap',pp?TM[S.pp_tonemap]:1); f1('uBloom',pp?S.pp_bloom:0); f1('uVignette',pp?S.pp_vignette:0); f1('uGrain',pp?S.pp_grain:0);
  f1('uFlareOn',pp&&S.pp_flare?1:0); f1('uFlareInt',S.pp_flareInt); f1('uGhosts',S.pp_ghosts); f1('uHalo',S.pp_halo); f1('uStreak',S.pp_streak); f1('uChroma',S.pp_chroma); f1('uFlareType',FT[S.pp_flareType]);
  f2('uSunUV',sunUV[0],sunUV[1]); f1('uSunInFront',inFront);
  gl.drawArrays(gl.TRIANGLES,0,3);
  fpsAcc+=dt; fpsN++; if(fpsAcc>0.5){ document.getElementById('fps').textContent=Math.round(fpsN/fpsAcc); fpsAcc=0; fpsN=0; }
  requestAnimationFrame(frame);
}
renderTree(); renderInspector(); requestAnimationFrame(frame);
addEventListener('keydown',e=>{ if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='f'){ e.preventDefault(); document.getElementById('search').focus(); } if(e.key===' '&&document.activeElement.tagName!=='INPUT'){ e.preventDefault(); playBtn.click(); } });
</script>
