function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (v, dec) => Number(v).toFixed(dec ?? 2);

function colorChip(value, onChange) {
  const wrap = el('div', 'colorrow');
  const chip = el('div', 'colorchip', `<input type="color" value="${value}">`);
  chip.style.background = value;
  const hex = el('span', 'hexval', value.toUpperCase());
  const input = chip.querySelector('input');
  input.oninput = () => { chip.style.background = input.value; hex.textContent = input.value.toUpperCase(); onChange(input.value); };
  wrap.append(chip, hex);
  wrap._set = v => { input.value = v; chip.style.background = v; hex.textContent = v.toUpperCase(); };
  return wrap;
}


/* ── the number, with a nudge either side ──────────────────────────────────────────────────── */
function stepper({ value = 0, min = -Infinity, max = Infinity, dec = 2, step = 0.1, unit = '', onInput }) {
  const wrap = el('div', 'step');
  wrap.innerHTML = `<button class="mn" tabindex="-1">−</button>
    <span class="f"><input value="${fmt(value, dec)}"><i>${unit}</i></span>
    <button class="pl" tabindex="-1">+</button>`;
  const inp = wrap.querySelector('input');
  let v = clamp(value, min, max);
  const paint = () => { if (document.activeElement !== inp) inp.value = fmt(v, dec); };
  const set = (nv, fire = true) => {
    v = clamp(nv, min, max);
    paint();
    if (fire && onInput) onInput(v);
  };
  wrap.querySelector('.mn').onclick = () => set(v - step);
  wrap.querySelector('.pl').onclick = () => set(v + step);
  inp.onkeydown = e => {
    e.stopPropagation();
    if (e.key === 'Enter') inp.blur();
    if (e.key === 'ArrowUp') { e.preventDefault(); set(v + step); }
    if (e.key === 'ArrowDown') { e.preventDefault(); set(v - step); }
  };
  inp.onblur = () => { const n = parseFloat(inp.value); isFinite(n) ? set(n) : paint(); };
  wrap._set = nv => set(nv, false);
  return wrap;
}

/* ── the tape ──────────────────────────────────────────────────────────────────────────────── */
function tape({
  label, min = 0, max = 1, value = 0, dec = 2, step, unit = '', marks, height = 30,
  toPos, fromPos, tint, onInput,
}) {
  const wrap = el('div', 'tape');
  const head = el('div', 'hd', `<span class="k">${label}</span>`);
  const st = stepper({
    value, min, max, dec, unit,
    step: step ?? +((max - min) / 100).toPrecision(1),
    onInput: v => set(v),
  });
  head.appendChild(st);
  const cv = el('canvas');
  wrap.append(head, cv);

  let v = clamp(value, min, max);
  const pos = x => (toPos ? toPos(x, min, max) : (x - min) / (max - min || 1));
  const val = t => (fromPos ? fromPos(t, min, max) : min + t * (max - min));

  const g = cv.getContext('2d');
  function paint() {
    const w = wrap.clientWidth || 260, h = height;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
    cv.style.height = h + 'px';
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const pad = 8, span = w - pad * 2, base = h - 11;
    g.font = '8px ui-sans-serif, system-ui';

    /* the ruler */
    for (let i = 0; i <= 40; i++) {
      const t = i / 40;
      const major = i % 10 === 0;
      const on = t <= pos(v);
      g.strokeStyle = major ? 'rgba(255,255,255,.30)'
        : `rgba(255,255,255,${on ? 0.22 : 0.09})`;
      g.lineWidth = 1;
      const len = major ? 9 : (i % 5 === 0 ? 6 : 4);
      const x = pad + t * span;
      g.beginPath(); g.moveTo(x, base - len); g.lineTo(x, base); g.stroke();
    }
    g.strokeStyle = 'rgba(255,255,255,.10)';
    g.beginPath(); g.moveTo(pad, base + .5); g.lineTo(pad + span, base + .5); g.stroke();

    /* what the ends and the middle mean */
    const ms = marks || [{ t: 0, l: fmt(min, dec) }, { t: 1, l: fmt(max, dec) }];
    g.fillStyle = 'rgba(255,255,255,.28)';
    const taken = [];                                  /* a label that would collide is dropped */
    ms.forEach(({ t, l }) => {
      const x = pad + t * span, tw = g.measureText(l).width;
      const x0 = t <= 0 ? x : t >= 1 ? x - tw : x - tw / 2;
      const x1 = x0 + tw;
      if (taken.some(([a, b]) => x0 < b + 5 && x1 > a - 5)) return;
      taken.push([x0, x1]);
      g.textAlign = t <= 0 ? 'left' : t >= 1 ? 'right' : 'center';
      g.fillText(l, x, h - 1);
    });

    /* the marker */
    const x = pad + pos(v) * span;
    g.fillStyle = tint || '#fff';
    g.beginPath();
    g.moveTo(x, base - 13); g.lineTo(x + 4, base - 19); g.lineTo(x - 4, base - 19);
    g.closePath(); g.fill();
    g.strokeStyle = tint || 'rgba(255,255,255,.85)';
    g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(x, base - 12); g.lineTo(x, base); g.stroke();
  }

  const set = (nv, fire = true) => {
    v = clamp(nv, min, max);
    st._set(v);
    paint();
    if (fire && onInput) onInput(v);
  };

  const fromEvent = e => {
    const r = cv.getBoundingClientRect();
    const pad = 8, span = Math.max(1, r.width - pad * 2);
    set(val(clamp((e.clientX - r.left - pad) / span, 0, 1)));
  };
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); fromEvent(e);
  });
  cv.addEventListener('pointermove', e => { if (cv.hasPointerCapture?.(e.pointerId)) fromEvent(e); });
  cv.addEventListener('pointerup', e => { cv.releasePointerCapture?.(e.pointerId); cv.classList.remove('drag'); });
  cv.addEventListener('wheel', e => { e.preventDefault(); set(v - Math.sign(e.deltaY) * (max - min) / 100); }, { passive: false });

  wrap._set = nv => { v = clamp(nv, min, max); st._set(v); paint(); };
  wrap._paint = paint;
  requestAnimationFrame(paint);
  return wrap;
}

/* ── a state, said as a word rather than drawn as a switch ─────────────────────────────────── */
function pillToggle(label, value, onChange) {
  const b = el('button', `mp-tag state${value ? ' on' : ''}`, `<i></i>${label}`);
  b.onclick = () => {
    const next = !b.classList.contains('on');
    b.classList.toggle('on', next);
    onChange(next);
  };
  b._set = v => b.classList.toggle('on', !!v);
  return b;
}

/* ── the flat facts at the bottom of a card ────────────────────────────────────────────────── */
function specList(rows) {
  const wrap = el('div', 'mp-spec');
  rows.forEach(([k, v]) => wrap.insertAdjacentHTML('beforeend',
    `<div><span class="k">${k}</span><b>${v}</b></div>`));
  return wrap;
}


const rgb = c => {
  const n = parseInt((c || '#2f6dd0').slice(1), 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
};
const mixC = (a, b, t) => {
  const A = rgb(a), B = rgb(b), f = Math.max(0, Math.min(1, t));
  return [A[0] + (B[0] - A[0]) * f, A[1] + (B[1] - A[1]) * f, A[2] + (B[2] - A[2]) * f];
};
const css = ([r, g, b], a = 1) =>
  `rgba(${Math.round(Math.max(0, Math.min(255, r)))},${Math.round(Math.max(0, Math.min(255, g)))},${Math.round(Math.max(0, Math.min(255, b)))},${a})`;

/* Henyey–Greenstein: one number, and it decides whether haze glows around the sun or everywhere */
const hg = (cosT, g) =>
  (1 - g * g) / (4 * Math.PI * Math.pow(Math.max(1e-4, 1 + g * g - 2 * g * cosT), 1.5));

/* Koschmieder: how far you can see before contrast is gone */
const extinction = (turbidity, mie) => 0.02 * turbidity + mie * 1.2;   /* per km */
const visibilityKm = (turbidity, mie) => 3.912 / Math.max(0.002, extinction(turbidity, mie));

/* a wavelength, as a colour you can paint with */
function spectrum(nm) {
  let r = 0, g = 0, b = 0;
  if (nm < 440) { r = -(nm - 440) / 60; b = 1; }
  else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
  else if (nm < 510) { g = 1; b = -(nm - 510) / 20; }
  else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
  else if (nm < 645) { r = 1; g = -(nm - 645) / 65; }
  else { r = 1; }
  const f = nm < 420 ? 0.3 + 0.7 * (nm - 380) / 40 : nm > 700 ? 0.3 + 0.7 * (780 - nm) / 80 : 1;
  return [r * f * 255, g * f * 255, b * f * 255];
}

/* ── the panel ─────────────────────────────────────────────────────────────────────────────── */
function skyPanel(node, ctx) {
  const { compact = false, setProp, register } = ctx;
  const P = node.props;
  const host = el('div', 'mpanel skypanel');
  const syncers = [];
  const on = (elm, ev, fn) => elm.addEventListener(ev, fn);
  const sunAlt = () => (ctx.sunAlt ? ctx.sunAlt() : 14);

  const RAY = () => P.rayleigh ?? 1.35;
  const MIE = () => P.mie ?? 0.22;
  const MIEG = () => P.mieG ?? 0.78;
  const TURB = () => P.turbidity ?? 3.4;
  const OZ = () => P.ozone ?? 1;

  /* one model, used by the hero and by the gradient strip, so they can never disagree */
  function sample(elevDeg, dAzDeg) {
    const alt = sunAlt();
    const e = Math.max(-2, elevDeg);
    const sinE = Math.sin(Math.max(0, e) * D2R);
    const day = Math.max(0, Math.min(1, (alt + 6) / 12));
    const night = 1 - day;
    const zen = P.zenith || '#2f6dd0', hor = P.horizon || '#9fc4e8';

    const rayMix = Math.min(1, Math.pow(1 - sinE, 1.1) * (0.5 + TURB() * 0.06) * (0.45 + RAY() * 0.45));
    let c = mixC(zen, hor, rayMix);

    /* night: the sky keeps its hue but loses almost all of its light */
    const lum = 0.06 + 0.94 * day;
    c = c.map(v => v * lum);

    const oz = OZ() * night;
    c = [c[0] * (1 - oz * 0.35), c[1] * (1 - oz * 0.18), c[2] * (1 + oz * 0.06)];

    /* the sun's halo: the phase function normalised to its own peak, so it can never blow out */
    const gAsym = Math.min(0.95, MIEG());
    const cosT = Math.cos(e * D2R) * Math.cos(Math.abs(dAzDeg) * D2R) * Math.cos(alt * D2R)
      + Math.sin(e * D2R) * Math.sin(alt * D2R);
    const glow = (hg(cosT, gAsym) / hg(1, gAsym)) * (0.25 + MIE() * 1.9) * Math.max(0.04, day);
    c = [c[0] + glow * 235, c[1] + glow * 218, c[2] + glow * 186];

    const haze = Math.pow(1 - sinE, 5) * (0.08 + MIE() * 0.9) * (0.15 + day * 0.85);
    c = [c[0] + haze * 62, c[1] + haze * 66, c[2] + haze * 74];

    const sky = P.intensity ?? 1;
    return c.map(v => v * (0.55 + sky * 0.45));
  }

  /* ── hero · a slice of the sky ─────────────────────────────────────────────────────────── */
  const hero = el('div', 'pcard mp-hero sk-hero');
  const cv = el('canvas', 'mp-sky');
  cv.title = 'Drag: across for turbidity, up and down for Rayleigh';
  const cap = el('div', 'mp-cap',
    `<div class="l"><b class="sk-name">—</b><span class="mp-illum sk-sub">—</span></div>
     <div class="r"><span class="sk-r">—</span></div>`);
  hero.append(cv, cap);
  host.appendChild(hero);

  const sky = cv.getContext('2d');
  let dragging = null;
  function paintHero() {
    const w = cv.clientWidth || 300, h = compact ? 140 : 168;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
    cv.style.height = h + 'px';
    const g = sky;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);

    const gy = h - 16;                                   /* the ground line */
    const STEP = 3;
    for (let x = 0; x < w; x += STEP) {
      const dAz = (x / w - 0.5) * 180;
      for (let y = 0; y < gy; y += STEP) {
        const e = (1 - y / gy) * 90;
        g.fillStyle = css(sample(e, dAz));
        g.fillRect(x, y, STEP + 0.5, STEP + 0.5);
      }
    }

    /* the sun, if it is up there */
    const alt = sunAlt();
    if (alt > -3) {
      const sy = (1 - Math.min(90, Math.max(0, alt)) / 90) * gy;
      const sx = w / 2;
      const glow = g.createRadialGradient(sx, sy, 0, sx, sy, 34);
      glow.addColorStop(0, 'rgba(255,248,226,.95)');
      glow.addColorStop(0.25, 'rgba(255,240,205,.35)');
      glow.addColorStop(1, 'rgba(255,240,205,0)');
      g.fillStyle = glow;
      g.beginPath(); g.arc(sx, sy, 34, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(255,252,240,.95)';
      g.beginPath(); g.arc(sx, sy, 5, 0, Math.PI * 2); g.fill();
    }

    /* the ground bounce, so the strip has a floor */
    g.fillStyle = css(rgb(P.ground || '#14181d'));
    g.fillRect(0, gy, w, h - gy);
    g.strokeStyle = 'rgba(255,255,255,.10)';
    g.beginPath(); g.moveTo(0, gy + .5); g.lineTo(w, gy + .5); g.stroke();

    /* the scales */
    g.font = '8px ui-sans-serif, system-ui';
    [[0, '0°'], [30, '30'], [60, '60'], [90, '90° ZENITH']].forEach(([e, l]) => {
      const y = (1 - e / 90) * gy;
      g.strokeStyle = 'rgba(255,255,255,.10)';
      g.beginPath(); g.moveTo(0, y); g.lineTo(10, y); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.42)';
      g.textAlign = 'left';
      g.fillText(l, 13, y + (e === 90 ? 9 : 3));
    });
    g.textAlign = 'center';
    g.fillStyle = 'rgba(255,255,255,.42)';
    [[-90, '−90°'], [0, 'SUN'], [90, '+90°']].forEach(([d, l]) => {
      const x = (d / 180 + 0.5) * w;
      g.textAlign = d < 0 ? 'left' : d > 0 ? 'right' : 'center';
      g.fillText(l, Math.max(4, Math.min(w - 4, x)), h - 5);
    });

    if (dragging) {
      g.strokeStyle = 'rgba(255,255,255,.3)';
      g.setLineDash([2, 3]);
      g.beginPath();
      g.moveTo(dragging.x, 0); g.lineTo(dragging.x, h);
      g.moveTo(0, dragging.y); g.lineTo(w, dragging.y);
      g.stroke();
      g.setLineDash([]);
    }
  }

  const nameEl = cap.querySelector('.sk-name');
  const subEl = cap.querySelector('.sk-sub');
  const rEl = cap.querySelector('.sk-r');
  const airName = () => {
    const t = TURB();
    if (t < 2) return 'Arctic air';
    if (t < 3) return 'Clear air';
    if (t < 5) return 'Clean air';
    if (t < 8) return 'Hazy air';
    if (t < 13) return 'Murky air';
    return 'Smog';
  };
  function paintCap() {
    nameEl.textContent = airName();
    subEl.textContent = `turbidity ${TURB().toFixed(1)} · rayleigh ${RAY().toFixed(2)} · mie ${MIE().toFixed(3)}`;
    rEl.innerHTML = `${visibilityKm(TURB(), MIE()).toFixed(0)} km`;
  }

  const heroFrom = e => {
    const r = cv.getBoundingClientRect();
    const x = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    const y = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
    dragging = { x: x * r.width, y: y * r.height };
    setProp(node, 'turbidity', +(1 + x * 19).toFixed(1));
    setProp(node, 'rayleigh', +(4 * (1 - y)).toFixed(2));
    paintAll();
  };
  on(cv, 'pointerdown', e => { cv.setPointerCapture(e.pointerId); cv.classList.add('grabbing'); heroFrom(e); });
  on(cv, 'pointermove', e => { if (cv.hasPointerCapture?.(e.pointerId)) heroFrom(e); });
  const endDrag = () => { dragging = null; cv.classList.remove('grabbing'); paintHero(); };
  on(cv, 'pointerup', endDrag);
  on(cv, 'pointercancel', endDrag);

  /* ── rail and duo ──────────────────────────────────────────────────────────────────────── */
  const rail = el('div', 'mp-rail');
  const pill = k => {
    const b = el('div', 'mp-pill', `<b class="v">—</b><span class="k">${k}</span>`);
    rail.appendChild(b);
    return b.querySelector('.v');
  };
  const pRay = pill('Rayleigh'), pTurb = pill('Turbidity'), pMie = pill('Mie'), pOz = pill('Ozone');
  host.appendChild(rail);

  const duo = el('div', 'mp-duo');
  const statCard = (icon, label) => {
    const c = el('div', 'pcard mp-stat',
      `<span class="i">${icon}</span><span class="l">${label}</span><b class="n">—</b>`);
    duo.appendChild(c);
    return c;
  };
  const sVis = statCard(ic('eye', { size: 12 }), 'Visibility');
  const sLight = statCard(ic('sky', { size: 12 }), 'Sky light');
  host.appendChild(duo);

  /* ── extinction spectrum ───────────────────────────────────────────────────────────────── */
  const mc = el('div', 'pcard mp-metric sk-spec');
  mc.innerHTML = `
    <div class="mp-chead">
      <div class="l"><span class="t">Extinction</span><span class="s">Per kilometre · 380–720 nm</span></div>
      <button class="mp-x" title="Taller chart">${ic('arrowout', { size: 12 })}</button>
    </div>
    <div class="mp-num"><span class="i">—</span><span class="d"></span><span class="u">km</span></div>
    <div class="mp-k mp-target">Visibility <span class="v">—</span></div>`;
  const chartWrap = el('div', 'mp-chartwrap');
  const chart = el('canvas');
  chartWrap.appendChild(chart);
  mc.appendChild(chartWrap);
  const specs = el('div', 'mp-spec sk-specs');
  mc.appendChild(specs);
  const numI = mc.querySelector('.mp-num .i'), numD = mc.querySelector('.mp-num .d');
  const visV = mc.querySelector('.mp-target .v');
  mc.querySelector('.mp-x').onclick = () => { mc.classList.toggle('tall'); paintSpectrum(); };
  host.appendChild(mc);

  /* Rayleigh goes as λ⁻⁴, which is the whole reason for the colour of everything above you */
  const rayAt = nm => RAY() * 0.012 * Math.pow(550 / nm, 4);
  const mieAt = () => MIE() * 1.2 + TURB() * 0.004;
  function paintSpectrum() {
    const w = chartWrap.clientWidth || 280, h = mc.classList.contains('tall') ? 168 : 112;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    if (chart.width !== w * dpr || chart.height !== h * dpr) { chart.width = w * dpr; chart.height = h * dpr; }
    chart.style.height = h + 'px';
    const g = chart.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const L = 2, R = 32, T = 8, B = 16;
    const top = Math.max(0.12, rayAt(380) + mieAt()) * 1.15;
    const px = nm => L + (nm - 380) / 340 * (w - L - R);
    const py = v => T + (1 - v / top) * (h - T - B);
    g.font = '9px ui-sans-serif, system-ui';

    [0.25, 0.5, 0.75, 1].forEach(f => {
      g.strokeStyle = 'rgba(255,255,255,.06)';
      g.setLineDash([2, 5]);
      g.beginPath(); g.moveTo(px(380), py(top * f)); g.lineTo(px(720), py(top * f)); g.stroke();
      g.setLineDash([]);
      g.fillStyle = 'rgba(255,255,255,.26)';
      g.textAlign = 'left';
      g.fillText((top * f).toFixed(2), w - R + 5, py(top * f) + 3);
    });

    /* the visible spectrum, painted under the curve it belongs to */
    for (let nm = 380; nm <= 720; nm += 2) {
      const v = rayAt(nm) + mieAt();
      g.fillStyle = css(spectrum(nm), 0.30);
      g.fillRect(px(nm), py(v), 2.4, py(0) - py(v));
    }
    /* mie alone: flat, grey, and the reason haze washes colour out */
    g.strokeStyle = 'rgba(255,255,255,.42)';
    g.setLineDash([4, 3]);
    g.beginPath(); g.moveTo(px(380), py(mieAt())); g.lineTo(px(720), py(mieAt())); g.stroke();
    g.setLineDash([]);
    g.fillStyle = 'rgba(255,255,255,.34)';
    g.textAlign = 'left';
    g.fillText('MIE', px(392), py(mieAt()) - 4);

    /* total */
    g.beginPath();
    for (let nm = 380; nm <= 720; nm += 2) {
      const v = rayAt(nm) + mieAt();
      nm === 380 ? g.moveTo(px(nm), py(v)) : g.lineTo(px(nm), py(v));
    }
    g.strokeStyle = 'rgba(255,255,255,.9)';
    g.lineWidth = 1.6;
    g.stroke();
    g.lineWidth = 1;

    g.fillStyle = 'rgba(255,255,255,.26)';
    [[400, '400'], [550, '550 nm'], [700, '700']].forEach(([nm, l], i) => {
      g.textAlign = i === 0 ? 'left' : i === 2 ? 'right' : 'center';
      g.fillText(l, px(nm), h - 3);
    });
  }

  /* ── haze ──────────────────────────────────────────────────────────────────────────────── */
  const hc = el('div', 'pcard mp-light sk-haze');
  hc.innerHTML = `
    <div class="mp-chead">
      <div class="l"><span class="t">Haze</span><span class="s">Mie scattering · phase</span></div>
    </div>`;
  const hb = el('div', 'pbody');
  hc.appendChild(hb);
  hc.querySelector('.mp-chead .l').onclick = () => hc.classList.toggle('shut');

  const phaseWrap = el('div', 'mp-meter sk-phase');
  phaseWrap.innerHTML = '<div class="hd"><span class="k">phase function</span></div>';
  const phaseCv = el('canvas');
  phaseWrap.appendChild(phaseCv);
  const gStep = stepper({
    value: MIEG(), min: 0, max: 0.98, dec: 2, step: 0.01,
    onInput: v => { setProp(node, 'mieG', v); paintAll(); },
  });
  phaseWrap.querySelector('.hd').appendChild(gStep);
  hb.appendChild(phaseWrap);
  const phaseFrom = e => {
    const r = phaseCv.getBoundingClientRect();
    const pad = 8, span = Math.max(1, r.width - pad * 2);
    setProp(node, 'mieG', +Math.max(0, Math.min(0.98, (e.clientX - r.left - pad) / span * 0.98)).toFixed(2));
    paintAll();
  };
  on(phaseCv, 'pointerdown', e => { phaseCv.setPointerCapture(e.pointerId); phaseCv.classList.add('drag'); phaseFrom(e); });
  on(phaseCv, 'pointermove', e => { if (phaseCv.hasPointerCapture?.(e.pointerId)) phaseFrom(e); });
  on(phaseCv, 'pointerup', e => { phaseCv.releasePointerCapture?.(e.pointerId); phaseCv.classList.remove('drag'); });

  const mieT = tape({
    label: 'Mie haze', min: 0, max: 1, value: MIE(), dec: 3, step: 0.005,
    marks: [{ t: 0, l: 'VACUUM' }, { t: 0.22, l: 'CLEAR' }, { t: 1, l: 'FOG' }],
    onInput: v => { setProp(node, 'mie', v); paintAll(); },
  });
  const turbT = tape({
    label: 'Turbidity', min: 1, max: 20, value: TURB(), dec: 1, step: 0.1,
    marks: [{ t: 0, l: 'ARCTIC 1' }, { t: 2.4 / 19, l: 'CLEAR 3.4' }, { t: 1, l: 'SMOG 20' }],
    onInput: v => { setProp(node, 'turbidity', v); paintAll(); },
  });
  const rayT = tape({
    label: 'Rayleigh', min: 0, max: 4, value: RAY(), dec: 2, step: 0.01,
    marks: [{ t: 0, l: 'NONE' }, { t: 0.3375, l: 'EARTH 1.35' }, { t: 1, l: '4×' }],
    onInput: v => { setProp(node, 'rayleigh', v); paintAll(); },
  });
  const ozT = tape({
    label: 'Ozone', min: 0, max: 3, value: OZ(), dec: 2, step: 0.01,
    marks: [{ t: 0, l: 'NONE' }, { t: 1 / 3, l: 'EARTH 1.0' }, { t: 1, l: '3×' }],
    onInput: v => { setProp(node, 'ozone', v); paintAll(); },
  });
  hb.append(mieT, turbT, rayT, ozT);
  host.appendChild(hc);

  function paintPhase() {
    const w = phaseWrap.clientWidth || 280, h = 62;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    if (phaseCv.width !== w * dpr || phaseCv.height !== h * dpr) { phaseCv.width = w * dpr; phaseCv.height = h * dpr; }
    phaseCv.style.height = h + 'px';
    const g = phaseCv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const pad = 8, span = w - pad * 2, T = 6, B = 13;
    const gg = Math.min(0.95, MIEG());
    const px = th => pad + th / 180 * span;
    const top = Math.log10(hg(1, gg) + 1) * 1.1;
    const py = v => T + (1 - Math.log10(v + 1) / top) * (h - T - B);

    g.font = '8px ui-sans-serif, system-ui';
    g.strokeStyle = 'rgba(255,255,255,.07)';
    [45, 90, 135].forEach(th => { g.beginPath(); g.moveTo(px(th), T); g.lineTo(px(th), py(0)); g.stroke(); });
    g.strokeStyle = 'rgba(255,255,255,.10)';
    g.beginPath(); g.moveTo(pad, py(0) + .5); g.lineTo(pad + span, py(0) + .5); g.stroke();

    g.beginPath();
    g.moveTo(px(0), py(0));
    for (let th = 0; th <= 180; th += 2) g.lineTo(px(th), py(hg(Math.cos(th * D2R), gg)));
    g.lineTo(px(180), py(0));
    g.closePath();
    const fill = g.createLinearGradient(pad, 0, pad + span, 0);
    fill.addColorStop(0, 'rgba(255,244,214,.35)');
    fill.addColorStop(1, 'rgba(160,190,230,.10)');
    g.fillStyle = fill;
    g.fill();
    g.beginPath();
    for (let th = 0; th <= 180; th += 2) {
      const y = py(hg(Math.cos(th * D2R), gg));
      th === 0 ? g.moveTo(px(th), y) : g.lineTo(px(th), y);
    }
    g.strokeStyle = 'rgba(255,255,255,.85)';
    g.lineWidth = 1.4;
    g.stroke();
    g.lineWidth = 1;

    g.fillStyle = 'rgba(255,255,255,.30)';
    [[0, 'FORWARD'], [90, '90°'], [180, 'BACK']].forEach(([th, l], i) => {
      g.textAlign = i === 0 ? 'left' : i === 2 ? 'right' : 'center';
      g.fillText(l, px(th), h - 2);
    });
  }

  /* ── colour ────────────────────────────────────────────────────────────────────────────── */
  const cc = el('div', 'pcard mp-light sk-colour');
  cc.innerHTML = `
    <div class="mp-chead">
      <div class="l"><span class="t">Colour</span><span class="s">Zenith · horizon · bounce</span></div>
    </div>`;
  const cb = el('div', 'pbody');
  cc.appendChild(cb);
  cc.querySelector('.mp-chead .l').onclick = () => cc.classList.toggle('shut');

  const gradWrap = el('div', 'mp-meter sk-grad');
  gradWrap.innerHTML = '<div class="hd"><span class="k">horizon to zenith</span></div>';
  const gradCv = el('canvas');
  gradWrap.appendChild(gradCv);
  cb.appendChild(gradWrap);

  const zHead = el('div', 'mp-subhead', '<span class="k">zenith</span>');
  const zChip = colorChip(P.zenith || '#2f6dd0', v => { setProp(node, 'zenith', v); paintAll(); });
  zHead.appendChild(zChip);
  const hHead = el('div', 'mp-subhead', '<span class="k">horizon</span>');
  const hChip = colorChip(P.horizon || '#9fc4e8', v => { setProp(node, 'horizon', v); paintAll(); });
  hHead.appendChild(hChip);
  const gHead = el('div', 'mp-subhead', '<span class="k">ground bounce</span>');
  const gChip = colorChip(P.ground || '#14181d', v => { setProp(node, 'ground', v); paintAll(); });
  gHead.appendChild(gChip);
  cb.append(zHead, hHead, gHead);

  const skyT = tape({
    label: 'Sky light', min: 0, max: 4, value: P.intensity ?? 1, dec: 2, unit: '×', step: 0.05,
    marks: [{ t: 0, l: 'DARK' }, { t: 0.25, l: 'REAL 1×' }, { t: 1, l: '4×' }],
    onInput: v => { setProp(node, 'intensity', v); paintAll(); },
  });
  cb.appendChild(skyT);
  host.appendChild(cc);

  function paintGrad() {
    const w = gradWrap.clientWidth || 280, h = 46;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    if (gradCv.width !== w * dpr || gradCv.height !== h * dpr) { gradCv.width = w * dpr; gradCv.height = h * dpr; }
    gradCv.style.height = h + 'px';
    const g = gradCv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const pad = 8, span = w - pad * 2, y = 6, bh = 20;
    for (let x = 0; x < span; x++) {
      g.fillStyle = css(sample(x / span * 90, 60));
      g.fillRect(pad + x, y, 1.02, bh);
    }
    g.strokeStyle = 'rgba(0,0,0,.35)';
    g.strokeRect(pad + .5, y + .5, span - 1, bh - 1);
    g.font = '8px ui-sans-serif, system-ui';
    [[0, '0° HORIZON'], [30, '30'], [60, '60'], [90, '90° ZENITH']].forEach(([e, l], i) => {
      const x = pad + e / 90 * span;
      g.strokeStyle = 'rgba(255,255,255,.18)';
      g.beginPath(); g.moveTo(x, y + bh + 1); g.lineTo(x, y + bh + 5); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.30)';
      g.textAlign = i === 0 ? 'left' : i === 3 ? 'right' : 'center';
      g.fillText(l, x, h - 3);
    });
  }

  /* ── rendering ─────────────────────────────────────────────────────────────────────────── */
  const rc = el('div', 'pcard mp-light sk-render');
  rc.innerHTML = `
    <div class="mp-chead">
      <div class="l"><span class="t">Rendering</span><span class="s">What the sky does to the scene</span></div>
    </div>`;
  const rb = el('div', 'pbody');
  rc.appendChild(rb);
  rc.querySelector('.mp-chead .l').onclick = () => rc.classList.toggle('shut');
  const rTags = el('div', 'mp-tags');
  const aerial = pillToggle('AERIAL PERSPECTIVE', P.aerial !== false, v => { setProp(node, 'aerial', v); paintAll(); });
  const lightsScene = pillToggle('SKY LIGHTS SCENE', P.lightsScene !== false, v => { setProp(node, 'lightsScene', v); paintAll(); });
  rTags.append(aerial, lightsScene);
  rb.appendChild(rTags);
  const rNote = el('div', 'mp-note', '');
  rb.appendChild(rNote);
  host.appendChild(rc);

  /* ── keeping every surface honest ──────────────────────────────────────────────────────── */
  function paintAll() {
    paintHero(); paintCap(); paintSpectrum(); paintPhase(); paintGrad();
    const vis = visibilityKm(TURB(), MIE());
    const beta = extinction(TURB(), MIE());

    pRay.innerHTML = `${RAY().toFixed(2)}`;
    pTurb.innerHTML = `${TURB().toFixed(1)}`;
    pMie.innerHTML = `${MIE().toFixed(3)}`;
    pOz.innerHTML = `${OZ().toFixed(2)}`;

    sVis.classList.toggle('down', vis < 5);
    sVis.querySelector('.i').innerHTML = vis < 5 ? ic('alert', { size: 12 }) : ic('eye', { size: 12 });
    sVis.querySelector('.n').innerHTML = `${vis.toFixed(vis < 10 ? 1 : 0)}<em>km</em>`;
    sLight.querySelector('.n').innerHTML = `${(P.intensity ?? 1).toFixed(2)}<em>×</em>`;

    numI.textContent = Math.floor(vis);
    numD.textContent = `.${Math.round(vis * 10) % 10}`;
    visV.textContent = `${airName().toLowerCase()} · β ${beta.toFixed(3)} per km`;

    specs.innerHTML = [
      ['rayleigh at 550', `${rayAt(550).toFixed(3)}`],
      ['mie, flat', `${mieAt().toFixed(3)}`],
      ['blue vs red', `${(rayAt(450) / rayAt(650)).toFixed(1)}×`],
      ['forward g', `${MIEG().toFixed(2)}`],
    ].map(([k, v]) => `<div><span class="k">${k}</span><b>${v}</b></div>`).join('');

    rNote.textContent = `${P.aerial === false ? 'Distance is not tinted by the air.' : 'Distant geometry picks up the colour of the air between you and it.'} ${P.lightsScene === false ? 'The sky is a backdrop only.' : 'The sky itself lights the scene from every direction.'}`;

    mieT._set(MIE());
    turbT._set(TURB());
    rayT._set(RAY());
    ozT._set(OZ());
    skyT._set(P.intensity ?? 1);
    gStep._set(MIEG());
    aerial._set(P.aerial !== false);
    lightsScene._set(P.lightsScene !== false);
    zChip._set && zChip._set(P.zenith || '#2f6dd0');
    hChip._set && hChip._set(P.horizon || '#9fc4e8');
    gChip._set && gChip._set(P.ground || '#14181d');
  }

  syncers.push(paintAll);
  register && register(() => syncers.forEach(f => f()));

  const ro = new ResizeObserver(() => {
    paintHero(); paintSpectrum(); paintPhase(); paintGrad();
    [mieT, turbT, rayT, ozT, skyT].forEach(t => t._paint && t._paint());
  });
  ro.observe(host);
  host._dispose = () => ro.disconnect();

  requestAnimationFrame(paintAll);
  paintAll();
  return host;
}

return { skyPanel };
})();

/* ============================================================ STATE ============================================================ */
const S={}; const D2R=Math.PI/180;
const TRK=(k,l,min,max,step,d,unit,x={})=>({k,l,t:'trk',min,max,step,d,unit,...x});
const DIAL=(k,l,min,max,step,d,unit,x={})=>({k,l,t:'dial',min,max,step,d,unit,...x});
const STEP=(k,l,min,max,d)=>({k,l,t:'step',min,max,step:1,d});
const TOG=(k,l,d,hint)=>({k,l,t:'toggle',d,hint});
// graphical controls — each is a live, draggable chart/instrument bound to one or two keys
const ORB=(kAz,kEl,l,x={})=>({k:kAz,k2:kEl,l,t:'orb',...x});                       // 3D orbit widget over the plane + compass (azimuth + elevation)
const GLOBE=(k,l,d,x={})=>({k,l,t:'globe',min:-90,max:90,step:0.5,d,unit:'°',...x}); // latitude globe
const CURVE=(k,l,min,max,step,d,unit,fn,x={})=>({k,l,t:'curve',min,max,step,d,unit,fn,...x}); // response curve, value picked on x axis
const GAUGE=(k,l,min,max,step,d,unit,x={})=>({k,l,t:'gauge',min,max,step,d,unit,...x});   // arc gauge (semi-circle)
const KELVIN=(k,l,d)=>({k,l,t:'kelvin',min:2000,max:12000,step:50,d,unit:'K'});          // spectrum bar with swatch
const PAD=(kx,ky,l,x={})=>({k:kx,k2:ky,l,t:'pad',...x});                                  // 2D XY pad
const ORBIT2=(kSpin,kTilt,l)=>({k:kSpin,k2:kTilt,l,t:'orbit2'});
const SKYMAP=(kAz,kEl,l,x={})=>({k:kAz,k2:kEl,l,t:'skymap',...x});               // polar all-sky chart
const LUM=(kB,kG,l,x={})=>({k:kB,k2:kG,l,t:'lum',...x});                          // brightness + glow luminance strip
const PLANET=(kR,kH,l)=>({k:kR,k2:kH,l,t:'planet',hint:'Drag the limb to resize the planet · drag the shell for atmosphere top'});                           // spin/tilt sphere widget
const PHASE=(k,l,d)=>({k,l,t:'phase',min:0,max:1,step:0.005,d,unit:''});                  // phase ring
const HIST=(k,l,min,max,step,d,unit)=>({k,l,t:'hist',min,max,step,d,unit});               // exposure histogram scrub
const COL=(k,l,d)=>({k,l,t:'color',d}); const SEG=(k,l,opts,d)=>({k,l,t:'seg',opts,d});

];
function applyPreset(m,p){ m.preset=p.id; m.tex=p.tex; m.tint=p.tint; m.haze=p.haze; m.size=p.size; m.gamma=p.gamma; m.tilt=p.tilt; }
function makeMoon(preset,i){ const p=MOON_ATLAS.find(m=>m.id===preset); const m={preset,visible:true,name:p.name+(i?` ${i+1}`:'')};

function sunDirAt(t){ const lat=S.sun_lat*D2R, HA=(t-12)/24*Math.PI*2; const sinE=Math.cos(lat)*Math.cos(HA); const el=Math.asin(Math.max(-1,Math.min(1,sinE)));
  const az=Math.atan2(Math.sin(HA),Math.cos(HA)*Math.sin(lat))+Math.PI+S.sun_az*D2R; return {el,az,v:[Math.sin(az)*Math.cos(el),Math.sin(el),-Math.cos(az)*Math.cos(el)]}; }
const sunDir=()=>sunDirAt(S.sun_time);
const dirFrom=(e,a)=>{ e*=D2R;a*=D2R; return [Math.sin(a)*Math.cos(e),Math.sin(e),-Math.cos(a)*Math.cos(e)]; };
const moonDir=m=>m.link?sunDir().v.map(x=>-x):dirFrom(m.elev,m.az);
const sunElevDeg=()=>sunDir().el/D2R;
function airMass(){ const z=90-sunElevDeg(); if(z>=96) return 40; return Math.min(40,1/(Math.cos(z*D2R)+0.50572*Math.pow(96.07995-z,-1.6364))); }
function zenithLum(){ const e=Math.max(0,Math.sin(sunDir().el)); return (0.02+8*Math.pow(e,0.8))*S.sky_bright*S.atm_rayleigh*S.sun_intensity/22; }
const illum=ph=>(1+Math.cos(ph*Math.PI*2))/2;
function kelvinRGB(k){ k/=100; let r=k<=66?255:329.7*Math.pow(k-60,-0.133), g=k<=66?99.47*Math.log(k)-161.1:288.1*Math.pow(k-60,-0.0755), b=k>=66?255:(k<=19?0:138.5*Math.log(k-10)-305); return [r,g,b].map(v=>Math.max(0,Math.min(255,v))/255); }
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
const phaseName=e=>e>6?['Day','#ffd166']:e>0?['Golden hour','#ffb454']:e>-6?['Civil twilight','#ff8a65']:e>-12?['Nautical twilight','#7c8cff']:e>-18?['Astronomical','#5b5fd6']:['Night','#8aa4ff'];
function skyColorsAt(e){ // rough analytic sky for timelines
  const k=(a,b,x)=>Math.max(0,Math.min(1,(x-a)/(b-a))); const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
  const day=k(-6,14,e), gold=Math.exp(-Math.pow(e/6,2)), tw=k(-18,-4,e);
  let top=mix([3,4,10],[52,110,210],day); let hz=mix(mix([4,5,14],[40,42,90],tw),[170,200,235],day); hz=mix(hz,[255,150,80],gold*.85);
  return {top:top.map(Math.round),hz:hz.map(Math.round)}; }

  document.getElementById('inspTitle').innerHTML=`<span style="color:${e.color}">${I(e.icon,18)}</span>${e.name}`; document.getElementById('inspKind').textContent=e.kind; insp.style.setProperty('--acc',e.color);
  const previewHTML={sunpath:`<div class="preview stats" id="pvSunStats"></div>`,
    stars:`<div class="preview"><span class="cap">Visibility vs. sky brightness</span><span class="cap r" id="pvStarCap"></span><svg id="pvStars" viewBox="0 0 340 120"></svg></div>`,
    moon:`<div class="preview" style="display:flex;gap:14px;align-items:center;padding:14px"><canvas id="pvMoon" width="192" height="192" style="width:128px;height:128px;border-radius:50%;flex-shrink:0"></canvas><div style="flex:1;font-size:12px;color:var(--t2);line-height:1.7"><div>Phase <b id="pvPhaseName" style="color:var(--text);font-weight:400"></b></div><div>Apparent size <b id="pvSize" style="color:var(--text);font-weight:400"></b></div><div>Preset <b id="pvPreset" style="color:var(--text);font-weight:400"></b></div><div id="pvUp"></div></div></div><div class="preview" style="margin-top:8px;height:64px;background-size:100% 100%;background-repeat:repeat-x" id="pvTexStrip"><span class="cap">Equirectangular map · 2048×1024</span></div>`,
    sky:`<div class="preview"><span class="cap">Live zenith → horizon</span><canvas id="pvSkyLive" class="prev" width="340" height="44" style="height:44px"></canvas></div><div class="preview" style="margin-top:8px"><span class="cap">24 h sky</span><canvas id="pvSkyDay" class="prev" width="340" height="60" style="height:60px"></canvas></div>`,
    atmo:`<div class="preview"><span class="cap">Scattering vs wavelength</span><span class="cap r">380 → 780 nm</span><svg id="pvAtmo" viewBox="0 0 340 120"></svg></div>`,
    camera:``,
    post:`<div class="preview"><span class="cap">Tonemap curve</span><svg id="pvTone" viewBox="0 0 340 110"></svg></div><div class="preview" style="margin-top:8px"><span class="cap">Flare</span><canvas id="pvFlare" class="prev" width="680" height="160" style="height:80px"></canvas></div>`,
    plane:`<div class="preview"><span class="cap">Material · top-down</span><canvas id="pvPlane" class="prev" width="340" height="120" style="height:120px"></canvas></div>`,
    atlas:`<div class="preview" style="padding:10px 12px 6px;font-size:12px;color:var(--t2)">Pick a body from the atlas to place it in orbit. Up to four moons render simultaneously; each has its own inspector.</div>`}[e.preview]||'';
  const atlasHTML=e.preview==='atlas'?`<div class="sec"><div class="sec-head"><span class="sico">${I('moon',16)}</span><span class="t">Atlas</span><span class="badge">${MOON_ATLAS.length} bodies</span></div><div class="sec-body"><div class="atlas">${MOON_ATLAS.map(m=>`<div class="card" data-add="${m.id}"><span class="plus">${I('plus',11)}</span><canvas data-atlas="${m.id}" width="112" height="112"></canvas><span>${m.name}</span><small>${m.sub}</small></div>`).join('')}</div>
    ${S.moons.length?`<div class="hint" style="grid-column:span 2">In orbit: ${S.moons.map((m,i)=>`<b style="color:${m.tint};font-weight:400;cursor:pointer" data-goto="moon#${i}">${m.name}</b>`).join(' · ')}</div>`:''}</div></div>`:'';
  const moonExtra=e.preview==='moon'?(()=>{ const m=S.moons[e.moonIndex]; return `<div class="sec"><div class="sec-head"><span class="sico">${I('grid',16)}</span><span class="t">Preset<span>atlas</span></span><span class="badge">${m.preset}</span></div><div class="sec-body"><div class="atlas" style="grid-template-columns:repeat(6,1fr)">${MOON_ATLAS.map(a=>`<div class="card ${a.id===m.preset?'on':''}" data-preset="${a.id}" style="padding:8px 4px"><canvas data-atlas="${a.id}" width="72" height="72" style="width:36px;height:36px"></canvas><small>${a.name}</small></div>`).join('')}</div>
    </div></div>`; })():'';
  if(e.external&&selected==='sky'){ insp.innerHTML=`<div class="ent-enter">${presenceHTML('sky')}<div id="skyHost"></div></div>`; mountSkyPanel(document.getElementById('skyHost')); return; }
  insp.innerHTML=`<div class="ent-enter">
    ${e.hero.kind?`<div class="hero state" style="--acc:${e.color}" id="heroState">${stateHero(e.hero.kind)}${previewHTML}</div>`:`<div class="hero" style="--acc:${e.color}"><div class="label-bar">${e.hero.label}<em>live</em></div>
      <div class="big"><span class="v" id="heroV">${bigHTML(e.hero.fn(),e.hero.dec,e.hero.signed)}</span><span class="u">${e.hero.unit}</span><span class="trend" id="heroTrend">${I('flat',18)}</span></div>
      <span class="delta" id="heroDelta">± 0 ${e.hero.unit}</span>${previewHTML}</div>`}
    ${presenceHTML(selected)}${atlasHTML}${moonExtra}
    ${e.sections.map((sec,i)=>`<div class="sec ${sec.warm||e.warm?'warm':''}" data-sec="${i}"><div class="sec-head"><span class="sico">${I(sec.icon,16)}</span><span class="t">${sec.title}${sec.sub?`<span>(${sec.sub})</span>`:''}</span><span class="badge">${sec.props.length} props</span><span class="chev">${I('chevu',14)}</span></div><div class="sec-body">${sec.props.map(ctlHTML).join('')}</div></div>`).join('')}
    ${selected==='camera'?`<div class="sec warm"><div class="sec-head" data-goto="post"><span class="sico" style="color:${ENTITIES.post.color}">${I('fx',16)}</span><span class="t">Post Process<span>component</span></span><span class="badge">attached</span><span class="chev" style="transform:rotate(90deg)">${I('chev',14)}</span></div></div>`:''}
    ${selected==='post'?`<button class="action ghost" data-goto="camera" style="width:100%">← Back to Camera</button>`:''}
    ${e.preview==='moon'?`<button class="action danger" data-remove="${e.moonIndex}" style="width:100%">Remove ${e.name}</button>`:''}
    <div class="hint">${e.kind} · every change is applied to the viewport immediately · Shift-drag for fine control · scroll over a control to nudge</div></div>`;
  insp.querySelectorAll('canvas[data-atlas]').forEach(c=>{ const a=MOON_ATLAS.find(m=>m.id===c.dataset.atlas); drawMoon2D(c,{tex:a.tex,tint:a.tint,haze:a.haze,gamma:a.gamma,tilt:a.tilt,spin:0,phase:.1},true); });
  updatePreview(); }

/* ---------- previews ---------- */
const texImgs={}; function texImg(name,cb){ if(texImgs[name]){ if(texImgs[name].complete) cb&&cb(texImgs[name]); else texImgs[name].addEventListener('load',()=>cb&&cb(texImgs[name]),{once:true}); return texImgs[name]; } const im=new Image(); im.src=TEXDIR+name; texImgs[name]=im; im.addEventListener('load',()=>cb&&cb(im),{once:true}); return im; }
const texData={}; function texPixels(name,cb){ if(texData[name]) return cb(texData[name]); texImg(name,im=>{ if(texData[name]) return cb(texData[name]); const c=document.createElement('canvas'); c.width=512; c.height=256; const x=c.getContext('2d'); x.drawImage(im,0,0,512,256); texData[name]=x.getImageData(0,0,512,256); cb(texData[name]); }); }
function drawMoon2D(cv,m,flat=false){ texPixels(m.tex,td=>{ const ctx=cv.getContext('2d'); const W=cv.width; const img=ctx.createImageData(W,W); const d=img.data; const tint=hex2rgb(m.tint); const tp=td.data;
  const ph=m.phase*Math.PI*2; const lx=Math.sin(ph), lz=Math.cos(ph); const R=W/2-2; const spin=(m.spin||0)*D2R, tilt=(m.tilt||0)*D2R; const ct=Math.cos(tilt),st=Math.sin(tilt); const gam=m.gamma||1, haze=m.haze||0;
  for(let y=0;y<W;y++) for(let x=0;x<W;x++){ const nx=(x-W/2)/R, ny=-(y-W/2)/R; const r2=nx*nx+ny*ny; const i=(y*W+x)*4; if(r2>1){ d[i+3]=0; continue; }
    const nz=Math.sqrt(1-r2); const ty=ny*ct-nz*st, tz=ny*st+nz*ct; const lon=Math.atan2(nx,tz)+spin, lat=Math.asin(Math.max(-1,Math.min(1,ty)));
    let u=((lon/(2*Math.PI)+.5)%1+1)%1, v=.5-lat/Math.PI; const px=(Math.floor(v*255)*512+Math.floor(u*511))*4;
    let ndl=nz*lz+nx*lx; const wrap=haze*.3; ndl=Math.max((ndl+wrap)/(1+wrap),0); const limb=1-Math.pow(1-nz,2)*Math.max(haze,.35)*.5; const L=Math.pow(ndl,.8)*limb+.05; const edge=Math.min(1,(1-Math.sqrt(r2))*(haze?6:30));
    for(let c=0;c<3;c++){ let a=Math.pow(tp[px+c]/255,gam)*tint[c]; d[i+c]=Math.min(255,a*L*255); } d[i+3]=255*edge; }
  ctx.putImageData(img,0,0); if(!flat&&m.glow){ ctx.globalCompositeOperation='destination-over'; const g=ctx.createRadialGradient(W/2,W/2,R*.9,W/2,W/2,W/2); g.addColorStop(0,'rgba(220,228,245,.4)'); g.addColorStop(1,'rgba(220,228,245,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,W); ctx.globalCompositeOperation='source-over'; } }); }
function drawSunPath(){ const box=document.getElementById('pvSunStats'); if(box){ let rise=null,set=null,prev=sunDirAt(0).el; for(let t=.05;t<=24;t+=.05){ const el=sunDirAt(t).el; if(prev<=0&&el>0) rise=t; if(prev>0&&el<=0) set=t; prev=el; } const hh=t=>t==null?'—':`${String(Math.floor(t)).padStart(2,'0')}:${String(Math.round((t%1)*60)).padStart(2,'0')}`; const noon=sunDirAt(12).el/D2R; const day=rise!=null&&set!=null?(set-rise+24)%24:(noon>0?24:0);
    const [n,c]=phaseName(sunElevDeg()); box.innerHTML=`<div class="st"><span>Sunrise</span><b>${hh(rise)}</b></div><div class="st"><span>Sunset</span><b>${hh(set)}</b></div><div class="st"><span>Daylight</span><b>${day.toFixed(1)} h</b></div><div class="st"><span>Noon alt.</span><b>${noon.toFixed(1)}°</b></div><div class="st"><span>Phase</span><b style="color:${c}">${n}</b></div><div class="st"><span>Air mass</span><b>${airMass().toFixed(2)}</b></div>`; }
  const svg=document.getElementById('pvSun'); if(!svg) return; const W=340,H=130,hy=88; const pts=[]; for(let t=0;t<=24;t+=.25){ const e=sunDirAt(t).el/D2R; pts.push([t/24*W,hy-e/90*72]); }
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(''); const cur=sunDirAt(S.sun_time); const cx=S.sun_time/24*W, cy=hy-cur.el/D2R/90*72;
  let rise=null,set=null; for(let i=1;i<pts.length;i++){ if(pts[i-1][1]>hy&&pts[i][1]<=hy) rise=i*.25; if(pts[i-1][1]<=hy&&pts[i][1]>hy) set=i*.25; } const hh=t=>t==null?'—':`${String(Math.floor(t)).padStart(2,'0')}:${String(Math.round((t%1)*60)).padStart(2,'0')}`;
  svg.innerHTML=`<defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffb454" stop-opacity=".35"/><stop offset="1" stop-color="#ffb454" stop-opacity="0"/></linearGradient><clipPath id="above"><rect x="0" y="0" width="${W}" height="${hy}"/></clipPath></defs>
    <rect x="0" y="${hy}" width="${W}" height="${H-hy}" fill="rgba(255,255,255,.03)"/><path d="${path}L${W},${H}L0,${H}Z" fill="url(#sg)" clip-path="url(#above)"/>
    <line x1="0" y1="${hy}" x2="${W}" y2="${hy}" stroke="rgba(255,255,255,.35)" stroke-width="1"/><path d="${path}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.4"/>
    ${[6,12,18].map(t=>`<line x1="${t/24*W}" y1="${hy}" x2="${t/24*W}" y2="${hy+6}" stroke="rgba(255,255,255,.3)"/><text x="${t/24*W}" y="${H-6}" fill="rgba(255,255,255,.35)" font-size="9" text-anchor="middle" font-family="Outfit">${t}:00</text>`).join('')}
    <text x="6" y="${H-6}" fill="rgba(255,255,255,.5)" font-size="9" font-family="Outfit">↑ ${hh(rise)}</text><text x="${W-6}" y="${H-6}" fill="rgba(255,255,255,.5)" font-size="9" text-anchor="end" font-family="Outfit">↓ ${hh(set)}</text>
    <line x1="${cx}" y1="18" x2="${cx}" y2="${H-16}" stroke="rgba(255,255,255,.18)" stroke-dasharray="2 3"/><circle cx="${cx}" cy="${cy}" r="9" fill="#ffb454" opacity=".25"/><circle cx="${cx}" cy="${cy}" r="4.5" fill="${cur.el>0?'#ffd166':'#7c8cff'}"/>`; }
function drawStars(){ const svg=document.getElementById('pvStars'); if(!svg) return; const W=340,H=120; const lm=limitMag();
  // magnitude ladder: -1 (Sirius) .. 6.5; column per magnitude, dot size by brightness; lit if under current limit; background sweeps day→night with current time marker
  const mags=[-1,0,1,2,3,4,5,6]; const names=['Sirius','Vega','Spica','Polaris','','','','']; const x0=30,x1=W-14;
  const grad=[...Array(25)].map((_,i)=>{ const t=i; const c=skyColorsAt(sunDirAt(t).el/D2R); return `<stop offset="${(i/24*100).toFixed(1)}%" stop-color="rgb(${c.top})"/>`; }).join('');
  const cols=mags.map((m,i)=>{ const x=x0+(x1-x0)*i/(mags.length-1); const on=m<lm; const r=Math.max(1.2,6-m*.75); const glow=on&&S.st_glow>0?`<circle cx="${x}" cy="46" r="${r*2.4*Math.min(1,S.st_glow)}" fill="url(#sg)"/>`:''; 
    return `${glow}<circle cx="${x}" cy="46" r="${r.toFixed(1)}" fill="${on?'#fff':'rgba(255,255,255,.12)'}"/><text x="${x}" y="78" class="lab c">${m>0?'+':''}${m}</text>${names[i]?`<text x="${x}" y="90" class="lab c dim">${names[i]}</text>`:''}`; }).join('');
  const lx=x0+(x1-x0)*Math.max(0,Math.min(1,(lm+1)/7)); const tx=x0+(x1-x0)*S.sun_time/24;
  svg.innerHTML=`<defs><linearGradient id="sd" x1="0" x2="1">${grad}</linearGradient><radialGradient id="sg"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
    <rect x="${x0-14}" y="100" width="${x1-x0+28}" height="12" rx="6" fill="url(#sd)" opacity=".9"/><line x1="${tx}" y1="97" x2="${tx}" y2="115" stroke="#fff" stroke-width="1.5"/><text x="${tx}" y="94" class="lab c">${fmtT(S.sun_time)}</text>
    <line x1="${lx.toFixed(1)}" y1="20" x2="${lx.toFixed(1)}" y2="70" stroke="#c4b5fd" stroke-dasharray="3 3"/><text x="${lx.toFixed(1)}" y="14" class="lab c" fill="#c4b5fd">limit ${lm.toFixed(1)}</text>${cols}
    <text x="${x0-14}" y="78" class="lab">mag</text>`;
  const cap=document.getElementById('pvStarCap'); if(cap) cap.textContent=`${Math.round(Math.max(0,Math.min(1,(lm+1)/7.5))*100)}% of field visible`; }
function drawSkyDay(){ const cv=document.getElementById('pvSkyDay'); if(!cv) return; const ctx=cv.getContext('2d'); const W=cv.width,H=cv.height; const tint=hex2rgb(S.sky_tint);
  for(let x=0;x<W;x++){ const t=x/W*24; const e=sunDirAt(t).el/D2R; const c=skyColorsAt(e); const g=ctx.createLinearGradient(0,0,0,H); const m=(a)=>a.map((v,i)=>Math.round(Math.min(255,v*tint[i]*S.sky_bright))); g.addColorStop(0,`rgb(${m(c.top)})`); g.addColorStop(1,`rgb(${m(c.hz)})`); ctx.fillStyle=g; ctx.fillRect(x,0,1.5,H); }
  const cx=S.sun_time/24*W; ctx.fillStyle='#fff'; ctx.fillRect(cx-1,0,2,H); }
function drawPlane(){ const cv=document.getElementById('pvPlane'); if(!cv) return; const ctx=cv.getContext('2d'); const W=cv.width,H=cv.height; const n=Math.max(4,Math.min(40,Math.round(20/Math.sqrt(S.pl_cell)))); const s=W/n;
  for(let y=0;y<Math.ceil(H/s);y++) for(let x=0;x<n;x++){ ctx.fillStyle=(x+y)%2?S.pl_b:S.pl_a; ctx.fillRect(x*s,y*s,s+.5,s+.5); }
  if(S.pl_grid){ ctx.strokeStyle='rgba(0,0,0,.12)'; ctx.lineWidth=1; for(let x=0;x<=n;x++){ ctx.beginPath(); ctx.moveTo(x*s+.5,0); ctx.lineTo(x*s+.5,H); ctx.stroke(); } for(let y=0;y<=H/s;y++){ ctx.beginPath(); ctx.moveTo(0,y*s+.5); ctx.lineTo(W,y*s+.5); ctx.stroke(); }
    ctx.strokeStyle='#e0404c'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke(); ctx.strokeStyle='#3f8cf2'; ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); }
  const cx=W/2+S.cam_x/S.pl_size*W/2, cy=H/2+S.cam_z/S.pl_size*H/2; ctx.fillStyle='#34c759'; ctx.beginPath(); ctx.arc(cx,cy,4,0,7); ctx.fill(); const a=S.cam_yaw*D2R; ctx.strokeStyle='#34c759'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.sin(a)*16,cy-Math.cos(a)*16); ctx.stroke(); }
function drawAtmo(){ const svg=document.getElementById('pvAtmo'); if(!svg) return; const W=340,H=120; const lam=i=>380+i/W*400; const ray=l=>Math.pow(550/l,4)*S.atm_rayleigh; const mie=l=>Math.pow(550/l,.6)*S.atm_mie*.9; const oz=l=>Math.exp(-Math.pow((l-600)/70,2))*S.atm_ozone*.5;
  const mx=Math.max(4,ray(400),mie(400)*1.2); const P=f=>[...Array(W+1)].map((_,i)=>`${i},${(H-14-Math.min(1,f(lam(i))/mx)*(H-30)).toFixed(1)}`).join(' ');
  svg.innerHTML=`<defs><linearGradient id="spec" x1="0" x2="1"><stop offset="0" stop-color="#7a3bff"/><stop offset=".22" stop-color="#3b6dff"/><stop offset=".42" stop-color="#2ee06e"/><stop offset=".6" stop-color="#ffe23b"/><stop offset=".78" stop-color="#ff7a2a"/><stop offset="1" stop-color="#c0142a"/></linearGradient></defs>
    <rect x="0" y="${H-10}" width="${W}" height="4" rx="2" fill="url(#spec)" opacity=".8"/>${[0,.25,.5,.75].map(f=>`<line x1="0" y1="${16+f*(H-30)}" x2="${W}" y2="${16+f*(H-30)}" stroke="rgba(255,255,255,.06)" stroke-dasharray="3 4"/>`).join('')}
    <polyline points="${P(ray)}" fill="none" stroke="#5aa9ff" stroke-width="1.6"/><polyline points="${P(mie)}" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.4" stroke-dasharray="4 3"/><polyline points="${P(oz)}" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
    <g font-family="Outfit" font-size="9"><text x="${W-6}" y="26" text-anchor="end" fill="#5aa9ff">Rayleigh λ⁻⁴</text><text x="${W-6}" y="38" text-anchor="end" fill="rgba(255,255,255,.6)">Mie</text><text x="${W-6}" y="50" text-anchor="end" fill="#a78bfa">Ozone</text></g>`; }
function drawCam(){ const svg=document.getElementById('pvCam'); if(!svg) return; const W=340,H=130; const cx=W/2,cy=H-18; const half=S.cam_fov/2*D2R; const L=105; const yaw=S.cam_yaw*D2R;
  const p=(a,r)=>[cx+r*Math.sin(a),cy-r*Math.cos(a)]; const a1=yaw-half,a2=yaw+half; const [x1,y1]=p(a1,L),[x2,y2]=p(a2,L); const sun=sunDir().az; const [sx,sy]=p(sun,L-8);
  const ms=S.moons.map(m=>{ const a=Math.atan2(moonDir(m)[0],-moonDir(m)[2]); const [x,y]=p(a,L-8); return `<circle cx="${x}" cy="${y}" r="4" fill="${m.tint}"/>`; }).join('');
  svg.innerHTML=`<circle cx="${cx}" cy="${cy}" r="${L}" fill="none" stroke="rgba(255,255,255,.08)"/><circle cx="${cx}" cy="${cy}" r="${L*.5}" fill="none" stroke="rgba(255,255,255,.05)"/>
    ${['N','E','S','W'].map((n,i)=>{ const [x,y]=p(i*Math.PI/2,L+9); return `<text x="${x}" y="${y+3}" fill="rgba(255,255,255,.35)" font-size="9" text-anchor="middle" font-family="Outfit">${n}</text>`; }).join('')}
    <path d="M${cx},${cy}L${x1},${y1}A${L},${L},0,${S.cam_fov>180?1:0},1,${x2},${y2}Z" fill="rgba(52,199,89,.14)" stroke="#34c759" stroke-width="1.2"/>
    <circle cx="${sx}" cy="${sy}" r="5" fill="#ffb454"/>${ms}<circle cx="${cx}" cy="${cy}" r="4" fill="#fff"/>
    <text x="8" y="${H-8}" fill="rgba(255,255,255,.5)" font-size="10" font-family="Outfit">FOV ${S.cam_fov.toFixed(1)}° · yaw ${S.cam_yaw.toFixed(0)}° · pitch ${S.cam_pitch.toFixed(0)}°</text>`; }
function drawTone(){ const svg=document.getElementById('pvTone'); if(!svg) return; const W=340,H=110; const ev=Math.pow(2,S.pp_ev); const tm=S.pp_tonemap;
  const f=x=>{ x*=ev; let y; if(tm==='ACES') y=(x*(2.51*x+.03))/(x*(2.43*x+.59)+.14); else if(tm==='Reinhard') y=x/(1+x); else if(tm==='Filmic'){ const u=v=>((v*(.15*v+.05)+.004)/(v*(.15*v+.5)+.06))-.0667; y=u(x*2)/u(11.2); } else if(tm==='AgX'){ let l=Math.log2(x+1e-5); l=Math.max(0,Math.min(1,(l+12.47)/16.5)); y=l*l*(3-2*l); } else y=Math.min(1,x); return Math.max(0,Math.min(1,y)); };
  const pts=[...Array(W+1)].map((_,i)=>{ const x=Math.pow(i/W,2)*8; return `${i},${(H-14-Math.pow(f(x),1/2.2)*(H-26)).toFixed(1)}`; }).join(' ');
  svg.innerHTML=`${[.25,.5,.75].map(g=>`<line x1="0" y1="${H-14-g*(H-26)}" x2="${W}" y2="${H-14-g*(H-26)}" stroke="rgba(255,255,255,.06)" stroke-dasharray="3 4"/>`).join('')}<polyline points="${pts}" fill="none" stroke="#ff8a65" stroke-width="1.8"/>
    <text x="8" y="${H-3}" fill="rgba(255,255,255,.4)" font-size="9" font-family="Outfit">scene linear 0 → 8</text><text x="${W-8}" y="${H-3}" fill="rgba(255,255,255,.5)" font-size="9" text-anchor="end" font-family="Outfit">${tm} · ${S.pp_ev>=0?'+':''}${S.pp_ev.toFixed(2)} EV</text>`; }
