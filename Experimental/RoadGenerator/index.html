      uniform sampler2D uTex;

      out vec4 outColor;

      float hash2(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }

      void main() {
        vec3 N = normalize(vNormal);
        vec3 V = normalize(uEye - vWorldPos);
        vec3 L = normalize(uSunDir);
        vec3 H = normalize(V + L);

        vec3 base = uMatColor * vCol.rgb;
        if (uMatParams.w > 0.5) {
          vec3 texSample = texture(uTex, vUv).rgb;
          // Multiply-blend procedural canvas texture with physical material base color
          base = mix(base, texSample * uMatColor * 2.15 * vCol.rgb, 0.75);
        }

        float rough = uMatParams.x;
        float metal = uMatParams.y;
        float emissive = uMatParams.z;

        // Procedural Micro-Aggregate & Layer-Stack Detail on Asphalt (uMatKind == 1)
        if (uMatKind == 1) {
          float grain = (hash2(floor(vWorldPos.xz * 26.0)) - 0.5) * 0.045;
          base += vec3(grain);
          // Wheel track polish
          float wheelBand = exp(-pow((fract(vUv.x) - 0.3) / 0.14, 2.0)) + exp(-pow((fract(vUv.x) - 0.7) / 0.14, 2.0));
          rough = mix(rough, 0.48, clamp(wheelBand * uLayerParams.x * 0.65, 0.0, 0.65));
          base *= 1.0 - clamp(wheelBand * uLayerParams.x * 0.12, 0.0, 0.12);
          // Pothole interior / wet puddle reflection
          if (vCol.a < 0.25) {
            base = mix(vec3(0.32, 0.28, 0.23), base, vCol.a * 4.0);
            rough = mix(0.12, rough, vCol.a * 4.0);
          }
          // Subtle rain dampness film when Wetness layer is high
          if (uLayerParams.z > 0.45) {
            float puddleWave = sin(vWorldPos.x * 0.25 + cos(vWorldPos.z * 0.28) * 1.4) * cos(vWorldPos.z * 0.22);
            if (puddleWave > 1.0 - (uLayerParams.z - 0.35) * 0.85) {
              rough = 0.18;
              base *= 0.82;
            }
          }
        }

        // Display mode overrides for engineering inspection
        if (uDisplayMode == 2) {
          // Texture Layer Breakdown mode
          base = mix(base, vec3(fract(vUv.x), fract(vUv.y), 1.0 - rough), 0.35);
        } else if (uDisplayMode == 3) {
          // Clearance & Grade Audit mode (color-coded by elevation Y)
          float hNorm = clamp((vWorldPos.y + 6.0) / 14.0, 0.0, 1.0);
          vec3 elevColor = mix(vec3(0.25, 0.65, 0.95), vec3(0.95, 0.72, 0.22), hNorm);
          if (vWorldPos.y > 4.5) elevColor = vec3(0.38, 0.88, 0.66);
          base = mix(base, elevColor, 0.62);
        }

        float ndl = max(dot(N, L), 0.0);
        float ndv = max(dot(N, V), 0.001);
        float ndh = max(dot(N, H), 0.0);

        // Physically balanced Dielectric / Metallic Specular + Schlick Fresnel
        float f0 = mix(0.035, 0.82, metal);
        float fresnel = f0 + (1.0 - f0) * pow(1.0 - ndv, 5.0);
        float specExp = exp2(8.5 * (1.0 - clamp(rough, 0.06, 0.98)));
        float spec = pow(ndh, specExp) * (1.0 - rough * 0.85) * fresnel * 1.35;

        // Atmospheric Sky / Ground Hemisphere IBL
        vec3 skyAmb = vec3(0.32, 0.36, 0.43);
        vec3 gndAmb = vec3(0.12, 0.12, 0.13);
        vec3 ambient = mix(gndAmb, skyAmb, N.y * 0.5 + 0.5);

        vec3 sunColor = vec3(1.08, 1.01, 0.92);
        vec3 color = base * (ambient + ndl * sunColor * (1.0 - metal * 0.45)) + vec3(spec) * sunColor;
        color += uMatColor * emissive;

        // Distance aerial perspective / studio horizon fade
        float distCam = length(uEye - vWorldPos);
        float fogFactor = smoothstep(140.0, 340.0, distCam);
        color = mix(color, vec3(0.075, 0.078, 0.085), fogFactor);

        // ACES Filmic Tone Mapping
        vec3 x = max(vec3(0.0), color);
        vec3 mapped = (x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14);
        outColor = vec4(pow(clamp(mapped, 0.0, 1.0), vec3(1.0 / 2.2)), 1.0);
      }
    `;

    const lineVS = `#version 300 es
      precision highp float;
      layout(location = 0) in vec3 aPos;
      uniform mat4 uVP;
      void main() {
        gl_Position = uVP * vec4(aPos, 1.0);
      }
    `;

    const lineFS = `#version 300 es
      precision highp float;
      uniform vec4 uLineColor;
      out vec4 outColor;
      void main() {
        outColor = uLineColor;
      }
    `;

    const compile = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      return s;
    };
    const link = (vs, fs) => {
      const p = gl.createProgram();
      gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
      gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(p);
      return p;
    };

    this.meshProg = link(vsSource, fsSource);
    this.lineProg = link(lineVS, lineFS);
  }

  buildGroundGridBuffer() {
    const gl = this.gl;
    if (!gl) return;
    const lines = [];
    const extent = 160;
    const step = 10;
    for (let i = -extent; i <= extent; i += step) {
      lines.push(i, -0.04, -extent, i, -0.04, extent);
      lines.push(-extent, -0.04, i, extent, -0.04, i);
    }
    this.groundGridVao = gl.createVertexArray();
    gl.bindVertexArray(this.groundGridVao);
    const vb = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(lines), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    this.groundGridCount = lines.length / 3;
    gl.bindVertexArray(null);
  }

  rebuildTextures(layerStack) {
    this.layerParams = getEffectiveMaterialParams(layerStack);
    const gl = this.gl;
    if (!gl) return;

    for (const [matId, style] of Object.entries(MATERIAL_STYLE_TABLE)) {
      if (!style.tex) continue;
      const canvas = generateMaterialTextureCanvas(matId, layerStack);
      let tex = this.textures.get(matId);
      if (!tex) {
        tex = gl.createTexture();
        this.textures.set(matId, tex);
      }
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    }
  }

  uploadBuilderBatches(builder, targetArray) {
    const gl = this.gl;
    if (!gl) return;

    // Dispose old buffers
    for (const item of targetArray) {
      gl.deleteVertexArray(item.vao);
      gl.deleteBuffer(item.posBuf);
      gl.deleteBuffer(item.normBuf);
      gl.deleteBuffer(item.uvBuf);
      gl.deleteBuffer(item.colBuf);
      gl.deleteBuffer(item.idxBuf);
    }
    targetArray.length = 0;

    for (const batch of builder.batches.values()) {
      if (!batch.indices.length) continue;
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);

      const posBuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(batch.positions), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);

      const normBuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, normBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(batch.normals), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(1);
      gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);

      const uvBuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, uvBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(batch.uvs), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(2);
      gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 0, 0);

      const colBuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(batch.colors), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(3);
      gl.vertexAttribPointer(3, 4, gl.FLOAT, false, 0, 0);

      const idxBuf = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(batch.indices), gl.STATIC_DRAW);

      targetArray.push({
        vao,
        posBuf,
        normBuf,
        uvBuf,
        colBuf,
        idxBuf,
        count: batch.indices.length,
        materialId: batch.materialId,
        layerId: batch.layerId,
        ownerId: batch.ownerId,
      });
    }
    gl.bindVertexArray(null);
  }

  uploadStaticScene(compiledScene, layerStack) {
    this.pickables = compiledScene.builder.pickables || [];
    this.mergedIntersections = compiledScene.mergedIntersections || [];
    this.rebuildTextures(layerStack);
    this.uploadBuilderBatches(compiledScene.builder, this.staticGpuBatches);

    const gl = this.gl;
    if (!gl) return;
    if (this.quadWireVao) {
      gl.deleteVertexArray(this.quadWireVao);
      gl.deleteBuffer(this.quadWireBuf);
    }
    this.quadWireVao = gl.createVertexArray();
    gl.bindVertexArray(this.quadWireVao);
    this.quadWireBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.quadWireBuf);
    const wireData = new Float32Array(compiledScene.builder.quadWireSegments);
    gl.bufferData(gl.ARRAY_BUFFER, wireData, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    this.quadWireVertexCount = wireData.length / 3;
    gl.bindVertexArray(null);
  }

  uploadDynamicFleet(fleetBuilder) {
    this.uploadBuilderBatches(fleetBuilder, this.dynamicGpuBatches);
  }

  framePosition(pos, dist = 42) {
    this.target = [pos[0], pos[1], pos[2]];
    this.distance = clamp(dist, 12, 240);
  }

  render(project, selectedId) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, this.canvas.clientWidth);
    const h = Math.max(1, this.canvas.clientHeight);
    if (this.canvas.width !== Math.round(w * dpr) || this.canvas.height !== Math.round(h * dpr)) {
      this.canvas.width = Math.round(w * dpr);
      this.canvas.height = Math.round(h * dpr);
    }
    if (this.overlay.width !== Math.round(w * dpr) || this.overlay.height !== Math.round(h * dpr)) {
      this.overlay.width = Math.round(w * dpr);
      this.overlay.height = Math.round(h * dpr);
    }

    const eye = this.getEyePosition();
    const projMat = mat4Perspective(this.fov, w / h, 0.5, 800.0);
    const viewMat = mat4LookAt(eye, this.target, [0, 1, 0]);
    const vpMat = mat4Multiply(projMat, viewMat);
    this.lastVpMat = vpMat;
    this.lastWidth = w;
    this.lastHeight = h;

    const az = ((project.sunAzimuth ?? 142) * Math.PI) / 180;
    const el = ((project.sunElevation ?? 39) * Math.PI) / 180;
    const sunDir = [
      Math.cos(el) * Math.sin(az),
      Math.max(0.12, Math.sin(el)),
      Math.cos(el) * Math.cos(az),
    ];

    const gl = this.gl;
    if (gl) {
      gl.viewport(0, 0, this.canvas.width, this.canvas.height);
      gl.ClearColor ? gl.ClearColor(0.063, 0.065, 0.072, 1.0) : gl.clearColor(0.063, 0.065, 0.072, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LEQUAL);

      // 1. Draw Studio Ground Reference Grid
      gl.useProgram(this.lineProg);
      gl.uniformMatrix4fv(gl.getUniformLocation(this.lineProg, 'uVP'), false, vpMat);
      gl.uniform4f(gl.getUniformLocation(this.lineProg, 'uLineColor'), 0.17, 0.18, 0.20, 1.0);
      gl.bindVertexArray(this.groundGridVao);
      gl.drawArrays(gl.LINES, 0, this.groundGridCount);

      // 2. Draw Static & Dynamic PBR Batches filtered by active Layer Stack visibility
      gl.useProgram(this.meshProg);
      gl.uniformMatrix4fv(gl.getUniformLocation(this.meshProg, 'uVP'), false, vpMat);
      gl.uniform3fv(gl.getUniformLocation(this.meshProg, 'uEye'), eye);
      gl.uniform3fv(gl.getUniformLocation(this.meshProg, 'uSunDir'), sunDir);

      const modeInt =
        this.displayMode === 'quad-wire'
          ? 1
          : this.displayMode === 'layer-audit'
            ? 2
            : this.displayMode === 'clearance-audit'
              ? 3
              : 0;
      gl.uniform1i(gl.getUniformLocation(this.meshProg, 'uDisplayMode'), modeInt);
      gl.uniform4f(
        gl.getUniformLocation(this.meshProg, 'uLayerParams'),
        this.layerParams.wheelPolishOpacity,
        this.layerParams.crackOpacity,
        this.layerParams.wetness,
        this.layerParams.weatheringOpacity
      );

      const drawBatchList = (list) => {
        for (const batch of list) {
          if (project.layers && project.layers[batch.layerId] === false) continue;
          const style = MATERIAL_STYLE_TABLE[batch.materialId] || MATERIAL_STYLE_TABLE['concrete-structure'];
          let matColor = style.color;
          let rough = style.rough;
          if (batch.materialId === 'asphalt-wearing') {
            matColor = this.layerParams.asphaltColor;
            rough = this.layerParams.asphaltRoughness;
          } else if (batch.materialId.startsWith('paving-')) {
            matColor = this.layerParams.pavingColor;
            rough = this.layerParams.pavingRoughness;
          } else if (batch.materialId === 'curb-granite') {
            matColor = this.layerParams.curbColor;
            rough = this.layerParams.curbRoughness;
          }

          gl.uniform3fv(gl.getUniformLocation(this.meshProg, 'uMatColor'), matColor);
          const tex = this.textures.get(batch.materialId);
          gl.uniform4f(
            gl.getUniformLocation(this.meshProg, 'uMatParams'),
            rough,
            style.metal,
            style.emissive,
            tex ? 1.0 : 0.0
          );
          gl.uniform1i(gl.getUniformLocation(this.meshProg, 'uMatKind'), style.kind || 0);

          if (tex) {
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.uniform1i(gl.getUniformLocation(this.meshProg, 'uTex'), 0);
          }

          gl.bindVertexArray(batch.vao);
          gl.drawElements(gl.TRIANGLES, batch.count, gl.UNSIGNED_INT, 0);
        }
      };

      drawBatchList(this.staticGpuBatches);
      drawBatchList(this.dynamicGpuBatches);

      // 3. Draw True 4-Sided Quad Topology Wireframe Overlay (Never internal triangle diagonals!)
      if ((this.showQuadOverlay || this.displayMode === 'quad-wire') && this.quadWireVao && this.quadWireVertexCount > 0) {
        gl.useProgram(this.lineProg);
        gl.uniformMatrix4fv(gl.getUniformLocation(this.lineProg, 'uVP'), false, vpMat);
        const alpha = this.displayMode === 'quad-wire' ? 0.85 : 0.24;
        gl.uniform4f(
          gl.getUniformLocation(this.lineProg, 'uLineColor'),
          0.55 * alpha + 0.12,
          0.78 * alpha + 0.14,
          0.68 * alpha + 0.14,
          1.0
        );
        gl.bindVertexArray(this.quadWireVao);
        gl.drawArrays(gl.LINES, 0, this.quadWireVertexCount);
      }

      gl.bindVertexArray(null);
    }

    // 4. Draw 2D Overlay: Interactive 3D Intersection Gizmo, Spline Curve Handles & Node Labels
    this.renderOverlayGizmos(project, selectedId, vpMat, w, h, dpr);
  }

  renderOverlayGizmos(project, selectedId, vpMat, w, h, dpr) {
    const ctx = this.ctx2d;
    if (!ctx) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    this.screenGizmoHandles = [];

    // Draw subtle clickable badges on all Merged Intersections (+ / Y / T)
    for (const junc of this.mergedIntersections) {
      const sp = projectPointToScreen(junc.hub, vpMat, w, h);
      if (!sp) continue;
      const isSel = selectedId === junc.node.id;
      ctx.save();
      ctx.beginPath();
      ctx.arc(sp[0], sp[1], isSel ? 9 : 6, 0, Math.PI * 2);
      ctx.fillStyle = isSel ? '#82e3c3' : 'rgba(32, 34, 38, 0.88)';
      ctx.fill();
      ctx.lineWidth = isSel ? 2.5 : 1.5;
      ctx.strokeStyle = isSel ? '#ffffff' : '#95a5c6';
      ctx.stroke();

      // Label above intersection
      ctx.font = '600 10px "DM Sans", system-ui, sans-serif';
      const label = `${junc.node.name} (${junc.arms.length}-Arm Quad Mesh)`;
      const tw = ctx.measureText(label).width;
      ctx.fillStyle = isSel ? 'rgba(18, 28, 25, 0.92)' : 'rgba(18, 18, 20, 0.78)';
      ctx.beginPath();
      ctx.roundRect(sp[0] - tw * 0.5 - 7, sp[1] - 28, tw + 14, 17, 5);
      ctx.fill();
      ctx.strokeStyle = isSel ? '#82e3c3' : '#3a3a3e';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = isSel ? '#82e3c3' : '#cfcfcf';
      ctx.fillText(label, sp[0] - tw * 0.5, sp[1] - 16);
      ctx.restore();
    }

    // If an Intersection Node is selected (or default to Central Intersection so Gizmo is immediately usable!),
    // draw full 3D Transform + Radius Ring Gizmo right on the intersection!
    const activeNode =
      project.nodes.find((n) => n.id === selectedId) ||
      project.nodes.find((n) => n.id === 'node-center') ||
      project.nodes[0];

    if (activeNode) {
      const origin = activeNode.position;
      const pOrig = projectPointToScreen(origin, vpMat, w, h);
      const axisLen = Math.max(8.5, (activeNode.radius || 9.5) * 1.05);

      if (pOrig) {
        // 1. Outer Fillet Radius Ring in XZ plane (Draggable to adjust intersection radius at once!)
        const ringRad = activeNode.radius || 9.5;
        ctx.save();
        ctx.beginPath();
        let ringHandlePt = null;
        for (let i = 0; i <= 48; i++) {
          const a = (i / 48) * Math.PI * 2;
          const wp = [origin[0] + Math.cos(a) * ringRad, origin[1] + 0.15, origin[2] + Math.sin(a) * ringRad];
          const spt = projectPointToScreen(wp, vpMat, w, h);
          if (spt) {
            if (i === 0) ctx.moveTo(spt[0], spt[1]);
            else ctx.lineTo(spt[0], spt[1]);
            if (i === 6) ringHandlePt = { screen: spt, world: wp };
          }
        }
        ctx.strokeStyle = 'rgba(232, 199, 106, 0.85)';
        ctx.setLineDash([5, 4]);
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        if (ringHandlePt) {
          ctx.fillStyle = '#e8c76a';
          ctx.beginPath();
          ctx.arc(ringHandlePt.screen[0], ringHandlePt.screen[1], 7, 0, Math.PI * 2);
          ctx.fill();
          this.screenGizmoHandles.push({
            axis: 'radius',
            nodeId: activeNode.id,
            x: ringHandlePt.screen[0],
            y: ringHandlePt.screen[1],
            r: 14,
          });
        }

        // 2. X, Y (Elevation), Z Axis Gizmo Arrows
        const axes = [
          { id: 'x', dir: [1, 0, 0], color: '#ef6b6b', label: 'X' },
          { id: 'y', dir: [0, 1, 0], color: '#7fe3b2', label: 'Y (Elev)' },
          { id: 'z', dir: [0, 0, 1], color: '#6ba8ef', label: 'Z' },
        ];
        for (const ax of axes) {
          const tipWorld = madd(origin, ax.dir, axisLen);
          const pTip = projectPointToScreen(tipWorld, vpMat, w, h);
          if (!pTip) continue;
          ctx.save();
          ctx.strokeStyle = ax.color;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(pOrig[0], pOrig[1]);
          ctx.lineTo(pTip[0], pTip[1]);
          ctx.stroke();

          ctx.fillStyle = ax.color;
          ctx.beginPath();
          ctx.arc(pTip[0], pTip[1], 7.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#101010';
          ctx.font = 'bold 9px sans-serif';
          ctx.fillText(ax.id.toUpperCase(), pTip[0] - 3, pTip[1] + 3);
          ctx.restore();

          this.screenGizmoHandles.push({
            axis: ax.id,
            nodeId: activeNode.id,
            x: pTip[0],
            y: pTip[1],
            r: 15,
          });
        }

        // 3. Center Planar XZ Free-Move Gizmo Handle
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#141414';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(pOrig[0], pOrig[1], 8.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        this.screenGizmoHandles.push({
          axis: 'xz',
          nodeId: activeNode.id,
          x: pOrig[0],
          y: pOrig[1],
          r: 16,
        });
      }
    }

    // If a Road Spline is selected, draw its draggable Curve Midpoint Handle!
    const selectedRoad = project.roads.find((r) => r.id === selectedId);
    if (selectedRoad) {
      const n0 = project.nodes.find((n) => n.id === selectedRoad.start);
      const n1 = project.nodes.find((n) => n.id === selectedRoad.end);
      if (n0 && n1) {
        const midPt = selectedRoad.curvePoint || lerp3(n0.position, n1.position, 0.5);
        const sMid = projectPointToScreen(midPt, vpMat, w, h);
        if (sMid) {
          ctx.save();
          ctx.fillStyle = '#d5a4c4';
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.rect(sMid[0] - 7, sMid[1] - 7, 14, 14);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
          this.screenGizmoHandles.push({
            axis: 'road-curve',
            roadId: selectedRoad.id,
            x: sMid[0],
            y: sMid[1],
            r: 16,
          });
        }
      }
    }
  }

  bindInteractionEvents() {
    let dragState = null;

    this.overlay.addEventListener('pointerdown', (e) => {
      const rect = this.overlay.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;

      // 1. Check if user clicked on a 3D Gizmo Handle (X, Y, Z, XZ, Radius, or Spline Curve handle)
      for (const h of this.screenGizmoHandles || []) {
        if (Math.hypot(sx - h.x, sy - h.y) <= h.r) {
          this.overlay.setPointerCapture(e.pointerId);
          dragState = {
            mode: 'gizmo',
            handle: h,
            startX: sx,
            startY: sy,
          };
          if (h.nodeId) this.callbacks.onSelect?.(h.nodeId);
          if (h.roadId) this.callbacks.onSelect?.(h.roadId);
          return;
        }
      }

      // 2. If in Draw Road Spline mode, place/connect spline point on ground plane!
      if (this.callbacks.getActiveTool?.() === 'draw-road') {
        const ray = createCameraRay(sx, sy, rect.width, rect.height, this.getEyePosition(), this.target, this.fov);
        const groundHit = intersectRayPlaneY(ray, 0);
        if (groundHit) {
          this.callbacks.onDrawRoadPoint?.(groundHit);
          return;
        }
      }

      // 3. Otherwise start camera orbit/pan OR click-pick object on pointerup
      this.overlay.setPointerCapture(e.pointerId);
      dragState = {
        mode: e.button === 2 || e.shiftKey ? 'pan' : 'orbit',
        startX: sx,
        startY: sy,
        lastX: sx,
        lastY: sy,
        moved: false,
      };
    });

    this.overlay.addEventListener('pointermove', (e) => {
      if (!dragState) return;
      const rect = this.overlay.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      const dx = sx - (dragState.lastX ?? dragState.startX);
      const dy = sy - (dragState.lastY ?? dragState.startY);
      dragState.lastX = sx;
      dragState.lastY = sy;

      if (Math.hypot(sx - dragState.startX, sy - dragState.startY) > 4) {
        dragState.moved = true;
      }

      if (dragState.mode === 'gizmo') {
        const h = dragState.handle;
        const ray = createCameraRay(sx, sy, rect.width, rect.height, this.getEyePosition(), this.target, this.fov);
        this.callbacks.onGizmoDrag?.(h, ray, dx, dy);
      } else if (dragState.mode === 'orbit') {
        this.yaw -= dx * 0.0065;
        this.pitch = clamp(this.pitch + dy * 0.0055, 0.08, 1.48);
      } else if (dragState.mode === 'pan') {
        const eye = this.getEyePosition();
        const fwd = norm(sub(this.target, eye));
        const right = norm(cross(fwd, [0, 1, 0]));
        const flatFwd = norm([fwd[0], 0, fwd[2]]);
        const panScale = this.distance * 0.0016;
        this.target[0] -= (right[0] * dx - flatFwd[0] * dy) * panScale;
        this.target[2] -= (right[2] * dx - flatFwd[2] * dy) * panScale;
      }
    });

    const endPointer = (e) => {
      if (!dragState) return;
      const rect = this.overlay.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;

      if (!dragState.moved && dragState.mode !== 'gizmo') {
        this.pickAtScreen(sx, sy, rect.width, rect.height);
      }
      dragState = null;
    };

    this.overlay.addEventListener('pointerup', endPointer);
    this.overlay.addEventListener('pointercancel', endPointer);
    this.overlay.addEventListener('contextmenu', (e) => e.preventDefault());
    this.overlay.addEventListener(
      'wheel',
      (e) => {
        e.preventDefault();
        this.distance = clamp(this.distance * (1 + e.deltaY * 0.001), 10, 260);
      },
      { passive: false }
    );
  }

  pickAtScreen(sx, sy, width, height) {
    const ray = createCameraRay(sx, sy, width, height, this.getEyePosition(), this.target, this.fov);
    let bestHit = null;
    let bestT = Infinity;

    // Prioritize Merged Intersections first so clicking near an intersection reliably selects it!
    for (const p of this.pickables) {
      const t = intersectRaySphere(ray, p.center, p.radius || 7.5);
      if (t !== null) {
        const priorityBias = p.kind === 'node' ? -5.0 : 0.0;
        if (t + priorityBias < bestT) {
          bestT = t + priorityBias;
          bestHit = p;
        }
      }
      if (p.samples) {
        for (const sPt of p.samples) {
          const ts = intersectRaySphere(ray, sPt, 5.5);
          if (ts !== null && ts < bestT) {
            bestT = ts;
            bestHit = p;
          }
        }
      }
    }

    if (bestHit) {
      this.callbacks.onSelect?.(bestHit.id);
    }
  }
}

  handleDrawSplineRoadClick(worldPt) {
    const pt = [Math.round(worldPt[0] * 2) / 2, 0, Math.round(worldPt[2] * 2) / 2];
    // Snap to existing node if within 11m
    let targetNode = this.project.nodes.find((n) => distXZ(n.position, pt) < 11.0);
    if (!targetNode) {
      targetNode = {
        id: `node-${Date.now().toString(36)}`,
        name: `Junction Node ${this.project.nodes.length + 1}`,
        position: pt,
        radius: 9.5,
        crossings: true,
        bollards: true,
      };
      this.project.nodes.push(targetNode);
    }

    if (!this.pendingDrawNodeId) {
      this.pendingDrawNodeId = targetNode.id;
      this.selectedId = targetNode.id;
      this.renderRightPanels();
    } else if (this.pendingDrawNodeId !== targetNode.id) {
      const startNode = this.project.nodes.find((n) => n.id === this.pendingDrawNodeId);
      const mid = lerp3(startNode.position, targetNode.position, 0.5);
      // Slight natural spline curve offset that user can sculpt with the curve gizmo
      const newRoad = {
        id: `road-${Date.now().toString(36)}`,
        name: `Curved Corridor ${this.project.roads.length + 1}`,
        roadClass: 'urban',
        start: startNode.id,
        end: targetNode.id,
        curvePoint: [mid[0] + 4, 0, mid[2] - 4],
        lanes: 2,
        laneWidth: 3.5,
        sidewalkWidth: 3.6,
        curbWidth: 0.18,
        curbHeight: 0.145,
        pavingPattern: 'herringbone',
        guardrails: false,
        bollards: true,
        bollardStyle: 'heritage',
        streetlights: true,
        parking: true,
      };
      this.project.roads.push(newRoad);
      this.pendingDrawNodeId = targetNode.id;
      this.selectedId = newRoad.id;
      // Recompiling automatically splits & merges any crossed road splines into clean + or Y quad intersections!
      this.recompileNetwork();
      this.renderRightPanels();
    }
  }

  handleGizmoDrag(handle, ray, dx, dy) {
    if (handle.axis === 'road-curve') {
      const road = this.project.roads.find((r) => r.id === handle.roadId);
      if (!road) return;
      const hit = intersectRayPlaneY(ray, 0);
      if (hit) {
        road.curvePoint = [Math.round(hit[0] * 10) / 10, 0, Math.round(hit[2] * 10) / 10];
        this.recompileNetwork();
        this.renderInspector();
      }
      return;
    }

    const node = this.project.nodes.find((n) => n.id === handle.nodeId);
    if (!node) return;

    if (handle.axis === 'y') {
      node.position[1] = clamp(Number((node.position[1] - dy * 0.12).toFixed(2)), -8.0, 14.0);
    } else if (handle.axis === 'radius') {
      const hit = intersectRayPlaneY(ray, node.position[1]);
      if (hit) {
        node.radius = clamp(Number(distXZ(node.position, hit).toFixed(1)), 3.0, 24.0);
      }
    } else {
      const hit = intersectRayPlaneY(ray, node.position[1]);
      if (hit) {
        if (handle.axis === 'x') node.position[0] = Math.round(hit[0] * 2) / 2;
        else if (handle.axis === 'z') node.position[2] = Math.round(hit[2] * 2) / 2;
        else {
          node.position[0] = Math.round(hit[0] * 2) / 2;
          node.position[2] = Math.round(hit[2] * 2) / 2;
        }
      }
    }
    this.recompileNetwork();
    this.renderInspector();
  }

  addMergedBranchSpline() {
    // Creates a new spline road that crosses or joins the network to demonstrate live + / Y quad intersection merging!
    const idx = this.project.roads.length + 1;
    const nA = {
      id: `node-branch-a-${idx}`,
      name: `Branch Origin ${idx}`,
      position: [-42, 0, -56],
      radius: 9.0,
      crossings: true,
    };
    const nB = {
      id: `node-branch-b-${idx}`,
      name: `Branch Terminus ${idx}`,
      position: [-18, 0, 52],
      radius: 9.0,
      crossings: true,
    };
    this.project.nodes.push(nA, nB);
    const branchRoad = {
      id: `road-branch-${idx}`,
      name: `Cross-Avenue Spline ${idx}`,
      roadClass: 'urban',
      start: nA.id,
      end: nB.id,
      curvePoint: [-32, 0, 2],
      lanes: 2,
      laneWidth: 3.5,
      sidewalkWidth: 3.5,
      pavingPattern: 'cobble-fan',
      bollards: true,
      bollardStyle: 'stainless',
      streetlights: true,
    };
    this.project.roads.push(branchRoad);
    this.recompileNetwork();
    // Select and frame the newly created merged intersection node!
    const newestMerged = this.project.nodes[this.project.nodes.length - 1];
    if (newestMerged) this.selectedId = newestMerged.id;
    this.renderRightPanels();
    this.frameSelected();
  }

  addPotholeAndSpeedBump() {
    const road = this.project.roads.find((r) => r.id === this.selectedId) || this.project.roads[0];
    if (!road) return;
    const align = this.compiled?.alignmentsMap.get(road.id);
    if (!align) return;
    const midSt = align.stations[Math.floor(align.stations.length * 0.45)];
    const newPh = {
      id: `pothole-${Date.now().toString(36)}`,
      name: `Spalled Asphalt Pothole ${this.project.potholes.length + 1}`,
      roadId: road.id,
      position: [midSt.p[0] + midSt.n[0] * 1.6, midSt.p[1], midSt.p[2] + midSt.n[2] * 1.6],
      radius: 1.5,
      depth: 0.095,
      waterPuddle: true,
      enabled: true,
    };
    this.project.potholes.push(newPh);
    this.selectedId = newPh.id;
    this.recompileNetwork();
    this.renderRightPanels();
    this.frameSelected();
  }

  frameSelected() {
    const pick = this.compiled?.builder.pickables.find((p) => p.id === this.selectedId);
    if (pick) {
      this.renderer.framePosition(pick.center, Math.max(28, (pick.radius || 10) * 3.6));
    }
  }

  recompileNetwork() {
    this.compiled = buildCompleteSceneQuadGeometry(this.project, this.trafficSim.time);
    this.renderer.uploadStaticScene(this.compiled, this.project.textureLayers);
    this.trafficSim.syncFleet(this.project, this.compiled.alignmentsMap);
    const fleetBuilder = this.trafficSim.buildDynamicFleetQuads(this.project, this.compiled.alignmentsMap);
    this.renderer.uploadDynamicFleet(fleetBuilder);

    // Update Bottom Telemetry Bar
    const s = this.compiled.stats;
    const setTxt = (id, val) => {
      const el = document.getElementById(id);
      if (el) el.textContent = val;
    };
    setTxt('stat-quads', s.quadCount.toLocaleString('en-US'));
    setTxt('stat-tris', s.triangleCount.toLocaleString('en-US'));
    setTxt('stat-juncs', `${s.intersectionCount} (${this.project.nodes.length} Nodes)`);
    setTxt('stat-clearance', `${s.minBridgeClearance.toFixed(2)} m`);
    setTxt('stat-traffic', `${this.trafficSim.vehicles.length} / ${MAX_AI_VEHICLES} Cars · 2 Trains`);
    setTxt('project-bottom-name', this.project.name.split('·')[0].trim());
  }

  renderRightPanels() {
    this.renderStackTree();
    this.renderInspector();
  }

  renderStackTree() {
    const container = document.getElementById('stack-tree-container');
    const headingTitle = document.getElementById('stack-heading-title');
    if (!container) return;

    if (this.stackTab === 'texture') {
      const layers = this.project.textureLayers.filter(
        (l) => !this.searchQuery || l.name.toLowerCase().includes(this.searchQuery) || l.category.toLowerCase().includes(this.searchQuery)
      );
      headingTitle.innerHTML = `PBR Texture Stack <span>${layers.length.toString().padStart(2, '0')}</span>`;

      container.innerHTML = `
        <div class="group">
          <div class="group-header-row">
            <span class="group-label">${SVG_ICONS.texture} Surface & Decal Layers <span class="group-count">${layers.length}</span></span>
          </div>
          ${layers
            .map((layer, idx) => {
              const isSel = this.selectedId === layer.id;
              return `
                <div class="tree-row ${isSel ? 'selected' : ''} ${layer.enabled === false ? 'hidden-object' : ''}" style="--entity-color:${layer.color}" data-select-id="${layer.id}">
                  <button class="object-button" data-select-btn="${layer.id}">
                    <span style="width:10px;height:10px;border-radius:3px;background:${layer.baseColor};border:1px solid #666;flex-shrink:0"></span>
                    <span>${idx + 1}. ${layer.name}</span>
                    <small>${layer.blendMode}</small>
                  </button>
                  <div class="layer-order-btns">
                    <button title="Move layer up" data-move-layer="${layer.id}" data-dir="-1">▲</button>
                    <button title="Move layer down" data-move-layer="${layer.id}" data-dir="1">▼</button>
                  </div>
                  <button class="visibility" title="Toggle texture layer" data-toggle-tex="${layer.id}">
                    ${layer.enabled === false ? SVG_ICONS.eyeOff : SVG_ICONS.eye}
                  </button>
                </div>
              `;
            })
            .join('')}
        </div>
      `;

      container.querySelectorAll('[data-select-btn]').forEach((btn) => {
        btn.addEventListener('click', () => {
          this.selectedId = btn.dataset.selectBtn;
          this.renderRightPanels();
        });
      });

      container.querySelectorAll('[data-toggle-tex]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const layer = this.project.textureLayers.find((l) => l.id === btn.dataset.toggleTex);
          if (layer) {
            layer.enabled = layer.enabled === false;
            this.renderer.rebuildTextures(this.project.textureLayers);
            this.renderRightPanels();
          }
        });
      });

      container.querySelectorAll('[data-move-layer]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.moveLayer;
          const dir = Number(btn.dataset.dir);
          const idx = this.project.textureLayers.findIndex((l) => l.id === id);
          const targetIdx = idx + dir;
          if (idx >= 0 && targetIdx >= 0 && targetIdx < this.project.textureLayers.length) {
            const arr = this.project.textureLayers;
            [arr[idx], arr[targetIdx]] = [arr[targetIdx], arr[idx]];
            this.renderer.rebuildTextures(this.project.textureLayers);
            this.renderRightPanels();
          }
        });
      });
      return;
    }

    // Mode 1: Network & Scene Layer Stack (Outliner)
    const groups = [
      {
        title: 'Merged Quad Intersections',
        layerKey: 'intersections',
        color: '#82e3c3',
        icon: SVG_ICONS.intersection,
        items: this.project.nodes.map((n) => ({
          id: n.id,
          name: n.name,
          badge: `R${n.radius}m`,
          enabled: true,
          kind: 'node',
        })),
      },
      {
        title: 'Road Splines & Bridges',
        layerKey: 'roads',
        color: '#95a5c6',
        icon: SVG_ICONS.road,
        items: this.project.roads.map((r) => ({
          id: r.id,
          name: r.name,
          badge: r.verticalProfile === 'bridge-arch' ? 'Bridge' : r.verticalProfile === 'underpass-dip' ? 'Tunnel' : `${r.lanes}L`,
          enabled: r.enabled !== false,
          kind: 'road',
        })),
      },
      {
        title: 'Railways, Trains & Subway',
        layerKey: 'railways',
        color: '#e8b65f',
        icon: SVG_ICONS.train,
        items: [
          ...(this.project.railways || []).map((r) => ({
            id: r.id,
            name: r.name,
            badge: '2-Track + Train',
            enabled: r.enabled !== false,
            kind: 'railway',
          })),
          ...(this.project.subways || []).map((s) => ({
            id: s.id,
            name: s.name,
            badge: 'Underground',
            enabled: s.enabled !== false,
            kind: 'subway',
          })),
        ],
      },
      {
        title: 'Construction, Potholes & Bumps',
        layerKey: 'construction',
        color: '#e69c79',
        icon: SVG_ICONS.construction,
        items: [
          ...(this.project.constructionZones || []).map((c) => ({
            id: c.id,
            name: c.name,
            badge: 'Trench + Bot',
            enabled: c.enabled !== false,
            kind: 'construction',
          })),
          ...(this.project.potholes || []).map((p) => ({
            id: p.id,
            name: p.name,
            badge: '3D Pothole',
            enabled: p.enabled !== false,
            kind: 'pothole',
          })),
          ...(this.project.speedBumps || []).map((b) => ({
            id: b.id,
            name: b.name,
            badge: 'Speed Bump',
            enabled: b.enabled !== false,
            kind: 'speed-bump',
          })),
        ],
      },
      {
        title: 'City Blocks (No Buildings) & Traffic',
        layerKey: 'blocks',
        color: '#bea4e1',
        icon: SVG_ICONS.car,
        items: [
          ...(this.project.cityBlocks || []).map((b) => ({
            id: b.id,
            name: b.name,
            badge: b.pavingPattern,
            enabled: b.enabled !== false,
            kind: 'block',
          })),
          {
            id: 'ai-traffic-controller',
            name: `AI Traffic Fleet (${this.project.trafficCount} / 25 Cars)`,
            badge: '≤25 AI',
            enabled: this.project.layers.traffic !== false,
            kind: 'traffic',
          },
        ],
      },
    ];

    const totalItems = groups.reduce((acc, g) => acc + g.items.length, 0);
    headingTitle.innerHTML = `Network Layer Stack <span>${totalItems.toString().padStart(2, '0')}</span>`;

    container.innerHTML = groups
      .map((group) => {
        const filtered = group.items.filter(
          (it) => !this.searchQuery || it.name.toLowerCase().includes(this.searchQuery) || it.badge.toLowerCase().includes(this.searchQuery)
        );
        if (!filtered.length) return '';
        const groupVisible = this.project.layers[group.layerKey] !== false;
        return `
          <div class="group">
            <div class="group-header-row">
              <span class="group-label">${group.icon} ${group.title} <span class="group-count">${filtered.length}</span></span>
              <button class="visibility" title="Toggle group layer visibility" data-toggle-group="${group.layerKey}">
                ${groupVisible ? SVG_ICONS.eye : SVG_ICONS.eyeOff}
              </button>
            </div>
            ${filtered
              .map((item) => {
                const isSel = this.selectedId === item.id;
                return `
                  <div class="tree-row ${isSel ? 'selected' : ''} ${!item.enabled ? 'hidden-object' : ''}" style="--entity-color:${group.color}">
                    <button class="object-button" data-select-item="${item.id}">
                      ${group.icon}
                      <span>${item.name}</span>
                      <small>${item.badge}</small>
                    </button>
                    <button class="visibility" title="Toggle item" data-toggle-item="${item.id}" data-item-kind="${item.kind}">
                      ${item.enabled ? SVG_ICONS.eye : SVG_ICONS.eyeOff}
                    </button>
                  </div>
                `;
              })
              .join('')}
          </div>
        `;
      })
      .join('');

    container.querySelectorAll('[data-select-item]').forEach((btn) => {
      btn.addEventListener('click', () => {
        this.selectedId = btn.dataset.selectItem;
        this.renderRightPanels();
      });
      btn.addEventListener('dblclick', () => {
        this.selectedId = btn.dataset.selectItem;
        this.renderRightPanels();
        this.frameSelected();
      });
    });

    container.querySelectorAll('[data-toggle-group]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const k = btn.dataset.toggleGroup;
        this.project.layers[k] = this.project.layers[k] === false;
        this.renderRightPanels();
      });
    });

    container.querySelectorAll('[data-toggle-item]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.toggleItem;
        const allLists = [
          this.project.roads,
          this.project.railways || [],
          this.project.subways || [],
          this.project.constructionZones || [],
          this.project.potholes || [],
          this.project.speedBumps || [],
          this.project.cityBlocks || [],
        ];
        if (id === 'ai-traffic-controller') {
          this.project.layers.traffic = this.project.layers.traffic === false;
        } else {
          for (const list of allLists) {
            const found = list.find((x) => x.id === id);
            if (found) {
              found.enabled = found.enabled === false;
              break;
            }
          }
        }
        this.recompileNetwork();
        this.renderRightPanels();
      });
    });
  }

  renderInspector() {
    const panel = document.getElementById('inspector-panel');
    if (!panel) return;

    // 1. Check if a Texture Layer is selected
    const texLayer = this.project.textureLayers.find((l) => l.id === this.selectedId);
    if (texLayer) {
      this.renderTextureLayerInspector(panel, texLayer);
      return;
    }

    // 2. Check if an Intersection Node is selected
    const node = this.project.nodes.find((n) => n.id === this.selectedId);
    if (node) {
      this.renderIntersectionNodeInspector(panel, node);
      return;
    }

    // 3. Check if a Road Spline / Bridge / Tunnel is selected
    const road = this.project.roads.find((r) => r.id === this.selectedId);
    if (road) {
      this.renderRoadInspector(panel, road);
      return;
    }

    // 4. Check if Construction Zone / Pothole / Speed Bump / Railway / Subway / Block / Traffic is selected
    this.renderFeatureOrTrafficInspector(panel);
  }

  drawMaterialPreviewSphere(canvas, layer) {
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    const n = canvas.width;
    const img = ctx.createImageData(n, n);
    const d = img.data;
    const clean = (layer.baseColor || '#444444').replace('#', '');
    const base = [
      (parseInt(clean.slice(0, 2), 16) || 80) / 255,
      (parseInt(clean.slice(2, 4), 16) || 80) / 255,
      (parseInt(clean.slice(4, 6), 16) || 80) / 255,
    ];
    const rough = Math.max(0.06, layer.roughness);
    const normAmt = layer.normalStrength;

    for (let y = 0; y < n; y++) {
      for (let x = 0; x < n; x++) {
        const i = (y * n + x) * 4;
        const nx = ((x / n - 0.5) * 2.3);
        const ny = ((0.48 - y / n) * 2.3);
        const r2 = nx * nx + ny * ny;
        if (r2 <= 1.0) {
          let z = Math.sqrt(1.0 - r2);
          const grain = Math.sin(nx * 36 * layer.scale) * Math.cos(ny * 36 * layer.scale) * normAmt * 0.12;
          const ndl = Math.max(0, -(nx + grain) * 0.45 + (ny + grain) * 0.62 + z * 0.64);
          const ndh = Math.max(0, -(nx + grain) * 0.25 + (ny + grain) * 0.35 + z * 0.9);
          const spec = Math.pow(ndh, Math.max(2, 2 / (rough * rough))) * (1 - rough * 0.75);
          for (let k = 0; k < 3; k++) {
            const v = base[k] * (0.22 + ndl * 0.78) + spec * 0.85;
            d[i + k] = Math.round(clamp(v, 0, 1) * 255);
          }
          d[i + 3] = 255;
        } else {
          d[i] = 24; d[i + 1] = 25; d[i + 2] = 28; d[i + 3] = 255;
        }
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  exportTrueQuadOBJ() {
    if (!this.compiled) return;
    const lines = ['# Frontier Road Generator Studio — True 4-Vertex Quad Topology OBJ Export'];
    let vOffset = 1;
    for (const batch of this.compiled.builder.batches.values()) {
      lines.push(`o ${batch.layerId}_${batch.materialId}`);
      for (let i = 0; i < batch.positions.length; i += 3) {
        lines.push(`v ${batch.positions[i].toFixed(4)} ${batch.positions[i + 1].toFixed(4)} ${batch.positions[i + 2].toFixed(4)}`);
      }
      for (const [q0, q1, q2, q3] of batch.quads) {
        lines.push(`f ${q0 + vOffset} ${q1 + vOffset} ${q2 + vOffset} ${q3 + vOffset}`);
      }
      vOffset += batch.positions.length / 3;
    }
    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${this.project.id}-quad-roads.obj`;
    a.click();
    URL.revokeObjectURL(url);
  }

  startLoop() {
    let last = performance.now();
    const tick = (now) => {
      const dt = (now - last) * 0.001;
      last = now;
      if (this.simPlaying && this.compiled) {
        this.trafficSim.step(dt, this.project, this.compiled.alignmentsMap);
        const fleetBuilder = this.trafficSim.buildDynamicFleetQuads(this.project, this.compiled.alignmentsMap);
        this.renderer.uploadDynamicFleet(fleetBuilder);
      }
      this.renderer.render(this.project, this.selectedId);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

          this.renderRightPanels();
        }
      },
    };
