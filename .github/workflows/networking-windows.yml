name: Project-Networking Windows binary
on:
  push:
    branches: [arena/78cde81c-frontier]
    paths:
      - '.github/workflows/networking-windows.yml'
      - 'Frontier/Projects/Project-Networking/**'
      - 'VisualProof/Networking/**'
      - 'Docs/NetworkingLogin.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest Slate branch for its real project ABI
        uses: actions/checkout@v4
        with:
          repository: unassignedinbox/Slate
          ref: arena/01a0fd48-slate
          path: _AgentScratch/Slate
          sparse-checkout: |
            Frontier/Engine/ProjectInterchange
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Fetch pinned GLFW
        uses: actions/checkout@v4
        with:
          repository: glfw/glfw
          ref: 7b6aead9fb88b3623e3b3725ebb42670cbe4c579
          path: _AgentScratch/Gui/glfw
          persist-credentials: false
      - name: Fetch pinned Dear ImGui
        uses: actions/checkout@v4
        with:
          repository: ocornut/imgui
          ref: f5befd2d29e66809cd1110a152e375a7f1981f06
          path: _AgentScratch/Gui/imgui
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify EOS SDK (never included in Git or uploaded as an SDK artifact)
        shell: pwsh
        run: |
          python -m pip install gdown==5.2.0
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python Frontier/Projects/Project-Networking/Build/FetchWindowsSdk.py "$env:RUNNER_TEMP/EOS"
          if ($LASTEXITCODE -ne 0) { throw 'SDK fetch or hash verification failed' }
      - name: Prepare software OpenGL for headless CI only
        shell: pwsh
        run: |
          $Archive = "$env:RUNNER_TEMP/mesa.7z"
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile $Archive
          if ((Get-FileHash $Archive -Algorithm SHA256).Hash -ne '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695') {
            throw 'Mesa hash mismatch'
          }
          & 7z x $Archive "-o$env:RUNNER_TEMP/Mesa" -y
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
      - name: Build with MSVC x64 C++20 MD and run real SDK smoke checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap { Write-Host "::error::$($_.Exception.Message)"; exit 1 }
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VisualStudio = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $VisualStudio) { throw 'Visual Studio C++ tools not found' }
          $VcVars = Join-Path $VisualStudio 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$VcVars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Set-Item "Env:$($Matches[1])" $Matches[2] }
          }
          $Project = Join-Path $env:GITHUB_WORKSPACE 'Frontier/Projects/Project-Networking'
          & "$Project/Build/ToolchainSequence.ps1" -SdkRoot "$env:RUNNER_TEMP/EOS" -SlateRoot "$env:GITHUB_WORKSPACE/_AgentScratch/Slate" -GuiRoot "$env:GITHUB_WORKSPACE/_AgentScratch/Gui"
          $Output = "$Project/Build/Output"
          Start-Transcript -Path "$Output/WindowsChecks.log"
          try {
            & "$Output/LoginHost.exe" --sdk-check
            if ($LASTEXITCODE -ne 0) { throw 'Real EOS initialization/shutdown failed' }
            $Lifecycle = & "$Output/LoginHost.exe" --lifecycle-check
            if ($LASTEXITCODE -ne 0) { throw 'Same-process SDK lifecycle regression' }
            $Lifecycle | Write-Host
            if (($Lifecycle | Where-Object { $_ -eq 'sdk_initialized_once=1' }).Count -ne 1 -or
                ($Lifecycle | Where-Object { $_ -eq 'sdk_shutdown_once=1' }).Count -ne 1 -or
                ($Lifecycle -match 'EOS_AlreadyConfigured')) { throw 'Unexpected SDK reinitialization' }
            & "$Output/LoginHost.exe"
            if ($LASTEXITCODE -ne 2) { throw 'Missing-secret refusal did not fail closed' }
            $Check = "$env:GITHUB_WORKSPACE/VisualProof/Networking/LoginSequenceChecks.cpp"
            & cl.exe /nologo /std:c++20 /MD /EHsc /W4 /utf-8 $Check "/Fe:$Output/LoginSequenceChecks.exe" "/Fo:$Output/LoginSequenceChecks.obj"
            if ($LASTEXITCODE -ne 0) { throw 'Login checks compilation failed' }
            & "$Output/LoginSequenceChecks.exe"
            if ($LASTEXITCODE -ne 0) { throw 'Login checks failed' }
            # Hosted runner has no hardware OpenGL ICD. These DLLs are NOT shipped.
            Copy-Item "$env:RUNNER_TEMP/Mesa/x64/*.dll" $Output -Force
            $env:GALLIUM_DRIVER = 'llvmpipe'
            $Window = Start-Process -FilePath "$Output/NetworkingLogin.exe" -ArgumentList '--ui-smoke' -WorkingDirectory $Output -PassThru
            if (-not $Window.WaitForExit(60000)) {
              $Window.Kill()
              throw 'Window smoke check timed out'
            }
            if ($Window.ExitCode -ne 0) {
              if (Test-Path "$Output/WindowChecks.log") {
                $Detail = (Get-Content "$Output/WindowChecks.log" -Raw).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Host "::error::$Detail"
              }
              throw "GLFW/ImGui window check failed: $($Window.ExitCode)"
            }
            if (-not (Test-Path "$Output/WindowProof.bmp")) { throw 'Window screenshot missing' }
            Get-Content "$Output/WindowChecks.log"
            Write-Host 'PASS Windows build and SDK smoke checks. PLAYER AUTHENTICATION NOT ATTEMPTED.'
          } finally {
            Stop-Transcript
          }
      - name: Package binaries with EOS runtime, without credentials
        shell: pwsh
        run: |
          $Project = 'Frontier/Projects/Project-Networking'
          $Package = '_AgentScratch/Package/Project-Networking'
          New-Item -ItemType Directory -Force "$Package/Build/Output", "$Package/Content/Scenes" | Out-Null
          foreach ($Name in @('NetworkingLogin.exe', 'ProjectNetworking.dll', 'EOSSDK-Win64-Shipping.dll', 'BuildEvidence.json', 'WindowsChecks.log', 'WindowChecks.log', 'WindowProof.bmp')) {
            Copy-Item "$Project/Build/Output/$Name" "$Package/Build/Output/"
          }
          Move-Item "$Package/Build/Output/NetworkingLogin.exe" "$Package/NetworkingLogin.exe"
          Copy-Item "$Package/Build/Output/EOSSDK-Win64-Shipping.dll" "$Package/EOSSDK-Win64-Shipping.dll"
          Copy-Item '_AgentScratch/Gui/glfw/LICENSE.md' "$Package/GLFW-LICENSE.md"
          Copy-Item '_AgentScratch/Gui/imgui/LICENSE.txt' "$Package/IMGUI-LICENSE.txt"
          Copy-Item "$Project/ProjectNetworking.frontier" "$Package/"
          Copy-Item "$Project/Content/Scenes/Networking.gltf" "$Package/Content/Scenes/"
          Copy-Item Docs/NetworkingLogin.md "$Package/INSTRUCTIONS.md"
          Copy-Item "$Project/Build/BinaryInstructions.txt" "$Package/START-HERE.txt"
          Copy-Item "$Project/Build/ThirdPartyNotices.txt" "$Package/THIRD-PARTY.txt"
          Get-ChildItem $Package -Recurse -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetRelativePath((Resolve-Path $Package), $_.Path))" } |
            Set-Content "$Package/SHA256SUMS.txt"
          Compress-Archive -Path $Package -DestinationPath '_AgentScratch/Project-Networking-Windows-x64.zip'
          $Zip = '_AgentScratch/Project-Networking-Windows-x64.zip'
          "$((Get-FileHash $Zip -Algorithm SHA256).Hash)  Project-Networking-Windows-x64.zip" |
            Set-Content '_AgentScratch/Project-Networking-Windows-x64.zip.sha256'
          Expand-Archive $Zip '_AgentScratch/VerifyPackage'
          $Extracted = (Resolve-Path '_AgentScratch/VerifyPackage/Project-Networking').Path
          # Inject software GL only into the verification directory, never the ZIP.
          Copy-Item "$env:RUNNER_TEMP/Mesa/x64/*.dll" $Extracted -Force
          $env:GALLIUM_DRIVER = 'llvmpipe'
          $Window = Start-Process -FilePath "$Extracted/NetworkingLogin.exe" -ArgumentList '--ui-smoke' -WorkingDirectory $Extracted -PassThru
          if (-not $Window.WaitForExit(60000)) { $Window.Kill(); throw 'Extracted GUI timed out' }
          if ($Window.ExitCode -ne 0) { throw 'Extracted package failed GUI/EOS startup' }
      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: Project-Networking-Windows-x64
          path: _AgentScratch/Project-Networking-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish persistent release download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = "networking-test-$env:GITHUB_RUN_ID"
          $Zip = '_AgentScratch/Project-Networking-Windows-x64.zip'
          gh release view $Tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $Tag $Zip "$Zip.sha256" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $Tag $Zip "$Zip.sha256" --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA --prerelease --title 'Project-Networking - ImGui Windows login app' `
              --notes 'ImGui + GLFW login/friends app. Fixes EOS SDK reinitialization after startup. Adds real friends queries and Epic overlay controls; overlays require official Bootstrapper and redistributable setup. No console. Extract and double-click NetworkingLogin.exe. EOS runtime is included. Window rendering (Mesa software OpenGL) and SDK startup were checked in CI; see included WindowProof.bmp and START-HERE.txt. Developer Authentication Tool and your rotated local client secret are still required. SDK startup checks passed; player authentication was not attempted in CI. This is the networking test project, not the complete Frontier engine.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
