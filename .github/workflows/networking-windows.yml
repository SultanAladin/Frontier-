name: Project-Networking Windows binary
on:
  push:
    branches: [arena/78cde81c-frontier]
    paths:
      - '.github/workflows/networking-windows.yml'
      - 'Frontier/Projects/Project-Networking/**'
      - 'VisualProof/Networking/**'
      - 'Docs/NetworkingLogin.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest Slate branch for its real project ABI
        uses: actions/checkout@v4
        with:
          repository: unassignedinbox/Slate
          ref: arena/01a0fd48-slate
          path: _AgentScratch/Slate
          sparse-checkout: |
            Frontier/Engine/ProjectInterchange
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify EOS SDK (never included in Git or uploaded as an SDK artifact)
        shell: pwsh
        run: |
          python -m pip install gdown==5.2.0
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python Frontier/Projects/Project-Networking/Build/FetchWindowsSdk.py "$env:RUNNER_TEMP/EOS"
          if ($LASTEXITCODE -ne 0) { throw 'SDK fetch or hash verification failed' }
      - name: Build with MSVC x64 C++20 MD and run real SDK smoke checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VisualStudio = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $VisualStudio) { throw 'Visual Studio C++ tools not found' }
          $VcVars = Join-Path $VisualStudio 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$VcVars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Set-Item "Env:$($Matches[1])" $Matches[2] }
          }
          $Project = Join-Path $env:GITHUB_WORKSPACE 'Frontier/Projects/Project-Networking'
          & "$Project/Build/ToolchainSequence.ps1" -SdkRoot "$env:RUNNER_TEMP/EOS" -SlateRoot "$env:GITHUB_WORKSPACE/_AgentScratch/Slate"
          $Output = "$Project/Build/Output"
          Start-Transcript -Path "$Output/WindowsChecks.log"
          try {
            & "$Output/LoginHost.exe" --sdk-check
            if ($LASTEXITCODE -ne 0) { throw 'Real EOS initialization/shutdown failed' }
            & "$Output/LoginHost.exe"
            if ($LASTEXITCODE -ne 2) { throw 'Missing-secret refusal did not fail closed' }
            $Check = "$env:GITHUB_WORKSPACE/VisualProof/Networking/LoginSequenceChecks.cpp"
            & cl.exe /nologo /std:c++20 /MD /EHsc /W4 /utf-8 $Check "/Fe:$Output/LoginSequenceChecks.exe" "/Fo:$Output/LoginSequenceChecks.obj"
            if ($LASTEXITCODE -ne 0) { throw 'Login checks compilation failed' }
            & "$Output/LoginSequenceChecks.exe"
            if ($LASTEXITCODE -ne 0) { throw 'Login checks failed' }
            Write-Host 'PASS Windows build and SDK smoke checks. PLAYER AUTHENTICATION NOT ATTEMPTED.'
          } finally {
            Stop-Transcript
          }
      - name: Package binaries without SDK redistribution or credentials
        shell: pwsh
        run: |
          $Project = 'Frontier/Projects/Project-Networking'
          $Package = '_AgentScratch/Package/Project-Networking'
          New-Item -ItemType Directory -Force "$Package/Build/Output", "$Package/Content/Scenes" | Out-Null
          foreach ($Name in @('LoginHost.exe', 'ProjectNetworking.dll', 'BuildEvidence.json', 'WindowsChecks.log')) {
            Copy-Item "$Project/Build/Output/$Name" "$Package/Build/Output/"
          }
          Copy-Item "$Project/Build/LoginSequence.ps1" "$Package/Build/"
          Copy-Item "$Project/Build/RunLogin.cmd" "$Package/"
          Copy-Item "$Project/ProjectNetworking.frontier" "$Package/"
          Copy-Item "$Project/Content/Scenes/Networking.gltf" "$Package/Content/Scenes/"
          Copy-Item Docs/NetworkingLogin.md "$Package/INSTRUCTIONS.md"
          Copy-Item "$Project/Build/BinaryInstructions.txt" "$Package/START-HERE.txt"
          Get-ChildItem $Package -Recurse -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetRelativePath((Resolve-Path $Package), $_.Path))" } |
            Set-Content "$Package/SHA256SUMS.txt"
          Compress-Archive -Path $Package -DestinationPath '_AgentScratch/Project-Networking-Windows-x64.zip'
      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: Project-Networking-Windows-x64
          path: _AgentScratch/Project-Networking-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
